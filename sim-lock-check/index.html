<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SMARTPHONE SHIFT CHECK TOOL</title>
<meta name="description" content="機種・型番・メーカーで検索し、SIMロックの状態・確認手順・解除方法とキャリアメール持ち運びの要点を一画面で確認できるツール">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c2f34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SMARTPHONE SHIFT">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta property="og:title" content="SMARTPHONE SHIFT CHECK TOOL">
<meta property="og:description" content="SIMロック状態とキャリアメール持ち運びを一画面で確認">
<meta property="og:image" content="icons/title-lockup.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;600;700&family=Share+Tech+Mono&family=Anton&display=swap">
<style>
  /* ============================================================
     近未来コンソール調（濃いグレー基調＋シアン／アンバー）
     手続きの入口（SIMロック解除・メール持ち運び・QR）は白いパネルで強調する
     ============================================================ */
  :root {
    color-scheme: dark;
    --bg: #2c2f34; --bg-2: #33373d; --panel: #3a3f46; --panel-2: #434850;
    --line: #4d535c; --line-strong: #646b75; --well: #25282c;
    --ink: #eef5b8; --strong: #f9ffc9; --muted: #b7ba94; --faint: #8b8e75;
    --accent: #dfff4f; --accent-deep: #97aa35; --accent-ink: #23260e; --accent-soft: rgba(223, 255, 79, .12);
    --amber: #ffb35c;
    --free: #3cf0a4;  --free-bg: rgba(60, 240, 164, .10);
    --lock: #ff9a5c;  --lock-bg: rgba(255, 154, 92, .12);
    --cond: #ffc64a;  --cond-bg: rgba(255, 198, 74, .10);
    --rule: #8fc8ff;  --rule-bg: rgba(143, 200, 255, .10);
    --ng: #ff5d76;    --ng-bg: rgba(255, 93, 118, .12);
    --glow: 0 0 14px rgba(223, 255, 79, .35);
    --radius: 8px;
    --brandfont: Impact, "Haettenschweiler", "Arial Narrow Bold", "Anton", "Oswald", sans-serif;
  --mono: "Share Tech Mono", "M PLUS 1 Code", ui-monospace, Menlo, Consolas, monospace;
    --sans: "M PLUS 1 Code", "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    --side-w: 244px;
  }
  /* 白い強調パネル：中の部品は同じ変数を使うので、ここで明るい配色に切り替える */
  .entry {
    color-scheme: light;
    --panel: #ffffff; --panel-2: #eef2f6; --line: #d6dde5; --line-strong: #aeb9c5;
    --ink: #1d2024; --strong: #111316; --muted: #5a5f66; --faint: #80858c;
    --accent: #2c2f34; --accent-deep: #2c2f34; --accent-ink: #eaff5c; --accent-soft: #f3f7dc;
    --free: #0d7a50; --free-bg: #dff3ea; --lock: #9a4a17; --lock-bg: #fbe9dc;
    --cond: #8a6200; --cond-bg: #fbf1d6; --rule: #245f8f; --rule-bg: #e3eef8;
    --ng: #b3243b; --ng-bg: #fbe3e7;
    background: var(--panel); color: var(--ink);
    border: 1px solid #ffffff !important; border-radius: 10px;
    box-shadow: 0 0 0 2px #dfff4f, 0 0 22px rgba(223, 255, 79, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.65;
    background-image:
      radial-gradient(1100px 520px at 75% -8%, rgba(223, 255, 79, .07), transparent 60%),
      linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px);
    background-size: auto, 100% 3px;
    background-attachment: fixed;
  }
  a { color: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: .95em; }
  h1, h2, h3 { text-wrap: balance; line-height: 1.35; }

  /* ---------- 全体の枠（スマホ：縦積み／PC：左メニュー＋上部コンソール） ---------- */
  .app { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
  .brandbar { background: var(--bg-2); border-bottom: 1px solid var(--line); }
  .brandbar h1 { margin: 0; }
  .brand {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; padding: 12px 14px; cursor: pointer;
  }
  .brand-icon { width: 42px; height: 42px; border-radius: 10px; flex: none; box-shadow: var(--glow); }
  .brand-text { display: grid; line-height: 1.15; }
  .brand-title { font-size: 24px; font-weight: 400; letter-spacing: .03em; font-family: var(--brandfont); white-space: nowrap; color: var(--strong); line-height: 1.05; }
  .brand-sub { font-family: var(--brandfont); font-size: 15px; font-weight: 400; letter-spacing: .32em; color: var(--accent); margin-top: 3px; }
  .brand:hover .brand-title { text-shadow: 0 0 10px rgba(223, 255, 79, .6); }

  .top { background: var(--bg-2); border-bottom: 1px solid var(--line); }
  .toptabs { display: none; }

  /* ---------- 検索コンソール ---------- */
  .search { padding: 10px 12px; display: grid; gap: 8px; background: var(--panel); border-top: 1px solid var(--accent-deep); }
  .q {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px;
    background: var(--well); border: 1px solid var(--line-strong); border-radius: 6px;
  }
  .q:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
  .q .pr { font-family: var(--mono); color: var(--accent); flex: none; }
  .q input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--strong); font-size: 16px; }
  .q input::placeholder { color: var(--faint); }
  .searchbtns { display: flex; gap: 6px; align-items: center; }
  .filtertoggle, .clearbtn {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); background: var(--panel-2); border-radius: 6px;
    font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .filtertoggle:hover, .clearbtn:hover { border-color: var(--accent-deep); color: var(--strong); }
  .clearbtn { color: var(--ng); }
  .filtertoggle svg, .clearbtn svg { width: 15px; height: 15px; flex: none; }
  .filtertoggle .chev { width: 13px; height: 13px; transition: transform .15s; }
  .filtertoggle[aria-expanded="false"] .chev { transform: rotate(180deg); }
  .fcount {
    display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px;
    padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 800;
  }
  .fcount[hidden] { display: none; }
  .filterpanel { display: grid; gap: 6px; }
  .filterpanel[hidden] { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .filters .lbl { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .12em; min-width: 5em; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    border: 1px solid var(--line-strong); background: var(--well); color: var(--muted); border-radius: 4px;
    padding: 4px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
  }
  .chip:hover { color: var(--strong); }
  .chip small { font-family: var(--mono); font-size: 10.5px; opacity: .7; margin-left: 2px; }
  .chip.none, .chip:disabled { opacity: .35; cursor: default; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 3px; scrollbar-width: thin; }
  .chips.scroll .chip { flex: none; }
  .filters .chips.scroll { flex: 1 1 100%; min-width: 0; }
  .filters.two { gap: 6px 26px; }
  .filters .grp { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .filters .lbl { min-width: 0; }
  .filters:not(.two) .lbl { min-width: 5em; }
  .morerow, .morerow:hover { background: none !important; box-shadow: none !important; border: 0 !important; }
  .morerow td { padding: 10px 0 !important; text-align: center; grid-column: 1 / -1; }
  .morebtn { border: 1px solid var(--accent-deep); background: var(--panel); color: var(--accent); border-radius: 6px; padding: 9px 22px; font-weight: 700; cursor: pointer; }
  small.pn { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .pn2 { font-size: 11.5px; color: var(--muted); }
  .d-pn { font-size: 12.5px; color: var(--muted); }
  .d-pn b { color: var(--strong); font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: var(--glow); }

  /* キャリアバッジ（統一サイズ） */
  .clogo {
    width: 20px; height: 20px; flex: none; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 9px; letter-spacing: -.02em; line-height: 1;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25);
  }
  .crow { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

  /* ---------- メニュー（スマホ：画面下の固定バー） ---------- */
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; gap: 4px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--well); border-top: 1px solid var(--line);
  }
  .nav {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    color: var(--muted); font-size: 10.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .nav .ic {
    width: 30px; height: 24px; border-radius: 5px; display: grid; place-items: center;
    background: var(--well); border: 1px solid var(--line-strong);
  }
  .nav .ic svg { width: 15px; height: 15px; }
  .nav kbd { display: none; }
  .nav[aria-selected="true"] { color: var(--strong); border-color: var(--accent-deep); background: linear-gradient(180deg, rgba(223, 255, 79, .14), transparent); }
  .nav[aria-selected="true"] .ic { color: var(--accent); border-color: var(--accent-deep); box-shadow: var(--glow); }
  .sys { display: none; }

  .main { padding: 12px 10px calc(96px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
  .status { display: none; }

  /* ---------- 検索結果（一覧） ---------- */
  .split { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .count { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .count b { color: var(--accent); font-size: 19px; margin-right: 4px; }
  .count .legend { display: none; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rtable thead { display: none; }
  .rtable, .rtable tbody { display: block; }
  .rtable tr {
    display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 9px 11px; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .rtable td { padding: 0; }
  .rtable td.mk { display: none; }
  .mkp { font-weight: 600; font-size: 12px; letter-spacing: .04em; color: var(--accent); margin-right: 7px; text-transform: uppercase; }
  .rtable td.nm { grid-column: 1; grid-row: 1; color: var(--strong); font-weight: 600; font-size: 14px; }
  .rtable td.jd { grid-column: 2; grid-row: 1 / 4; align-self: center; }
  .rtable td.car { grid-column: 1; grid-row: 2; font-size: 12px; }
  .rtable td.code { grid-column: 1; grid-row: 3; font-family: var(--mono); color: var(--amber); font-size: 12.5px; }
  .rtable td.rel { display: none; }
  .rtable tr:hover { border-color: var(--line-strong); }
  .rtable tr[aria-current="true"] { border-color: var(--accent); background: rgba(223, 255, 79, .10); box-shadow: inset 3px 0 0 var(--accent); }
  .rtable tr.generic { border-style: dashed; background: var(--bg-2); }
  .dot { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink); }
  .dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); flex: none; }
  .st {
    display: inline-block; min-width: 72px; text-align: center; padding: 3px 8px; border-radius: 3px;
    font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap;
  }
  .st.need { color: var(--ng); border-color: rgba(255, 93, 118, .55); background: var(--ng-bg); }
  .st.ok { color: var(--free); border-color: rgba(60, 240, 164, .45); background: var(--free-bg); }
  .st.chk { color: var(--amber); border-color: rgba(255, 198, 74, .5); background: var(--cond-bg); }
  .st.gd { color: var(--rule); border-color: rgba(143, 200, 255, .45); background: var(--rule-bg); }

  .st-free { background: var(--free-bg); color: var(--free); }
  .st-locked { background: var(--lock-bg); color: var(--lock); }
  .st-cond { background: var(--cond-bg); color: var(--cond); }
  .st-rule { background: var(--rule-bg); color: var(--rule); }
  .empty { padding: 20px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); background: var(--panel); }

  /* ---------- 詳細 ---------- */
  .detail-slot {
    position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .detail-slot[data-open="false"] { display: none; }
  body.lock { overflow: hidden; }
  .detail { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .d-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .d-head h2 { margin: 0; font-size: 20px; color: var(--strong); }
  .d-meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--muted); font-family: var(--mono); }
  .d-meta b { color: var(--amber); font-weight: 400; }
  .ctabs { display: flex; flex-wrap: wrap; gap: 5px; }
  .ctab { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 5px; padding: 4px 11px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .ctab[aria-pressed="true"] { border-color: var(--accent); color: var(--strong); background: rgba(223, 255, 79, .12); box-shadow: var(--glow); font-weight: 700; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; justify-self: start; height: 34px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); color: var(--accent); font-weight: 700; cursor: pointer;
  }

  .keys { display: grid; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); }
  .key { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--panel); }
  .key-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .key-label .num {
    width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--mono);
  }
  .key-main { font-size: 20px; font-weight: 700; line-height: 1.3; display: flex; align-items: center; gap: 8px; color: var(--strong); }
  .key-main svg { width: 24px; height: 24px; flex: none; }
  .key-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .key-sub b { color: var(--ink); }
  .key.need { border: 1px solid rgba(255, 93, 118, .7); background: linear-gradient(135deg, rgba(255, 93, 118, .16), rgba(255, 93, 118, .04)); box-shadow: 0 0 18px rgba(255, 93, 118, .18); }
  .key.need .key-main { color: var(--ng); text-shadow: 0 0 12px rgba(255, 93, 118, .45); }
  .key.need .key-label .num { background: var(--ng); color: #1a0409; }
  .key.ok { border-color: rgba(60, 240, 164, .55); background: linear-gradient(135deg, rgba(60, 240, 164, .12), rgba(60, 240, 164, .03)); }
  .key.ok .key-main { color: var(--free); }
  .key.check { border-color: rgba(255, 198, 74, .55); background: linear-gradient(135deg, rgba(255, 198, 74, .12), rgba(255, 198, 74, .03)); }
  .key.check .key-main { color: var(--amber); }
  .key.ng .key-main { color: var(--ng); }
  /* 白い入口パネルの見出し帯 */
  .key.entry { padding: 0; gap: 0; overflow: hidden; }
  .key.entry > .key-label { padding: 9px 14px; background: #2c2f34; color: #eaff5c; letter-spacing: .08em; }
  .key.entry > .key-label .num { background: #eaff5c; color: #23260e; }
  .key.entry > :not(.key-label) { margin-inline: 14px; }
  .key.entry > :nth-child(2) { margin-top: 12px; }
  .key.entry > :last-child { margin-bottom: 14px; }
  .key.entry > * + * { margin-top: 8px; }
  .key.entry .key-main { color: var(--free); }
  .key.entry.ng .key-main { color: var(--ng); }
  .btnrow { display: grid; gap: 8px; }
  .bigbtn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px;
    padding: 12px 16px; border-radius: 8px; font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.35;
    background: linear-gradient(90deg, #2c2f34, #3d424a); color: #eaff5c; box-shadow: 0 3px 10px rgba(0, 0, 0, .28);
  }
  .bigbtn::after { content: "↗"; font-weight: 400; font-size: 17px; }
  .bigbtn.sub { background: #fff; color: #2c2f34; border: 1.5px solid #2c2f34; box-shadow: none; }
  .bigbtn:active { transform: translateY(1px); }

  /* QRコード（読み取り精度のため常に白地・黒モジュール） */
  .qrwrap { display: grid; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .qrhead { font-size: 12px; font-weight: 700; color: var(--ink); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .qrhead .hint { font-weight: 400; font-size: 11px; color: var(--muted); }
  .qrgrid { display: flex; flex-wrap: wrap; gap: 14px; }
  .qrcell { display: grid; justify-items: center; gap: 5px; width: 116px; }
  .qrimg { width: 108px; height: 108px; background: #fff; border-radius: 8px; padding: 6px; box-shadow: 0 0 0 1px #c5ced8; display: flex; align-items: center; justify-content: center; }
  .qrimg svg, .qrimg img, .qrimg canvas { display: block; width: 100%; height: 100%; }
  .qrlabel { font-size: 11px; text-align: center; color: var(--muted); line-height: 1.3; }

  /* 折りたたみ */
  details.fold { border-bottom: 1px solid var(--line); }
  details.fold:last-child { border-bottom: 0; }
  details.fold > summary {
    list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 14.5px; color: var(--strong);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "＋"; color: var(--accent); font-size: 18px; flex: none; }
  details.fold[open] > summary::after { content: "－"; }
  details.fold > summary small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .fold-body { padding: 0 16px 16px; display: grid; gap: 10px; }

  .sec { padding: 16px; display: grid; gap: 10px; }
  .sec h3 { margin: 0; font-size: 16px; color: var(--strong); }
  .pathnav { display: flex; flex-direction: column; gap: 4px; }
  .pathnav + .pathnav { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .pc-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
  .pc-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; line-height: 1.5; }
  .pc-step, .pc-target {
    display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: 13px; font-weight: 600;
    background: var(--well); border: 1px solid var(--line-strong); white-space: nowrap;
  }
  .pc-target { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 700; }
  .pc-arrow { color: var(--faint); font-size: 12px; padding: 0 1px; flex: none; }
  .pc-note { font-size: 12px; color: var(--muted); line-height: 1.5; }

<script>
  // ---------- 表示切替（PC表示 ⇄ スマホ表示） ----------

(() => {
  const $ = (s, el = document) => el.querySelector(s);

  // キャリアロゴバッジ（実ロゴ画像は権利上使用できないため、ブランドカラー＋

    const path = pathListText(pathList);
    if (v.ship === "free") return `<section class="key ok">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_OK}解除不要（ロックなし）</div>
      <div class="key-sub">${esc(v.note || d.note || "ロックなしで販売された機種です。")}</div></section>`;
    if (v.ship === "locked") return `<section class="key need">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_WARN}解除が必要（必ず確認）</div>
      <div class="key-sub">ロックあり出荷。<b>${esc(path)}</b> で解除済みか確認し、ロック中なら②から手続きしてください。</div></section>`;
    return `<section class="key check">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_Q}要確認${v.ship === "cond" ? "（解除済の可能性あり）" : ""}</div>
      <div class="key-sub">${esc(v.ship === "cond" ? (v.note || UNLOCK[v.c].rules[0]) : "発売日・購入日で判定")}。確認場所：<b>${esc(path)}</b></div></section>`;
  }

  // ② SIMロック解除の入口
  function unlockCard(v) {
    const ur = UNLOCK[v.c];
    const noNeed = v.c === "rakuten" || v.c === "free" || v.ship === "free";
    return `<section class="key entry">
      <div class="key-label"><span class="num">2</span>SIMロック解除の入口（${esc(CARRIERS[v.c].name)}）</div>
      ${noNeed ? `<div class="key-main" style="font-size:17px">手続き不要</div>
           ${ur.links.length ? `<div class="key-sub">念のため確認する場合：${extA(ur.links[0].url, ur.links[0].label, "")}</div>` : ""}`
        : `<div class="btnrow">${ur.links.slice(0, 1).map(l => extA(l.url, l.label, "bigbtn")).join("")}</div>
           <div class="key-sub">照会・手続き：${esc(ur.inquiry)}</div>
           ${qrSection(ur.links.slice(0, 1).map(l => ({ label: "SIMロック解除ページ", url: l.url })))}`}
    </section>`;
  }

  // ③ キャリアメール持ち運びの入口
  function mailCard(v, src, os) {
    const head = `<div class="key-label"><span class="num">3</span>キャリアメール持ち運び${src ? `（旧：${esc(CARRIERS[src].name)}）` : ""}</div>`;
    if (!src) return `<section class="key entry">${head}
      <div class="key-sub">SIMフリー端末です。解約する旧キャリアを下の「キャリアメール持ち運びの詳細」で選んでください。</div></section>`;
    const m = MAIL[src];
    if (m.ok === false) return `<section class="key entry ng">${head}
      <div class="key-main">${ICON_X}持ち運び不可</div>
      <div class="key-sub">${esc(m.addresses.join("、"))} は持ち運びサービスの対象外です。</div></section>`;
    const o = m[os === "ios" ? "iphone" : "android"];
    const apply = (m.entries && m.entries[0]) || m.links[0];
    return `<section class="key entry">${head}
      <div class="btnrow">
        ${extA(apply.url, "申込ページを開く", "bigbtn")}
        ${extA(o.link.url, `${os === "ios" ? "iPhone" : "Android"}の設定方法`, "bigbtn sub")}
      </div>
      <div class="key-sub">申込期限：<b>${esc(m.deadline)}</b>　設定アプリ：${esc(o.app)}</div>
      ${qrSection([{ label: "申込ページ", url: apply.url }, { label: `${os === "ios" ? "iPhone" : "Android"}の設定方法`, url: o.link.url }])}</section>`;
  }

  const fold = (key, title, hint, body) =>
    `<details class="fold" data-fold="${key}"${state.folds.has(key) ? " open" : ""}><summary><span>${title}${hint ? `<small>${hint}</small>` : ""}</span></summary><div class="fold-body">${body}</div></details>`;

      return;
    }
    const v = pickVariant(d);
    state.selCarrier = v.c;
    const mk = MAKERS[d.maker];
    const os = deviceOs(d);
    const ur = UNLOCK[v.c];
    const pathList = makerPathList(mk, v.c, d);
    const netKey = CARRIERS[v.c].net;

    box.innerHTML = `
      <div class="d-head">
        <button class="back" id="back">← 一覧へ戻る</button>
        <h2><span class="mkp">${esc(mfrLabel(d))}</span>${esc(d.name)}</h2>
        <div class="d-meta">${v.code ? `<span>型番 <b class="mono">${esc(v.code)}</b></span>` : ""}<span>発売 ${esc(v.rel)}</span></div>
        ${prodName(d, v) !== d.name ? `<div class="d-pn">${esc(CARRIERS[v.c].name)}での製品名：<b>${esc(prodName(d, v))}</b></div>` : ""}
        <div class="ctabs" role="group" aria-label="販売キャリアを選択">${d.variants.map(x => `<button class="ctab" data-vc="${x.c}" aria-pressed="${x.c === v.c}">${clogo(x.c)}${esc(CARRIERS[x.c].name)}版</button>`).join("")}</div>
      </div>

      <div class="keys">
        ${lockCard(d, v, pathList)}
        <section class="card check-detail">
          <h3 style="margin:0;font-size:15px">SIMロックの確認方法</h3>
          ${pathListChips(pathList)}
          <div class="judge">
            <div class="st-free"><span class="lab">解除済・ロックなし</span>${esc(mk.ok)}</div>
            <div class="st-locked"><span class="lab">ロック中</span>${esc(mk.ng)}</div>
          </div>
          <ul class="notes">${mk.notes.map(n => `<li>${esc(n)}</li>`).join("")}${brandMk ? `<li>${esc(brandMk.name)}のスマホ版の確認場所：${esc(pathListText(makerPathList(brandMk, v.c)))}（ガラホでは無いことが多い）</li>` : ""}</ul>
          ${netKey && !noCheck ? `<div class="callout warn"><b>表示が無い・不明なときは他社SIMテスト</b><br>挿すSIM：${esc(TEST_NET[netKey])}<br>⚠ ${esc(SAME_NET[netKey])} のSIMは同じ回線網なので判定になりません。解除コード入力画面が出たらキャンセル。</div>` : ""}
          <details class="more"><summary>使えるダイヤルコード</summary><div class="codes">${codeRows(mk.codes)}</div></details>
        </section>
        ${unlockCard(v)}
        ${mailCard(v, mailSrc, mailOs)}
      </div>

      ${fold("unlock", "解除手続きの流れ・照会先", `${esc(CARRIERS[v.c].name)}の解除ルール`, `
        <ul class="notes">${ur.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        ${noCheck ? "" : `<ol class="steps">${ur.how.filter(s => os === "ios" ? !/^Android/.test(s) : !/^iPhone/.test(s)).map(s => `<li>${esc(s)}</li>`).join("")}</ol>`}
        <dl class="kv"><dt>照会先</dt><dd>${esc(ur.inquiry)}</dd><dt>解除の仕組み</dt><dd>${esc(ur.mechanism)}</dd></dl>
        ${ur.links.length ? `<div class="links">${ur.links.map(l => extA(l.url, l.label, "")).join("")}</div>` : ""}`)}

      ${fold("mail", "キャリアメール持ち運びの詳細", "旧キャリアの切替・設定手順・QRコード・注意事項",
        mailBlock(mailSrc || "docomo", mailOs))}`;
    mountQR(box);
  }

  /* ---------- table view ---------- */
  function renderTable() {
    $("#legend").innerHTML = Object.values(STATUS).map(s => `<span><span class="pill ${s.cls}">${s.short}</span> ${s.label}</span>`).join("");
    const rows = [];
    filtered().filter(d => !d.generic).forEach(d => d.variants.forEach(v => {
      if (state.carrier !== "all" && v.c !== state.carrier) return;
      const mk = MAKERS[d.maker];
      rows.push({ d, v, html: `<tr data-id="${d.id}" data-vc="${v.c}">
        <td><span class="crow">${clogo(v.c)} ${esc(CARRIERS[v.c].name)}</span></td>
        <td>${esc(mfrLabel(d))}</td>
        <td><b>${esc(d.name)}</b>${v.n ? `<br><span class="pn2">${esc(v.n)}</span>` : ""}</td>
        <td class="code">${esc(v.code || "—")}</td>
        <td>${esc(v.rel)}</td>
        <td><span class="pill ${STATUS[v.ship].cls}">${STATUS[v.ship].short}</span></td>
        <td>${esc(pathListText(makerPathList(mk, v.c, d)))}</td>
        <td>${MAIL[v.c].ok === true ? `<span class="yes">可</span>` : MAIL[v.c].ok === false ? `<span class="no">不可</span>` : "—"}</td>
      </tr>` });
    }));
    rows.sort((a, b) => CARRIER_ORDER.indexOf(a.v.c) - CARRIER_ORDER.indexOf(b.v.c) || relKey(b.v.rel) - relKey(a.v.rel));
    $("#lockTable").innerHTML = `<thead><tr><th>販売</th><th>メーカー</th><th>機種</th><th>型番</th><th>発売</th><th>出荷時</th><th>確認方法（ここを見る）</th><th>メール持運</th></tr></thead>
      <tbody>${rows.map(r => r.html).join("") || `<tr><td colspan="8">該当なし</td></tr>`}</tbody>`;

      <div class="card"><h2>全キャリア共通の注意（MNP切替前に確認・説明）</h2><ul class="notes">${MAIL_COMMON.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="card entry"><h2>キャリア別の詳細</h2>

        ${CARRIER_ORDER.map(k => `<tr style="cursor:default"><td><span class="crow">${clogo(k)} <b>${esc(CARRIERS[k].name)}</b></span></td><td>${UNLOCK[k].rules.map(esc).join("<br>")}</td><td>${esc(UNLOCK[k].inquiry)}</td><td>${esc(UNLOCK[k].mechanism)}</td></tr>`).join("")}
        </tbody></table></div></div>
      <div class="card"><h2>他社SIMテストのコツ</h2><ul class="notes">
        <li>販売キャリアと<b>別の回線網</b>のSIMを使う（例：au版端末 → ドコモ回線 or SB回線のSIM）</li>

      <div class="card"><h2>ダイヤルコード（電話アプリで入力）</h2><div class="codes">${codeRows(Object.keys(CODES))}</div>
        <p style="margin:0;font-size:12px;color:var(--muted)">ダイヤルコードはメーカー非公式機能。機種・OS・キャリアにより無反応／表示が異なる。「反応しない＝ロックなし」ではない。解除系コード（#7465625*638*# 等）は誤入力でロック回数を消費する恐れがあるため現場では使用しない。</p></div>
      <div class="card"><h2>混同しやすい3つのロック</h2><dl class="kv">
        <dt>SIMロック</dt><dd>他社SIMが使えない（本ツールの対象）</dd>
        <dt>ネットワーク利用制限（赤ロム）</dt><dd>分割未払い・盗難等で通信停止。キャリアのIMEI判定サイトで「○△×」確認。SIMロックとは別物</dd>
        <dt>アクティベーションロック・FRP</dt><dd>前所有者のApple ID／Googleアカウントが残っている状態。初期化しても解除されない</dd></dl></div>

  /* ---------- QRだけ読み取りたいとき（機種を検索しなくても、上部の「販売キャリア」で選べばQRを出す） ---------- */
  function qrBody(c) {
    if (!c || c === "all") return `<div class="empty">上の「絞り込み」から販売キャリアを1つ選ぶと、SIMロック解除とキャリアメール持ち運びのQRコードを表示します。</div>`;
    if (c === "free") return `<div class="empty">${clogo("free")} SIMフリーは特定のキャリアに紐づかないため、QRコードの対象がありません。旧キャリアのメール持ち運びは「メール一覧」タブから確認してください。</div>`;
    const ur = UNLOCK[c];
    const noNeed = c === "rakuten";
    return `
      <div class="card">
        <h2>${clogo(c)} ${esc(CARRIERS[c].name)}</h2>
        <p style="margin:0;font-size:13px;color:var(--muted)">別の端末のカメラでQRコードを読み取ると、そのページがそのまま開きます。</p>
      </div>
      <div class="card entry">
        <h2>① SIMロック解除</h2>
        <ul class="notes">${ur.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        ${noNeed
          ? `<div class="callout info">${esc(ur.mechanism)}</div>`
          : `<div class="links">${ur.links.map(l => extA(l.url, l.label, "")).join("")}</div>${qrSection(ur.links)}`}
      </div>
      <div class="card entry">
        <h2>② キャリアメール持ち運び（旧：${esc(CARRIERS[c].name)}）</h2>
        ${mailBlock(c, state.mailOs || "ios", { hidePicker: true })}
      </div>`;
  }
  function renderQrView() {
    $("#view-qr").innerHTML = `<div class="guide">${qrBody(state.carrier)}</div>`;
    mountQR($("#view-qr"));
  }

  /* ---------- tabs / routing ---------- */
  function setTab(t) {
    state.tab = t;
    document.body.dataset.tab = t;
    const mainEl = $(".main"); if (mainEl) mainEl.scrollTop = 0;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + t; });
    if (t === "table") renderTable();
    if (t === "mail") renderMailView();
    if (t === "guide") renderGuide();
    if (t === "qr") renderQrView();
  }

  function openDevice(id, vc) {
    state.sel = id; state.selCarrier = vc || null; state.mailSrc = null; state.mailOs = null;
    renderResults(); renderDetail();
    const slot = $("#detailSlot");
    slot.dataset.open = "true";
    if (isSP()) { document.body.classList.add("lock"); slot.scrollTop = 0; }
    try { history.replaceState(null, "", "#" + id + (state.selCarrier ? "." + state.selCarrier : "")); } catch (e) {}
  }

  function updateFcount() {
    const n = (state.carrier !== "all" ? 1 : 0) + (state.os !== "all" ? 1 : 0) + (state.mfr !== "all" ? 1 : 0);
    const el = $("#fcount");
    el.hidden = n === 0;
    el.textContent = String(n);
  }

  function refresh() {
    state.limit = 300;
    renderChips(); renderResults(); updateFcount();
    if (state.tab === "table") renderTable();
    if (state.tab === "qr") renderQrView();
  }

  // タイトルをタップ／クリックしたら検索・絞り込みを初期化してトップに戻る
  function goHome() {
    state.q = ""; state.carrier = "all"; state.os = "all"; state.mfr = "all"; state.sort = "new";
    state.sel = null; state.selCarrier = null; state.mailSrc = null; state.mailOs = null;
    $("#q").value = "";
    $("#filterPanel").hidden = false;
    $("#filterToggle").setAttribute("aria-expanded", "true");
    $("#detailSlot").dataset.open = "false";
    document.body.classList.remove("lock");
    setTab("search");
    refresh();
    renderDetail();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- events ---------- */
  $("#q").addEventListener("input", e => { state.q = e.target.value; refresh(); });
  $("#filterToggle").addEventListener("click", () => {
    const open = $("#filterToggle").getAttribute("aria-expanded") === "true";
    $("#filterToggle").setAttribute("aria-expanded", String(!open));
    $("#filterPanel").hidden = open;
  });
  // 検索をやり直す：キーワードと絞り込み条件をまとめてリセット
  $("#clearSearch").addEventListener("click", () => {
    state.q = ""; state.carrier = "all"; state.os = "all"; state.mfr = "all"; state.sort = "new";
    $("#q").value = "";
    $("#q").focus();
    refresh();
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("button, tr[data-id]");
    if (!t) return;
    if (t.id === "brandHome") { goHome(); return; }
    if (t.dataset.carrier) { state.carrier = t.dataset.carrier; refresh(); return; }
    if (t.dataset.os) { state.os = t.dataset.os; refresh(); return; }
    if (t.dataset.mfr) { state.mfr = t.dataset.mfr; refresh(); return; }
    if (t.dataset.more) { state.limit += 500; renderResults(); return; }
    if (t.dataset.sort) { state.sort = t.dataset.sort; refresh(); return; }
    if (t.dataset.tab) { setTab(t.dataset.tab); return; }
    if (t.tagName === "TR" && t.dataset.id) { if (state.tab !== "search") setTab("search"); openDevice(t.dataset.id, t.dataset.vc); return; }
    if (t.dataset.vc) { state.selCarrier = t.dataset.vc; state.mailSrc = null; renderDetail(); renderResults();
      try { history.replaceState(null, "", "#" + state.sel + "." + state.selCarrier); } catch (e) {} return; }
    if (t.dataset.mailos) {
      state.mailOs = t.dataset.mailos;
      if (state.tab === "mail") renderMailFull();
      else if (state.tab === "qr") renderQrView();
      else renderDetail();
      return;
    }
    if (t.id === "back") { $("#detailSlot").dataset.open = "false"; document.body.classList.remove("lock"); return; }
    if (t.dataset.copy) {
      const txt = t.dataset.copy;
      const done = () => { t.textContent = "コピー済"; setTimeout(() => (t.textContent = "コピー"), 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(() => {});
    }
  });
  // 詳細の開閉状態を覚えておき、キャリア切替などで再描画しても閉じないようにする
  document.addEventListener("toggle", e => {
    const f = e.target.dataset && e.target.dataset.fold;
    if (!f) return;
    e.target.open ? state.folds.add(f) : state.folds.delete(f);
  }, true);

  // 外部リンクは別ブラウザで開く。Androidは intent: で Chrome を指定して起動
  // （Chrome が無い端末は browser_fallback_url で既定ブラウザにフォールバック）。
  // iPhone は OS の仕様上ブラウザを指定できないため、新しいタブ（Safari）で開く。
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="http"]');
    if (!a || !/Android/i.test(navigator.userAgent)) return;
    e.preventDefault();
    const u = new URL(a.href);
    location.href = `intent://${u.host}${u.pathname}${u.search}${u.hash}#Intent;scheme=${u.protocol.slice(0, -1)};package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(a.href)};end`;
  });

  document.addEventListener("change", e => {
    if (e.target.classList.contains("mailsrc")) { state.mailSrc = e.target.value; state.tab === "mail" ? renderMailFull() : renderDetail(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
    // F1〜F5 でメニュー切替（PCモニター向け）
    const fk = { F1: "search", F2: "table", F3: "mail", F4: "guide", F5: "qr" }[e.key];
    if (fk) { e.preventDefault(); setTab(fk); window.scrollTo({ top: 0 }); $(".main").scrollTop = 0; }
    if (e.key === "Escape" && $("#detailSlot").dataset.open === "true" && isSP()) {
      $("#detailSlot").dataset.open = "false"; document.body.classList.remove("lock");
    }
  });

  /* ---------- ステータスバー（時計・件数・回線状態） ---------- */
  $("#sysCount").textContent = DEVICES.filter(d => !d.generic).length;
  const tick = () => { const n = new Date(); $("#stClock").textContent = n.toLocaleDateString("ja-JP") + "  " + n.toLocaleTimeString("ja-JP"); };
  tick(); setInterval(tick, 1000);
  const net = () => { $("#sysNet").textContent = navigator.onLine ? "ONLINE" : "OFFLINE"; $("#sysNet").style.color = navigator.onLine ? "" : "var(--amber)"; };
  net(); addEventListener("online", net); addEventListener("offline", net);

  /* ---------- init ---------- */
  renderChips();
  updateFcount();
  const h = decodeURIComponent(location.hash.slice(1));
  const [hid, hc] = h.split(".");
  if (["table", "mail", "guide", "qr"].includes(hid)) { renderResults(); setTab(hid); }
  else if (DEVICES.some(d => d.id === hid)) openDevice(hid, hc);
  else {
    // 初期表示：サンプルとして iPhone SE（第2世代）ドコモ版を開いておく（スマホ幅では一覧のみ）
    state.sel = "iphone-se2"; state.selCarrier = "docomo";
    renderResults(); renderDetail();
  }

  // PWA: オフラインでも起動できるようアプリ一式をキャッシュするサービスワーカーを登録
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
