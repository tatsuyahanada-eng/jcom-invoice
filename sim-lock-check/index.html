<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>スマホ移行Check Tool</title>
<meta name="description" content="機種・型番・メーカーで検索し、SIMロックの状態・確認手順・解除方法とキャリアメール持ち運びの要点を一画面で確認できるツール">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#33574c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スマホ移行Check">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta property="og:title" content="スマホ移行Check Tool">
<meta property="og:description" content="SIMロック状態とキャリアメール持ち運びを一画面で確認">
<meta property="og:image" content="icons/title-lockup.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    /* シックな深緑がかったチャコールをベースに、真鍮を差し色に使う落ち着いた配色 */
    --bg: #eef1ef;
    --panel: #ffffff;
    --panel-2: #e6ebe8;
    --line: #d4dbd7;
    --line-strong: #aebab3;
    --ink: #1c2624;
    --muted: #62716b;
    --accent: #33574c;
    --accent-ink: #f4f7f5;
    --accent-soft: #e0ebe6;
    --accent-warm: #a67c3d;
    --free: #2f6b52;  --free-bg: #e1ece5;
    --lock: #8a5a2b;  --lock-bg: #f0e6d7;
    --cond: #5c5382;  --cond-bg: #e8e5f1;
    --rule: #3a5c72;  --rule-bg: #e2e9ed;
    --ng: #8a3b46;    --ng-bg: #f2e3e5;
    /* 「ロックあり出荷」は必ず対応が要るため、他のステータスより強い警告トーンにする */
    --alert: #ffffff; --alert-bg: #a8431f; --alert-line: #7a2f14;
    --radius: 10px;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121a17; --panel: #1a2420; --panel-2: #202d27; --line: #2c3b34; --line-strong: #44584e;
      --ink: #e6ece8; --muted: #93a39a; --accent: #74ac97; --accent-ink: #0d1512; --accent-soft: #223930; --accent-warm: #cda368;
      --free: #7fcaa8; --free-bg: #1b3327; --lock: #e0b271; --lock-bg: #3a2c17;
      --cond: #b3a6dd; --cond-bg: #2a2740; --rule: #8fb7cd; --rule-bg: #1f2f38; --ng: #e29aa2; --ng-bg: #3b2024;
      --alert: #1a0e09; --alert-bg: #f0a877; --alert-line: #f0a877;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121a17; --panel: #1a2420; --panel-2: #202d27; --line: #2c3b34; --line-strong: #44584e;
    --ink: #e6ece8; --muted: #93a39a; --accent: #74ac97; --accent-ink: #0d1512; --accent-soft: #223930; --accent-warm: #cda368;
    --free: #7fcaa8; --free-bg: #1b3327; --lock: #e0b271; --lock-bg: #3a2c17;
    --cond: #b3a6dd; --cond-bg: #2a2740; --rule: #8fb7cd; --rule-bg: #1f2f38; --ng: #e29aa2; --ng-bg: #3b2024;
    --alert: #1a0e09; --alert-bg: #f0a877; --alert-line: #f0a877;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.65;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px;
    padding-block: 18px calc(80px + env(safe-area-inset-bottom, 0px)); }
  a { color: var(--accent); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: .92em; }
  h1, h2, h3 { text-wrap: balance; line-height: 1.35; }

  /* ---------- header（タイトルバー） ----------
     背景と区別できるよう深緑のバンドに白抜き文字。タップでトップへ戻る。 */
  .top {
    margin-bottom: 14px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(135deg, #172b26 0%, #2c4d44 55%, #3d6a5c 100%);
    box-shadow: 0 6px 20px rgba(18, 38, 32, .22);
  }
  .brand {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: none; border: 0; padding: 16px 18px; margin: 0; cursor: pointer; color: #fff;
  }
  .brand-icon { width: 58px; height: 58px; border-radius: 14px; flex: none; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
  .brand-text { display: grid; gap: 1px; min-width: 0; }
  .brand-title { font-size: 27px; font-weight: 700; letter-spacing: .06em; line-height: 1.15; color: #fff; }
  .brand-sub {
    font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .22em;
    color: #e2c27e; line-height: 1.3;
  }
  .brand-tag { font-size: 11.5px; color: rgba(255, 255, 255, .72); letter-spacing: .04em; margin-top: 3px; }
  .brand:hover .brand-title, .brand:focus-visible .brand-title { text-decoration: underline; text-decoration-color: #e2c27e; text-underline-offset: 5px; }
  .brand:focus-visible { outline: 2px solid #e2c27e; outline-offset: -4px; }

  /* ---------- search bar ---------- */
  .search {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; display: grid; gap: 10px; box-shadow: 0 2px 10px rgba(10, 40, 50, .06);
  }
  .q { position: relative; }
  .q input {
    width: 100%; padding: 12px 14px 12px 40px; font-size: 17px;
    border: 2px solid var(--line-strong); border-radius: 8px; background: var(--panel-2);
  }
  .q input:focus { border-color: var(--accent); outline: none; background: var(--panel); }
  .q svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }

  /* 絞り込み：スマホでは既定で折りたたみ、タップで開閉する */
  .filtertoggle {
    display: inline-flex; align-items: center; gap: 7px; justify-self: start;
    border: 1px solid var(--line-strong); background: var(--panel-2); color: var(--ink);
    border-radius: 8px; padding: 9px 13px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .filtertoggle svg { width: 16px; height: 16px; flex: none; }
  .fcount[hidden] { display: none; }
  .filtertoggle .chev { width: 14px; height: 14px; transition: transform .15s; }
  .filtertoggle[aria-expanded="false"] .chev { transform: rotate(180deg); }
  .fcount {
    display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 17px;
    padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .filterpanel { display: grid; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
  .filterpanel[hidden] { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .filters .lbl { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line-strong); background: var(--panel); border-radius: 999px;
    padding: 6px 13px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    min-height: 34px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  /* キャリアロゴバッジ：正式ロゴ画像の代わりに使う統一サイズのブランドカラー
     イニシャルバッジ。全箇所（チップ・タブ・一覧・カード）で同一サイズに統一。 */
  .clogo {
    width: 20px; height: 20px; flex: none; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-family: var(--sans); font-weight: 700; font-size: 9px;
    letter-spacing: -.02em; line-height: 1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  /* バッジ＋キャリア名を横並びで折り返さないための行 */
  .crow { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

  /* QRコード */
  .qrwrap { display: grid; gap: 8px; padding-top: 10px; margin-top: 4px; border-top: 1px dashed var(--line); }
  .qrhead { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
  .qrhead .hint { font-weight: 400; font-size: 11px; }
  .qrgrid { display: flex; flex-wrap: wrap; gap: 14px; }
  .qrcell { display: grid; justify-items: center; gap: 5px; width: 108px; }
  /* QRは読み取り精度のためテーマに関わらず常に白背景・黒モジュールで固定 */
  .qrimg { width: 96px; height: 96px; background: #fff; border-radius: 8px; padding: 6px;
    box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; }
  .qrimg svg, .qrimg img, .qrimg canvas { display: block; width: 100%; height: 100%; }
  .qrlabel { font-size: 11px; text-align: center; color: var(--muted); line-height: 1.3; }

  /* ---------- bottom nav ----------
     スマホでの片手操作を基本に、親指の届く画面下部に固定。
     デスクトップ幅ではページ上部の横タブへ切り替える（下の min-width クエリ）。 */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    display: flex; margin: 0; background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -6px 18px rgba(20, 30, 26, .08);
  }
  .tab {
    flex: 1 1 0; min-width: 0; border: 0; background: none; cursor: pointer; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 9px 2px 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .01em; line-height: 1.25;
    border-top: 2px solid transparent; margin-top: -1px; white-space: nowrap;
  }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

  /* ---------- search view ---------- */
  .split { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .results { display: grid; gap: 6px; }
  .count { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .item {
    text-align: left; width: 100%; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    display: grid; gap: 4px;
  }
  .item:hover { border-color: var(--line-strong); }
  .item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .item .nm { font-weight: 700; line-height: 1.4; }
  .item .mk { font-size: 12px; color: var(--muted); }
  .vrow { display: flex; flex-wrap: wrap; gap: 4px; }
  .vtag { font-size: 11px; padding: 1px 7px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid transparent; }
  .vtag b { font-size: 10px; margin-left: 2px; }
  .vtag.vneed { background: var(--alert-bg); color: var(--alert); border-color: var(--alert-line); }
  .item.generic { background: var(--panel-2); border-style: dashed; }

  .st-free { background: var(--free-bg); color: var(--free); }
  .st-locked { background: var(--lock-bg); color: var(--lock); }
  .st-cond { background: var(--cond-bg); color: var(--cond); }
  .st-rule { background: var(--rule-bg); color: var(--rule); }

  .empty { padding: 20px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); background: var(--panel); }

  /* ---------- detail ---------- */
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .d-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .d-head h2 { margin: 0; font-size: 22px; }
  .d-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
  .d-meta b { color: var(--ink); font-weight: 700; }
  .ctabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .ctab { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .ctab[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--panel); font-weight: 700; }
  .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; cursor: pointer; justify-self: start; }

  .verdict { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .badge { font-size: 16px; font-weight: 700; padding: 8px 14px; border-radius: 8px; white-space: nowrap; grid-row: auto; justify-self: start; }
  .verdict .why { font-size: 14px; }
  .verdict .sub { font-size: 12px; color: var(--muted); }

  /* ---------- 検索結果の要点カード（①要否 ②解除の入口 ③メール持ち運びの入口） ---------- */
  .keys { display: grid; gap: 10px; padding: 14px 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .key { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--panel); }
  .key-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .key-label .num {
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--mono);
  }
  .key-main { font-size: 20px; font-weight: 700; line-height: 1.3; display: flex; align-items: center; gap: 8px; }
  .key-main svg { width: 24px; height: 24px; flex: none; }
  .key-sub { font-size: 13px; color: var(--muted); line-height: 1.55; }
  .key-sub b { color: var(--ink); }
  .key.need { background: var(--alert-bg); border: 2px solid var(--alert-line); color: var(--alert); box-shadow: 0 4px 14px rgba(122, 47, 20, .25); }
  .key.need .key-label, .key.need .key-sub, .key.need .key-sub b { color: inherit; }
  .key.need .key-label .num { background: var(--alert); color: var(--alert-bg); }
  .key.ok { border-color: var(--free); background: var(--free-bg); }
  .key.ok .key-main { color: var(--free); }
  .key.check { border-color: var(--cond); background: var(--cond-bg); }
  .key.check .key-main { color: var(--cond); }
  .key.ng .key-main { color: var(--ng); }
  .btnrow { display: grid; gap: 8px; }
  .key .qrwrap { margin-top: 2px; }
  .key.need .qrhead, .key.need .qrlabel { color: inherit; }
  .bigbtn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px;
    padding: 12px 16px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 15px; text-decoration: none; line-height: 1.35;
  }
  .bigbtn::after { content: "↗"; font-weight: 400; font-size: 17px; }
  .bigbtn.sub { background: var(--panel); color: var(--accent); border: 1.5px solid var(--accent); }
  .bigbtn:active { transform: translateY(1px); }

  /* 詳細はタップで開閉 */
  details.fold { border-bottom: 1px solid var(--line); }
  details.fold:last-child { border-bottom: 0; }
  details.fold > summary {
    list-style: none; cursor: pointer; padding: 15px 18px; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::after { content: "＋"; color: var(--accent); font-size: 18px; flex: none; }
  details.fold[open] > summary::after { content: "－"; }
  details.fold > summary small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .fold-body { padding: 0 18px 18px; display: grid; gap: 10px; }

  .sec { padding: 16px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .sec:last-child { border-bottom: 0; }
  .sec h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .sec h3 .tag { white-space: nowrap; flex: none; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; }
  /* SIMロック確認手順のパンくずナビゲーション（正確・省スペース） */
  .pathnav { display: flex; flex-direction: column; gap: 4px; }
  .pathnav + .pathnav { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .pc-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
  .pc-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px; line-height: 1.5; }
  .pc-step, .pc-target {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 13.5px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap;
  }
  .pc-target { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .pc-arrow { color: var(--muted); font-size: 12px; padding: 0 1px; flex: none; }
  .pc-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .judge { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .judge div { padding: 8px 10px; border-radius: 6px; font-size: 14px; }
  .judge .lab { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  ul.notes, ol.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
  ul.notes li::marker { color: var(--muted); }
  ol.steps li::marker { font-family: var(--mono); color: var(--accent); font-weight: 500; }
  .kv { display: grid; grid-template-columns: 1fr; gap: 0; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); font-size: 13px; }
  .kv dd { margin: 0 0 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; font-size: 13px; font-weight: 700;
    border: 1px solid var(--accent); border-radius: 6px; text-decoration: none; background: var(--panel);
  }
  .links a:hover { background: var(--accent-soft); }
  .links a::after { content: "↗"; font-weight: 400; }
  .callout { padding: 10px 12px; border-radius: 6px; font-size: 14px; }
  .callout.warn { background: var(--lock-bg); color: var(--ink); border: 1px solid var(--lock); }
  .callout.ng { background: var(--ng-bg); border: 1px solid var(--ng); }
  .callout.info { background: var(--rule-bg); border: 1px solid var(--rule); }
  .codes { display: grid; gap: 6px; }
  .code { display: grid; grid-template-columns: 1fr; gap: 2px; font-size: 13px; padding: 8px 10px; background: var(--panel-2); border-radius: 6px; }
  .code .n { grid-column: 1; }
  .code .c { font-family: var(--mono); font-weight: 500; font-size: 14px; }
  .code .n { color: var(--muted); font-size: 12px; grid-column: 2; }
  .copy { border: 1px solid var(--line-strong); background: var(--panel); border-radius: 4px; font-size: 11px; padding: 0 6px; cursor: pointer; margin-left: 6px; }

  .ostoggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .ostoggle button { border: 0; background: var(--panel); padding: 5px 14px; cursor: pointer; font-size: 13px; }
  .ostoggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .mailhead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
  .srcpick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
  .srcpick select { padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); }
  .addr { display: flex; flex-wrap: wrap; gap: 4px; }
  .addr span { font-family: var(--mono); font-size: 12px; padding: 1px 7px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .srv { width: 100%; border-collapse: collapse; font-size: 13px; }
  .srv th, .srv td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  .srv th { background: var(--panel-2); font-weight: 700; white-space: nowrap; }
  .srv td { font-family: var(--mono); }
  details.more > summary { cursor: pointer; font-weight: 700; color: var(--accent); }
  details.more[open] > summary { margin-bottom: 8px; }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  table.list { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
  table.list th, table.list td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  table.list thead th { background: var(--panel-2); position: sticky; top: 0; font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  table.list tbody tr { cursor: pointer; }
  table.list tbody tr:hover { background: var(--accent-soft); }
  table.list td.code { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .yes { color: var(--free); font-weight: 700; }
  .no { color: var(--ng); font-weight: 700; }

  .guide { display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 10px; }
  .card h2 { margin: 0; font-size: 18px; }
  .flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; counter-reset: s; margin: 0; padding: 0; list-style: none; }
  .flow li { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .flow li b { display: block; font-size: 14px; margin-bottom: 2px; }
  .flow li b::before { counter-increment: s; content: counter(s); font-family: var(--mono); color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
  .foot { margin-top: 28px; font-size: 12px; color: var(--muted); max-width: 80ch; }

  /* ---------- 既定はスマホの1カラム構成。ここから広い画面ほど拡張する ---------- */
  .detail-slot { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 88px); }
  .detail-slot[data-open="false"] { display: none; }
  body.lock { overflow: hidden; }

  @media (min-width: 460px) {
    .verdict { grid-template-columns: auto 1fr; gap: 4px 14px; }
    .badge { grid-row: span 2; justify-self: auto; }
    .judge { grid-template-columns: 1fr 1fr; }
    .kv { grid-template-columns: max-content 1fr; gap: 6px 14px; }
    .kv dd { margin: 0; }
    .code { grid-template-columns: minmax(150px, max-content) 1fr; gap: 2px 12px; }
    .code .n { grid-column: 2; }
  }
  @media (min-width: 860px) {
    /* スマホは全画面シート表示の一覧＋詳細、860px以上は左右2カラム＋上部タブに切り替え */
    .wrap { padding-block: 20px 64px; }
    .split { grid-template-columns: minmax(280px, 380px) 1fr; align-items: start; }
    .detail-slot { position: static; inset: auto; z-index: auto; background: none; overflow: visible; padding: 0; }
    .detail-slot[data-open="false"] { display: block; }
    .back { display: none; }
    body.lock { overflow: auto; }
    .tabs {
      position: static; left: auto; right: auto; bottom: auto; box-shadow: none;
      display: flex; gap: 2px; margin: 16px 0 12px; border-top: 0; border-bottom: 2px solid var(--line);
      background: none; padding-bottom: 0; overflow-x: auto;
    }
    .tab {
      flex: none; flex-direction: row; padding: 8px 14px; font-size: 14px; gap: 8px;
      border-top: 0; margin-top: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .tab svg { width: 17px; height: 17px; }
    .tab[aria-selected="true"] { border-top-color: transparent; border-bottom-color: var(--accent); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .item, .chip, .ctab, .tab { transition: background-color .12s, border-color .12s, color .12s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 style="margin:0">
      <button type="button" class="brand" id="brandHome" aria-label="スマホ移行Check Tool（タップでトップに戻る）">
        <img class="brand-icon" src="icons/icon-192.png" alt="" width="58" height="58">
        <span class="brand-text">
          <span class="brand-title">スマホ移行</span>
          <span class="brand-sub">CHECK TOOL</span>
          <span class="brand-tag">SIMロック・キャリアメールをすばやく確認</span>
        </span>
      </button>
    </h1>
  </header>

  <section class="search" aria-label="検索">
    <div class="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="例：iPhone 12、SO-52B、アクオス、Galaxy、らくらく" autocomplete="off" aria-label="機種名・型番・メーカーで検索">
    </div>
    <button type="button" class="filtertoggle" id="filterToggle" aria-expanded="true" aria-controls="filterPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      絞り込み<span class="fcount" id="fcount" hidden>0</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
    </button>
    <div class="filterpanel" id="filterPanel">
      <div class="filters">
        <span class="lbl">販売キャリア</span>
        <div class="chips" id="carrierChips"></div>
      </div>
      <div class="filters">
        <span class="lbl">種類</span>
        <div class="chips" id="osChips"></div>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist" aria-label="表示切替">
    <button class="tab" role="tab" id="tab-search" data-tab="search" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      機種検索
    </button>
    <button class="tab" role="tab" id="tab-table" data-tab="table" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      一覧表
    </button>
    <button class="tab" role="tab" id="tab-mail" data-tab="mail" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
      メール一覧
    </button>
    <button class="tab" role="tab" id="tab-guide" data-tab="guide" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7v.01"></path></svg>
      確認の基本
    </button>
    <button class="tab" role="tab" id="tab-qr" data-tab="qr" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v3M17 20h4"></path></svg>
      QR
    </button>
  </nav>

  <section id="view-search" class="view">
    <div class="split">
      <div>
        <p class="count" id="count"></p>
        <div class="results" id="results"></div>
      </div>
      <div class="detail-slot" id="detailSlot" data-open="false">
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </section>

  <section id="view-table" class="view" hidden>
    <div class="legend" id="legend" style="margin-bottom:8px"></div>
    <div class="tablewrap"><table class="list" id="lockTable"></table></div>
  </section>

  <section id="view-mail" class="view" hidden></section>
  <section id="view-guide" class="view" hidden></section>
  <section id="view-qr" class="view" hidden></section>

  <p class="foot">※ 本ツールはサンプルです。2026年9月時点の現場用リファレンス資料をもとに作成しています。発売時期はおおよそ、表示名はOS・機種で異なる場合があります。料金・受付条件・URLは変更されることがあるため、最終判断とお客さまへの案内は各社公式情報で確認してください。</p>
</div>

<script src="data.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s ?? "").normalize("NFKC").toLowerCase().replace(/[\s\-‐ー_・／/（）()]/g, "")
    .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)); // カタカナ→ひらがな

  // キャリアロゴバッジ（実ロゴ画像は権利上使用できないため、ブランドカラー＋
  // イニシャルの統一サイズバッジで代用。ロゴ画像が使える場合はここを差し替え）
  const clogo = key => `<span class="clogo" style="background:${CARRIERS[key].color}">${esc(CARRIERS[key].mark)}</span>`;

  // QRコード：追跡用パラメータ（utm_*, _gl, _ga, icid, l-id）だけ取り除いて
  // 読み取り先を短く・確実にする。それ以外のクエリ（v=動画ID等）は保持
  const qrClean = u => {
    try {
      const url = new URL(u);
      [...url.searchParams.keys()].forEach(k => {
        if (/^utm_/.test(k) || /^_g/.test(k) || k === "icid" || k === "l-id") url.searchParams.delete(k);
      });
      url.hash = "";
      return url.toString();
    } catch (e) { return u; }
  };
  const qrSection = items => !items || !items.length ? "" : `
    <div class="qrwrap">
      <div class="qrhead">QRコードで開く<span class="hint">別の端末のカメラで読み取ると、このページがそのまま開きます</span></div>
      <div class="qrgrid">${items.map(it => `
        <div class="qrcell">
          <div class="qrimg" data-qr="${esc(qrClean(it.url))}"></div>
          <div class="qrlabel">${esc(it.label)}</div>
        </div>`).join("")}</div>
    </div>`;
  function mountQR(root) {
    (root || document).querySelectorAll(".qrimg:not([data-qr-done])").forEach(el => {
      el.setAttribute("data-qr-done", "1");
      try {
        const qr = qrcode(0, "M");
        qr.addData(el.dataset.qr);
        qr.make();
        el.innerHTML = qr.createSvgTag({ scalable: true });
      } catch (e) { el.textContent = "QR生成エラー"; }
    });
  }

  const STATUS = {
    free:   { label: "ロックなし（SIMフリー）", short: "ロックなし", cls: "st-free" },
    locked: { label: "ロックあり出荷", short: "ロックあり", cls: "st-locked" },
    cond:   { label: "購入時期で解除済の可能性", short: "条件付き", cls: "st-cond" },
    rule:   { label: "発売日・購入日で判定", short: "要判定", cls: "st-rule" }
  };
  const OSNAME = { ios: "iPhone", android: "Android", garaho: "ガラホ" };
  const CARRIER_ORDER = ["docomo", "au", "sb", "rakuten", "uq", "ymobile", "free"];
  const TEST_NET = {
    docomo: "au回線 or ソフトバンク回線のSIM",
    au: "ドコモ回線 or ソフトバンク回線のSIM",
    sb: "ドコモ回線 or au回線のSIM",
    rakuten: "（確認不要）",
    free: "（確認不要）"
  };
  const SAME_NET = {
    docomo: "ahamo・irumo・ドコモ系MVNO",
    au: "UQ・povo・au系MVNO",
    sb: "Y!mobile・LINEMO・ソフトバンク系MVNO"
  };

  const state = { q: "", carrier: "all", os: "all", tab: "search", sel: null, selCarrier: null, mailSrc: null, mailOs: null, folds: new Set() };

  const deviceOs = d => MAKERS[d.maker].os;
  const makerName = d => d.maker === "garaho" && d.brand ? MAKERS[d.brand].name.replace(/（.*/, "") + "（ガラホ）" : MAKERS[d.maker].name;

  // 検索用インデックス
  // メーカー名の（BASIO・かんたんスマホ・DIGNO…）のような副ブランド列挙は、
  // その名を持つ全機種にヒットしてしまうため、索引には括弧の前だけを使う
  const bareMakerName = name => name.replace(/（.*/, "");
  DEVICES.forEach(d => {
    const parts = [d.name, d.kana, bareMakerName(MAKERS[d.maker].name), d.brand && bareMakerName(MAKERS[d.brand].name), OSNAME[deviceOs(d)],
      ...d.variants.flatMap(v => [v.code, CARRIERS[v.c].name, CARRIERS[v.c].short])];
    d._idx = norm(parts.join(" "));
  });

  /* ---------- chips ---------- */
  function renderChips() {
    const cc = [["all", "すべて"], ...CARRIER_ORDER.map(k => [k, CARRIERS[k].name])];
    $("#carrierChips").innerHTML = cc.map(([k, n]) =>
      `<button class="chip" data-carrier="${k}" aria-pressed="${state.carrier === k}">${k !== "all" ? `${clogo(k)}` : ""}${esc(n)}</button>`).join("");
    const oc = [["all", "すべて"], ["ios", "iPhone"], ["android", "Android"], ["garaho", "ガラホ"]];
    $("#osChips").innerHTML = oc.map(([k, n]) => `<button class="chip" data-os="${k}" aria-pressed="${state.os === k}">${n}</button>`).join("");
  }

  /* ---------- filtering ---------- */
  function filtered() {
    const terms = norm(state.q) ? state.q.normalize("NFKC").split(/\s+/).map(norm).filter(Boolean) : [];
    return DEVICES.filter(d => {
      if (state.os !== "all" && deviceOs(d) !== state.os) return false;
      if (state.carrier !== "all" && !d.variants.some(v => v.c === state.carrier)) return false;
      return terms.every(t => d._idx.includes(t));
    });
  }

  function vtags(d) {
    const vs = state.carrier === "all" ? d.variants : d.variants.filter(v => v.c === state.carrier);
    return vs.map(v => `<span class="vtag ${v.ship === "locked" ? "vneed" : STATUS[v.ship].cls}">${clogo(v.c)}${esc(CARRIERS[v.c].short)}${v.code ? " " + esc(v.code.replace(/（.*）/, "")) : ""}${v.ship === "locked" ? `<b>要解除</b>` : v.ship === "free" ? `<b>不要</b>` : ""}</span>`).join("");
  }

  function renderResults() {
    let list = filtered();
    const specific = list.filter(d => !d.generic);
    let generic = list.filter(d => d.generic);
    // 検索語がある時、具体機種がヒットしたら汎用は同メーカーのものだけ残す
    if (state.q && specific.length) {
      const makers = new Set(specific.map(d => d.maker));
      generic = generic.filter(d => makers.has(d.maker));
    }
    list = [...specific, ...generic];
    $("#count").textContent = state.q || state.carrier !== "all" || state.os !== "all"
      ? `${specific.length}機種ヒット` + (generic.length ? `（＋メーカー別の汎用ガイド ${generic.length}件）` : "")
      : `登録 ${specific.length}機種 ＋ メーカー別の汎用ガイド`;
    if (!list.length) {
      $("#results").innerHTML = `<div class="empty">該当する機種がありません。<br>メーカー名（例：Galaxy、AQUOS、OPPO）で検索すると、メーカー別の確認方法が出ます。見つからない機種は「確認の基本」タブのSTEP 0の順で判定してください。</div>`;
      return;
    }
    $("#results").innerHTML = list.map(d => `
      <button class="item${d.generic ? " generic" : ""}" data-id="${d.id}" aria-current="${state.sel === d.id}">
        <span class="nm">${esc(d.name)}</span>
        <span class="mk">${esc(makerName(d))} ・ ${OSNAME[deviceOs(d)]}${d.generic ? " ・ 機種が一覧に無いとき用" : ""}</span>
        ${d.generic ? "" : `<span class="vrow">${vtags(d)}</span>`}
      </button>`).join("");
  }

  /* ---------- detail ---------- */
  function pickVariant(d) {
    let v = d.variants.find(x => x.c === state.selCarrier);
    if (!v && state.carrier !== "all") v = d.variants.find(x => x.c === state.carrier);
    return v || d.variants[0];
  }

  function codeRows(keys) {
    return keys.map(k => {
      const c = CODES[k]; const label = c.label || k;
      return `<div class="code"><span class="c">${esc(label)}${c.label ? "" : `<button class="copy" data-copy="${esc(k)}">コピー</button>`}</span><span>${esc(c.show)}</span><span class="n">${esc(c.target)} ／ ${esc(c.note)}</span></div>`;
    }).join("");
  }

  function mailBlock(src, os, opts) {
    opts = opts || {};
    const m = MAIL[src];
    const osKey = os === "ios" ? "iphone" : "android";
    const pick = opts.hidePicker ? "" : `<div class="srcpick"><label>旧キャリア（解約する側）
      <select class="mailsrc">${CARRIER_ORDER.filter(k => k !== "free").map(k => `<option value="${k}"${k === src ? " selected" : ""}>${esc(CARRIERS[k].name)}</option>`).join("")}</select></label></div>`;
    const toggle = `<div class="ostoggle" role="group" aria-label="設定する端末">
      <button data-mailos="ios" aria-pressed="${os === "ios"}">iPhoneで設定</button>
      <button data-mailos="android" aria-pressed="${os !== "ios"}">Androidで設定</button></div>`;
    let body = "";
    if (m.ok === false) {
      body = `<div class="callout ng"><b>持ち運び不可</b>：${esc(m.reason)}</div>
        <div class="addr">${m.addresses.map(a => `<span>${esc(a)}</span>`).join("")}</div>
        <ul class="notes">${m.advice.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
    } else if (m.ok === null) {
      body = `<div class="callout info">${esc(m.reason)}</div>`;
    } else {
      const o = m[osKey];
      const srv = o.server || m.server;
      body = `
        <div class="callout info"><b>${esc(m.title)}：持ち運び可</b>　申込期限 ${esc(m.deadline)}</div>
        <div class="addr">${m.addresses.map(a => `<span>${esc(a)}</span>`).join("")}</div>
        ${m.ng ? `<div class="callout ng" style="font-size:13px"><b>対象外：</b>${m.ng.map(esc).join("、")}</div>` : ""}
        <dl class="kv">
          <dt>手続き場所</dt><dd>${esc(m.place)}</dd>
          <dt>事前に確認</dt><dd>${esc(m.account)}</dd>
          <dt>支払方法</dt><dd>${esc(m.pay)}</dd>
          <dt>料金</dt><dd>${esc(m.fee)}</dd>
        </dl>
        <div><b>${os === "ios" ? "iPhone" : "Android"}での設定</b>　<span class="pill st-rule">${esc(o.app)}</span></div>
        <ol class="steps">${o.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        ${srv ? `<div style="overflow-x:auto"><table class="srv"><tbody>${srv.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>` : ""}
        <div class="links"><a href="${esc(o.link.url)}" target="_blank" rel="noopener">${esc(o.link.label)}</a>${m.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>
        ${qrSection(m.entries)}
        <details class="more"><summary>申込手順と注意事項</summary>
          <div style="display:grid;gap:10px">
            <div><b>申込</b><ol class="steps">${m.apply.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
            <div><b>注意事項</b><ul class="notes">${m.cautions.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
            <div><b>全キャリア共通（MNP切替前に確認・説明）</b><ul class="notes">${MAIL_COMMON.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
          </div>
        </details>`;
    }
    return `<div class="mailhead">${pick}${toggle}</div>${body}`;
  }

  const ICON_WARN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"></path><path d="M12 10v5M12 18v.01"></path></svg>`;
  const ICON_OK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.7 2.7L16 9.8"></path></svg>`;
  const ICON_Q = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4M12 17v.01"></path></svg>`;
  const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9l6 6M15 9l-6 6"></path></svg>`;
  const extA = (url, label, cls) => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;

  // 確認手順のパンくず（1機種で手順が複数ある京セラ等は配列で保持）
  // 機種ごとに path/paths を直接持たせておけば、メーカー共通の場所より優先して使う
  // （京セラのように、機種によって画面の階層が違うメーカー向け）
  const makerPathList = (mk, c, d) => (d && (d.paths || d.path)) ? (d.paths || [d.path]) : (mk.paths || [(mk.pathBy && mk.pathBy[c]) || mk.path]);
  const pathText = p => `${p.steps.join("→")}→「${p.target}」`;
  const pathListText = list => list.map(p => (p.label ? p.label + "：" : "") + pathText(p)).join("／");
  const pathChip = p => `<div class="pathnav">${p.label ? `<span class="pc-label">${esc(p.label)}</span>` : ""}<div class="pc-crumbs">${
    p.steps.map(s => `<span class="pc-step">${esc(s)}</span><span class="pc-arrow">→</span>`).join("")
  }<span class="pc-target">「${esc(p.target)}」</span></div>${p.note ? `<div class="pc-note">${esc(p.note)}</div>` : ""}</div>`;
  const pathListChips = list => list.map(pathChip).join("");

  // ① SIMロック解除が必要か
  function lockCard(d, v, pathList) {
    const path = pathListText(pathList);
    if (v.ship === "free") return `<section class="key ok">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_OK}解除不要（ロックなし）</div>
      <div class="key-sub">${esc(v.note || d.note || "ロックなしで販売された機種です。")}</div></section>`;
    if (v.ship === "locked") return `<section class="key need">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_WARN}解除が必要（必ず確認）</div>
      <div class="key-sub">ロックあり出荷。<b>${esc(path)}</b> で解除済みか確認し、ロック中なら②から手続きしてください。</div></section>`;
    return `<section class="key check">
      <div class="key-label"><span class="num">1</span>SIMロック解除</div>
      <div class="key-main">${ICON_Q}要確認${v.ship === "cond" ? "（解除済の可能性あり）" : ""}</div>
      <div class="key-sub">${esc(v.ship === "cond" ? (v.note || UNLOCK[v.c].rules[0]) : "発売日・購入日で判定")}。確認場所：<b>${esc(path)}</b></div></section>`;
  }

  // ② SIMロック解除の入口
  function unlockCard(v) {
    const ur = UNLOCK[v.c];
    const noNeed = v.c === "rakuten" || v.c === "free" || v.ship === "free";
    return `<section class="key">
      <div class="key-label"><span class="num">2</span>SIMロック解除の入口（${esc(CARRIERS[v.c].name)}）</div>
      ${noNeed ? `<div class="key-main" style="font-size:17px">手続き不要</div>
           ${ur.links.length ? `<div class="key-sub">念のため確認する場合：${extA(ur.links[0].url, ur.links[0].label, "")}</div>` : ""}`
        : `<div class="btnrow">${ur.links.slice(0, 1).map(l => extA(l.url, l.label, "bigbtn")).join("")}</div>
           <div class="key-sub">照会・手続き：${esc(ur.inquiry)}</div>
           ${qrSection(ur.links.slice(0, 1).map(l => ({ label: "SIMロック解除ページ", url: l.url })))}`}
    </section>`;
  }

  // ③ キャリアメール持ち運びの入口
  function mailCard(v, src, os) {
    const head = `<div class="key-label"><span class="num">3</span>キャリアメール持ち運び${src ? `（旧：${esc(CARRIERS[src].name)}）` : ""}</div>`;
    if (!src) return `<section class="key">${head}
      <div class="key-sub">SIMフリー端末です。解約する旧キャリアを下の「キャリアメール持ち運びの詳細」で選んでください。</div></section>`;
    const m = MAIL[src];
    if (m.ok === false) return `<section class="key ng">${head}
      <div class="key-main">${ICON_X}持ち運び不可</div>
      <div class="key-sub">${esc(m.addresses.join("、"))} は持ち運びサービスの対象外です。</div></section>`;
    const o = m[os === "ios" ? "iphone" : "android"];
    const apply = (m.entries && m.entries[0]) || m.links[0];
    return `<section class="key">${head}
      <div class="btnrow">
        ${extA(apply.url, "申込ページを開く", "bigbtn")}
        ${extA(o.link.url, `${os === "ios" ? "iPhone" : "Android"}の設定方法`, "bigbtn sub")}
      </div>
      <div class="key-sub">申込期限：<b>${esc(m.deadline)}</b>　設定アプリ：${esc(o.app)}</div>
      ${qrSection([{ label: "申込ページ", url: apply.url }, { label: `${os === "ios" ? "iPhone" : "Android"}の設定方法`, url: o.link.url }])}</section>`;
  }

  const fold = (key, title, hint, body) =>
    `<details class="fold" data-fold="${key}"${state.folds.has(key) ? " open" : ""}><summary><span>${title}${hint ? `<small>${hint}</small>` : ""}</span></summary><div class="fold-body">${body}</div></details>`;

  function renderDetail() {
    const box = $("#detail");
    const d = DEVICES.find(x => x.id === state.sel);
    if (!d) {
      box.innerHTML = `<div class="sec"><h3>機種を選んでください</h3><p style="margin:0;color:var(--muted)">一覧から端末をタップすると、SIMロック解除の要否・解除の入口・キャリアメール持ち運びの入口を表示します。</p></div>`;
      return;
    }
    const v = pickVariant(d);
    state.selCarrier = v.c;
    const mk = MAKERS[d.maker];
    const os = deviceOs(d);
    const ur = UNLOCK[v.c];
    const pathList = makerPathList(mk, v.c, d);
    const netKey = CARRIERS[v.c].net;
    const noCheck = v.c === "rakuten" || v.c === "free";
    const brandMk = d.brand ? MAKERS[d.brand] : null;

    const mailSrc = state.mailSrc || (v.c === "free" ? null : v.c);
    const mailOs = state.mailOs || (os === "ios" ? "ios" : "android");

    box.innerHTML = `
      <div class="d-head">
        <button class="back" id="back">← 一覧へ戻る</button>
        <h2>${esc(d.name)}</h2>
        <div class="d-meta"><span>${esc(makerName(d))}</span>${v.code ? `<span>型番 <b class="mono">${esc(v.code)}</b></span>` : ""}<span>発売 ${esc(v.rel)}</span></div>
        <div class="ctabs" role="group" aria-label="販売キャリアを選択">${d.variants.map(x => `<button class="ctab" data-vc="${x.c}" aria-pressed="${x.c === v.c}">${clogo(x.c)}${esc(CARRIERS[x.c].name)}版</button>`).join("")}</div>
      </div>

      <div class="keys">
        ${lockCard(d, v, pathList)}
        <section class="card check-detail">
          <h3 style="margin:0;font-size:15px">SIMロックの確認方法</h3>
          ${pathListChips(pathList)}
          <div class="judge">
            <div class="st-free"><span class="lab">解除済・ロックなし</span>${esc(mk.ok)}</div>
            <div class="st-locked"><span class="lab">ロック中</span>${esc(mk.ng)}</div>
          </div>
          <ul class="notes">${mk.notes.map(n => `<li>${esc(n)}</li>`).join("")}${brandMk ? `<li>${esc(brandMk.name)}のスマホ版の確認場所：${esc(pathListText(makerPathList(brandMk, v.c)))}（ガラホでは無いことが多い）</li>` : ""}</ul>
          ${netKey && !noCheck ? `<div class="callout warn"><b>表示が無い・不明なときは他社SIMテスト</b><br>挿すSIM：${esc(TEST_NET[netKey])}<br>⚠ ${esc(SAME_NET[netKey])} のSIMは同じ回線網なので判定になりません。解除コード入力画面が出たらキャンセル。</div>` : ""}
          <details class="more"><summary>使えるダイヤルコード</summary><div class="codes">${codeRows(mk.codes)}</div></details>
        </section>
        ${unlockCard(v)}
        ${mailCard(v, mailSrc, mailOs)}
      </div>

      ${fold("unlock", "解除手続きの流れ・照会先", `${esc(CARRIERS[v.c].name)}の解除ルール`, `
        <ul class="notes">${ur.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        ${noCheck ? "" : `<ol class="steps">${ur.how.filter(s => os === "ios" ? !/^Android/.test(s) : !/^iPhone/.test(s)).map(s => `<li>${esc(s)}</li>`).join("")}</ol>`}
        <dl class="kv"><dt>照会先</dt><dd>${esc(ur.inquiry)}</dd><dt>解除の仕組み</dt><dd>${esc(ur.mechanism)}</dd></dl>
        ${ur.links.length ? `<div class="links">${ur.links.map(l => extA(l.url, l.label, "")).join("")}</div>` : ""}`)}

      ${fold("mail", "キャリアメール持ち運びの詳細", "旧キャリアの切替・設定手順・QRコード・注意事項",
        mailBlock(mailSrc || "docomo", mailOs))}`;
    mountQR(box);
  }

  /* ---------- table view ---------- */
  function renderTable() {
    $("#legend").innerHTML = Object.values(STATUS).map(s => `<span><span class="pill ${s.cls}">${s.short}</span> ${s.label}</span>`).join("");
    const rows = [];
    filtered().filter(d => !d.generic).forEach(d => d.variants.forEach(v => {
      if (state.carrier !== "all" && v.c !== state.carrier) return;
      const mk = MAKERS[d.maker];
      rows.push({ d, v, html: `<tr data-id="${d.id}" data-vc="${v.c}">
        <td><span class="crow">${clogo(v.c)} ${esc(CARRIERS[v.c].name)}</span></td>
        <td>${esc(makerName(d).replace(/（.*）$/, ""))}</td>
        <td><b>${esc(d.name)}</b></td>
        <td class="code">${esc(v.code || "—")}</td>
        <td>${esc(v.rel)}</td>
        <td><span class="pill ${STATUS[v.ship].cls}">${STATUS[v.ship].short}</span></td>
        <td>${esc(pathListText(makerPathList(mk, v.c, d)))}</td>
        <td>${MAIL[v.c].ok === true ? `<span class="yes">可</span>` : MAIL[v.c].ok === false ? `<span class="no">不可</span>` : "—"}</td>
      </tr>` });
    }));
    rows.sort((a, b) => CARRIER_ORDER.indexOf(a.v.c) - CARRIER_ORDER.indexOf(b.v.c));
    $("#lockTable").innerHTML = `<thead><tr><th>販売</th><th>メーカー</th><th>機種</th><th>型番</th><th>発売</th><th>出荷時</th><th>確認方法（ここを見る）</th><th>メール持運</th></tr></thead>
      <tbody>${rows.map(r => r.html).join("") || `<tr><td colspan="8">該当なし</td></tr>`}</tbody>`;
  }

  function renderMailView() {
    const keys = ["docomo", "au", "sb", "ymobile", "rakuten", "uq"];
    const cell = (k, os) => { const m = MAIL[k]; if (!m.ok) return "—"; const o = m[os]; return `<b>${esc(o.app)}</b><br>${esc(o.steps[0])}`; };
    $("#view-mail").innerHTML = `<div class="guide">
      <div class="card"><h2>キャリア × iPhone／Android 対応一覧</h2>
        <div class="tablewrap" style="border:0"><table class="list"><thead><tr><th>旧キャリア</th><th>可否</th><th>対象アドレス</th><th>申込期限・場所</th><th>iPhone</th><th>Android</th><th>公式</th></tr></thead><tbody>
        ${keys.map(k => { const m = MAIL[k]; return `<tr data-mail="${k}">
          <td><span class="crow">${clogo(k)} <b>${esc(CARRIERS[k].name)}</b></span></td>
          <td>${m.ok ? `<span class="yes">〇</span>` : `<span class="no">×</span>`}</td>
          <td class="code">${m.addresses.map(esc).join("<br>")}</td>
          <td>${m.ok ? esc(m.deadline) + "<br>" + esc(m.place) : esc(m.reason)}</td>
          <td>${cell(k, "iphone")}</td><td>${cell(k, "android")}</td>
          <td>${m.ok ? `<a href="${esc(m.links[0].url)}" target="_blank" rel="noopener">公式↗</a>` : ""}</td></tr>`; }).join("")}
        </tbody></table></div>
      </div>
      <div class="card"><h2>作業の流れ</h2><ol class="flow">${MAIL_FLOW.map(([t, s]) => `<li><b>${esc(t)}</b>${esc(s)}</li>`).join("")}</ol></div>
      <div class="card"><h2>全キャリア共通の注意（MNP切替前に確認・説明）</h2><ul class="notes">${MAIL_COMMON.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="card"><h2>キャリア別の詳細</h2>
        <p style="margin:0;font-size:13px;color:var(--muted)">旧キャリアと設定する端末を切り替えて確認できます。</p>
        <div id="mailFull" style="display:grid;gap:10px"></div></div>
      <div class="card"><h2>持ち運びできない格安SIMのアドレス（2023年5月時点）</h2>
        <div class="tablewrap" style="border:0"><table class="list" style="min-width:0"><tbody>${MAIL_MVNO_NG.map(([n, a]) => `<tr style="cursor:default"><td>${esc(n)}</td><td class="code">${esc(a)}</td><td><span class="no">×</span></td></tr>`).join("")}</tbody></table></div>
      </div></div>`;
    renderMailFull();
  }
  function renderMailFull() {
    const el = $("#mailFull"); if (!el) return;
    el.innerHTML = mailBlock(state.mailSrc || "docomo", state.mailOs || "ios");
    mountQR(el);
  }

  /* ---------- guide view ---------- */
  function renderGuide() {
    const steps = [
      ["発売日・購入元を確認", "2021/10/1以降発売の機種、Apple／Google Store・メーカー直販・楽天モバイル購入品は原則ロックなし"],
      ["設定画面で確認", "iPhone・Xperia・Galaxy・AQUOS等は設定に表示あり（機種検索で場所を確認）"],
      ["ダイヤルコード", "一部Androidのみ。国内キャリア版は無効化されていることが多い"],
      ["他社SIMを挿す", "解除コード入力画面や「SIM無効」が出たらロックあり"],
      ["販売キャリアに照会", "IMEIを伝えればショップ・電話・Webで確認できる"]
    ];
    $("#view-guide").innerHTML = `<div class="guide">
      <div class="card"><h2>STEP 0 ─ 確認の順番（上から試せば迷わない）</h2><ol class="flow">${steps.map(([t, s]) => `<li><b>${esc(t)}</b>${esc(s)}</li>`).join("")}</ol>
        <div class="callout info"><b>現場の最短ルート：</b>① <span class="mono">*#06#</span> でIMEIを控える → ② 設定画面で表示確認 → ③ 表示なし・不明なら他社回線SIMを挿す → ④ それでも不明ならIMEIで販売キャリアへ照会</div></div>
      <div class="card"><h2>キャリア別 ─ ロックなし販売の目安と照会先</h2>
        <div class="tablewrap" style="border:0"><table class="list" style="min-width:640px"><thead><tr><th>販売元</th><th>ロックなしで販売された目安</th><th>照会方法</th><th>解除の仕組み（Android）</th></tr></thead><tbody>
        ${CARRIER_ORDER.map(k => `<tr style="cursor:default"><td><span class="crow">${clogo(k)} <b>${esc(CARRIERS[k].name)}</b></span></td><td>${UNLOCK[k].rules.map(esc).join("<br>")}</td><td>${esc(UNLOCK[k].inquiry)}</td><td>${esc(UNLOCK[k].mechanism)}</td></tr>`).join("")}
        </tbody></table></div></div>
      <div class="card"><h2>他社SIMテストのコツ</h2><ul class="notes">
        <li>販売キャリアと<b>別の回線網</b>のSIMを使う（例：au版端末 → ドコモ回線 or SB回線のSIM）</li>
        <li>⚠ 同じ回線網の格安SIM（au版にUQ・povo・au系MVNO等）はロック中でも使えるため判定にならない</li>
        <li>ロックありの症状：iPhone「SIMはサポートされていません」／Android「SIMネットワークのロック解除PIN」入力画面／ガラホ 解除コード入力画面・圏外のまま</li>
        <li>電波が立ってもAPN未設定だとデータ通信は不可。通話 or SMS受信で判定</li>
        <li>解除コード入力画面は入力回数に上限あり。コード不明ならキャンセル</li></ul></div>
      <div class="card"><h2>ダイヤルコード（電話アプリで入力）</h2><div class="codes">${codeRows(Object.keys(CODES))}</div>
        <p style="margin:0;font-size:12px;color:var(--muted)">ダイヤルコードはメーカー非公式機能。機種・OS・キャリアにより無反応／表示が異なる。「反応しない＝ロックなし」ではない。解除系コード（#7465625*638*# 等）は誤入力でロック回数を消費する恐れがあるため現場では使用しない。</p></div>
      <div class="card"><h2>混同しやすい3つのロック</h2><dl class="kv">
        <dt>SIMロック</dt><dd>他社SIMが使えない（本ツールの対象）</dd>
        <dt>ネットワーク利用制限（赤ロム）</dt><dd>分割未払い・盗難等で通信停止。キャリアのIMEI判定サイトで「○△×」確認。SIMロックとは別物</dd>
        <dt>アクティベーションロック・FRP</dt><dd>前所有者のApple ID／Googleアカウントが残っている状態。初期化しても解除されない</dd></dl></div>
    </div>`;
  }

  /* ---------- QRだけ読み取りたいとき（機種を検索しなくても、上部の「販売キャリア」で選べばQRを出す） ---------- */
  function qrBody(c) {
    if (!c || c === "all") return `<div class="empty">上の「絞り込み」から販売キャリアを1つ選ぶと、SIMロック解除とキャリアメール持ち運びのQRコードを表示します。</div>`;
    if (c === "free") return `<div class="empty">${clogo("free")} SIMフリーは特定のキャリアに紐づかないため、QRコードの対象がありません。旧キャリアのメール持ち運びは「メール一覧」タブから確認してください。</div>`;
    const ur = UNLOCK[c];
    const noNeed = c === "rakuten";
    return `
      <div class="card">
        <h2>${clogo(c)} ${esc(CARRIERS[c].name)}</h2>
        <p style="margin:0;font-size:13px;color:var(--muted)">別の端末のカメラでQRコードを読み取ると、そのページがそのまま開きます。</p>
      </div>
      <div class="card">
        <h2>① SIMロック解除</h2>
        <ul class="notes">${ur.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        ${noNeed
          ? `<div class="callout info">${esc(ur.mechanism)}</div>`
          : `<div class="links">${ur.links.map(l => extA(l.url, l.label, "")).join("")}</div>${qrSection(ur.links)}`}
      </div>
      <div class="card">
        <h2>② キャリアメール持ち運び（旧：${esc(CARRIERS[c].name)}）</h2>
        ${mailBlock(c, state.mailOs || "ios", { hidePicker: true })}
      </div>`;
  }
  function renderQrView() {
    $("#view-qr").innerHTML = `<div class="guide">${qrBody(state.carrier)}</div>`;
    mountQR($("#view-qr"));
  }

  /* ---------- tabs / routing ---------- */
  function setTab(t) {
    state.tab = t;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    document.querySelectorAll(".view").forEach(v => { v.hidden = v.id !== "view-" + t; });
    if (t === "table") renderTable();
    if (t === "mail") renderMailView();
    if (t === "guide") renderGuide();
    if (t === "qr") renderQrView();
  }

  function openDevice(id, vc) {
    state.sel = id; state.selCarrier = vc || null; state.mailSrc = null; state.mailOs = null;
    renderResults(); renderDetail();
    const slot = $("#detailSlot");
    slot.dataset.open = "true";
    if (matchMedia("(max-width: 860px)").matches) { document.body.classList.add("lock"); slot.scrollTop = 0; }
    try { history.replaceState(null, "", "#" + id + (state.selCarrier ? "." + state.selCarrier : "")); } catch (e) {}
  }

  function updateFcount() {
    const n = (state.carrier !== "all" ? 1 : 0) + (state.os !== "all" ? 1 : 0);
    const el = $("#fcount");
    el.hidden = n === 0;
    el.textContent = String(n);
  }

  function refresh() {
    renderChips(); renderResults(); updateFcount();
    if (state.tab === "table") renderTable();
    if (state.tab === "qr") renderQrView();
  }

  // タイトルをタップ／クリックしたら検索・絞り込みを初期化してトップに戻る
  function goHome() {
    state.q = ""; state.carrier = "all"; state.os = "all";
    state.sel = null; state.selCarrier = null; state.mailSrc = null; state.mailOs = null;
    $("#q").value = "";
    $("#filterPanel").hidden = false;
    $("#filterToggle").setAttribute("aria-expanded", "true");
    $("#detailSlot").dataset.open = "false";
    document.body.classList.remove("lock");
    setTab("search");
    refresh();
    renderDetail();
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- events ---------- */
  $("#q").addEventListener("input", e => { state.q = e.target.value; refresh(); });
  $("#filterToggle").addEventListener("click", () => {
    const open = $("#filterToggle").getAttribute("aria-expanded") === "true";
    $("#filterToggle").setAttribute("aria-expanded", String(!open));
    $("#filterPanel").hidden = open;
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("button, tr[data-id]");
    if (!t) return;
    if (t.id === "brandHome") { goHome(); return; }
    if (t.dataset.carrier) { state.carrier = t.dataset.carrier; refresh(); return; }
    if (t.dataset.os) { state.os = t.dataset.os; refresh(); return; }
    if (t.dataset.tab) { setTab(t.dataset.tab); return; }
    if (t.classList.contains("item")) { openDevice(t.dataset.id); return; }
    if (t.tagName === "TR" && t.dataset.id) { setTab("search"); openDevice(t.dataset.id, t.dataset.vc); return; }
    if (t.dataset.vc) { state.selCarrier = t.dataset.vc; state.mailSrc = null; renderDetail();
      try { history.replaceState(null, "", "#" + state.sel + "." + state.selCarrier); } catch (e) {} return; }
    if (t.dataset.mailos) {
      state.mailOs = t.dataset.mailos;
      if (state.tab === "mail") renderMailFull();
      else if (state.tab === "qr") renderQrView();
      else renderDetail();
      return;
    }
    if (t.id === "back") { $("#detailSlot").dataset.open = "false"; document.body.classList.remove("lock"); return; }
    if (t.dataset.copy) {
      const txt = t.dataset.copy;
      const done = () => { t.textContent = "コピー済"; setTimeout(() => (t.textContent = "コピー"), 1400); };
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(() => {});
    }
  });
  // 詳細の開閉状態を覚えておき、キャリア切替などで再描画しても閉じないようにする
  document.addEventListener("toggle", e => {
    const f = e.target.dataset && e.target.dataset.fold;
    if (!f) return;
    e.target.open ? state.folds.add(f) : state.folds.delete(f);
  }, true);

  // 外部リンクは別ブラウザで開く。Androidは intent: で Chrome を指定して起動
  // （Chrome が無い端末は browser_fallback_url で既定ブラウザにフォールバック）。
  // iPhone は OS の仕様上ブラウザを指定できないため、新しいタブ（Safari）で開く。
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="http"]');
    if (!a || !/Android/i.test(navigator.userAgent)) return;
    e.preventDefault();
    const u = new URL(a.href);
    location.href = `intent://${u.host}${u.pathname}${u.search}${u.hash}#Intent;scheme=${u.protocol.slice(0, -1)};package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(a.href)};end`;
  });

  document.addEventListener("change", e => {
    if (e.target.classList.contains("mailsrc")) { state.mailSrc = e.target.value; state.tab === "mail" ? renderMailFull() : renderDetail(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
    if (e.key === "Escape" && $("#detailSlot").dataset.open === "true" && matchMedia("(max-width: 860px)").matches) {
      $("#detailSlot").dataset.open = "false"; document.body.classList.remove("lock");
    }
  });

  /* ---------- init ---------- */
  renderChips();
  updateFcount();
  const h = decodeURIComponent(location.hash.slice(1));
  const [hid, hc] = h.split(".");
  if (["table", "mail", "guide", "qr"].includes(hid)) { renderResults(); setTab(hid); }
  else if (DEVICES.some(d => d.id === hid)) openDevice(hid, hc);
  else {
    // 初期表示：サンプルとして iPhone SE（第2世代）ドコモ版を開いておく（スマホ幅では一覧のみ）
    state.sel = "iphone-se2"; state.selCarrier = "docomo";
    renderResults(); renderDetail();
  }

  // PWA: オフラインでも起動できるようアプリ一式をキャッシュするサービスワーカーを登録
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
