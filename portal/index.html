<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkBase Portal</title>
<meta name="application-name" content="WorkBase Portal">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1f2e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkBase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lexend:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout:
   現場ビュー … グラデーションのヘッダー帯に大きな検索欄 → カテゴリ → 作業カード。作業詳細は「準備 / 機器 / ファイル / 手順 / マニュアル」を1ページに並べ、
                 コンテナクエリで PC は2カラム・スマホは1カラムに切り替わる（設定画面のスマホプレビューも同じ部品を使う）。
   設定画面   … 左：大項目→小項目のツリー ／ 中央：タブで1セクションずつ編集 ／ 右：スマホ表示のライブプレビュー。
   色はすべて下のトークンで管理。ブランドのグラデーションは参考画像（濃い青 → 水色）に合わせている。 */
:root {
  --brand-a: #0866b6;
  --brand-b: #1c9ddc;
  --brand-c: #27b3e8;
  --grad: linear-gradient(100deg, var(--brand-a) 0%, var(--brand-b) 62%, var(--brand-c) 100%);
  --on-brand: #ffffff;
  --on-brand-soft: rgba(255, 255, 255, .16);
  --on-brand-line: rgba(255, 255, 255, .32);
  --brand-ink: #0866b6;

  --bg: #f1f6fb;
  --surface: #ffffff;
  --surface-2: #e9f1f8;
  --line: #d8e4ee;
  --line-strong: #b4c7d7;
  --fg: #0d2537;
  --muted: #587084;
  --accent: #0a6fc2;
  --accent-soft: #e1effa;
  --ok: #17845a;
  --ok-soft: #dff3ea;
  --warn: #9c5d00;
  --warn-soft: #fcf0d9;
  --danger: #c2334a;
  --danger-soft: #fce6e9;
  --shadow: 0 1px 2px rgba(13, 37, 55, .06), 0 4px 14px rgba(13, 37, 55, .05);
  --shadow-lg: 0 10px 40px rgba(13, 37, 55, .18);
  --scrim: rgba(8, 24, 38, .5);
  --bezel: #0d2537;
  --logo-a: #0451b0;
  --logo-b: #05bbf6;
  --font-logo: "Lexend", "Noto Sans JP", system-ui, sans-serif;

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  --r-lg: 14px;
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
    --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
    --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
    --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000; --logo-a: #8cc4ff; --logo-b: #27c2fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
  --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
  --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
  --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000; --logo-a: #8cc4ff; --logo-b: #27c2fb;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.4; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .88em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== App bar ===== */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--bar-h); background: var(--grad); color: var(--on-brand);
}
.appbar-in { max-width: 1440px; margin: 0 auto; height: 100%; padding: 0 20px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .02em; white-space: nowrap; background: none; border: 0; color: inherit; padding: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--on-brand); color: var(--brand-ink); display: grid; place-items: center; }
.brand-mark svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
.seg { display: flex; background: var(--on-brand-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--on-brand); padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button svg.i { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--on-brand); color: var(--brand-ink); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
.who-av { width: 32px; height: 32px; border-radius: 50%; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.offline-note { font-size: 12.5px; text-align: center; padding: 6px 16px; background: var(--fg); color: var(--bg); }
.sample-note { font-size: 12px; text-align: center; padding: 5px 16px; background: var(--warn-soft); color: var(--warn); }

/* ===== Common parts ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 700; white-space: nowrap; line-height: 1.4;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn.done { border-color: var(--ok); color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border-radius: 7px; border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--accent); }
.icon-btn.del:hover { color: var(--danger); background: var(--danger-soft); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.icon-btn svg.i { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; line-height: 1; padding: 5px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip svg.i { width: 12px; height: 12px; stroke-width: 2.4; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
.model { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.ico-tile { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ico-tile svg.i { width: 22px; height: 22px; }

/* ===== Worker: home ===== */
.hero { background: var(--grad); color: var(--on-brand); padding: 30px 20px 72px; position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); pointer-events: none;
}
.hero-in { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; position: relative; z-index: 1; }
.hero h1 { font-size: 26px; letter-spacing: .02em; }
.hero p { opacity: .92; font-size: 14px; }
.bigsearch { display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 0 8px 0 16px; box-shadow: var(--shadow-lg); max-width: 760px; }
.bigsearch svg.i { color: var(--accent); width: 22px; height: 22px; }
.bigsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; height: 56px; font-size: 16.5px; }
.bigsearch .icon-btn { width: 36px; height: 36px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; }
.suggest span { opacity: .85; }
.suggest button { border: 1px solid var(--on-brand-line); background: var(--on-brand-soft); color: var(--on-brand); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.suggest button:hover { background: var(--on-brand); color: var(--brand-ink); }

.home { max-width: 1100px; margin: -44px auto 0; padding: 0 20px 72px; position: relative; z-index: 2; display: grid; gap: 28px; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.cat { text-align: left; padding: 16px; display: grid; gap: 10px; align-content: start; transition: border-color .15s, transform .15s; }
.cat:hover { border-color: var(--accent); transform: translateY(-1px); }
.cat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.cat-name { font-weight: 700; font-size: 14.5px; line-height: 1.45; }
.cat-sub { font-size: 12px; color: var(--muted); line-height: 1.55; }
.cat-count { font-size: 12px; color: var(--accent); font-weight: 700; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.list-head h2 { font-size: 17px; }
.list-head .count { color: var(--muted); font-size: 13px; }
.ind { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.ind button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
.ind button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.results { display: grid; gap: 10px; scroll-margin-top: calc(var(--bar-h) + 12px); }
.res {
  display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; text-align: left; width: 100%;
}
.res:hover { border-color: var(--accent); }
.res-body { display: grid; gap: 4px; min-width: 0; }
.res-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.res-title { font-weight: 700; font-size: 15.5px; line-height: 1.5; }
.res-sum { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-models { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.res-why { font-size: 12px; color: var(--warn); font-weight: 700; }
.res-side { display: grid; gap: 6px; justify-items: end; font-size: 12px; color: var(--muted); }
.res-chev { color: var(--line-strong); }
.res:hover .res-chev { color: var(--accent); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }

.side { display: grid; gap: 16px; }
.side .card { padding: 4px 18px 10px; }
.side h3 { font-size: 14px; padding: 12px 0 8px; display: flex; align-items: center; gap: 8px; }
.notice { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; display: grid; gap: 4px; line-height: 1.6; }
.notice time { color: var(--muted); font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; text-align: left; }
.link:hover { text-decoration: underline; }
.recent-item { display: grid; gap: 1px; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; font-size: 13px; }
.recent-item:hover b { color: var(--accent); }
.recent-item small { color: var(--muted); font-size: 12px; }
.support strong { font-size: 18px; display: block; letter-spacing: .03em; }

/* ===== Worker: task detail (container query で PC / スマホ を切り替え) ===== */
.wk-c { container-type: inline-size; --stick-top: var(--bar-h); }
.wk { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 0; justify-self: start; }
.back svg.i { transform: rotate(180deg); width: 16px; height: 16px; }
.wk-head { background: var(--grad); color: var(--on-brand); border-radius: var(--r-lg); padding: 22px 24px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.wk-head::after { content: ""; position: absolute; right: -80px; bottom: -140px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); }
.wk-crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; position: relative; z-index: 1; }
.pill-w { display: inline-flex; align-items: center; gap: 6px; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); border-radius: 999px; padding: 2px 10px 2px 7px; font-weight: 700; }
.pill-w svg.i { width: 15px; height: 15px; }
.wk-head h1 { font-size: 22px; position: relative; z-index: 1; }
.wk-head p { font-size: 14px; opacity: .94; max-width: 70ch; position: relative; z-index: 1; }
.wk-facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 4px 0 0; position: relative; z-index: 1; }
.wk-facts div { display: grid; }
.wk-facts dt { font-size: 11px; opacity: .8; letter-spacing: .06em; }
.wk-facts dd { margin: 0; font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.wk-nav {
  position: sticky; top: var(--stick-top); z-index: 5;
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: -8px 0;
  background: var(--bg); scrollbar-width: none;
}
.wk-nav::-webkit-scrollbar { display: none; }
.wk-nav button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.wk-nav button:hover { color: var(--accent); border-color: var(--accent); }
.wk-nav button.go { color: var(--accent); border-color: var(--accent); }
.wk-nav button:disabled { opacity: .6; }
.wk-nav button svg.i { width: 15px; height: 15px; }
.wk-nav .n { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
.wk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
.wk-main { display: grid; gap: 18px; min-width: 0; }
.wsec { padding: 18px 20px 20px; display: grid; gap: 14px; scroll-margin-top: calc(var(--stick-top) + 56px); }
.wsec-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.wsec-h h2 { font-size: 16.5px; }
.wsec-h .sub { font-size: 12.5px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.sub-h { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.sub-h svg.i { width: 15px; height: 15px; }
.cks { display: grid; gap: 2px; }
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.6; }
.ck:hover { background: var(--surface-2); }
.ck input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
.ck.on > span:first-of-type { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.ck .qty { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
.ck .req { font-size: 10.5px; font-weight: 700; color: var(--danger); margin-left: 6px; }
.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.dev { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.dev-type { font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.dev-name { font-weight: 700; font-size: 14px; }
.dev-model { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); }
.dev-note { font-size: 12px; color: var(--muted); }
.os-line { font-size: 13px; color: var(--muted); }
.bundle { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); }
.bundle b { display: block; font-size: 14.5px; }
.bundle small { font-size: 12.5px; color: var(--muted); }
.files { border: 1px solid var(--line); border-radius: var(--r); }
.file { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; }
.file-ico { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.file-name { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.5; }
.file-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.hash { display: inline-flex; align-items: center; gap: 2px; }
.hash .icon-btn { width: 24px; height: 24px; }
.code-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; margin-top: -6px; }
.code pre { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; white-space: pre; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6; background: var(--warn-soft); color: var(--fg); }
.note svg.i { color: var(--warn); margin-top: 1px; }
.note.info { background: var(--accent-soft); }
.note.info svg.i { color: var(--accent); }
.note b { display: block; }
.wsteps { display: grid; gap: 10px; }

.mans { display: grid; gap: 8px; }
.man { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.man-ico { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.man-ico.pdf { background: var(--danger-soft); color: var(--danger); }
.man-ico.mov { background: var(--accent-soft); color: var(--accent); }
.man-ico.web { background: var(--ok-soft); color: var(--ok); }
.man b { font-size: 14px; display: block; line-height: 1.5; }
.man small { font-size: 12px; color: var(--muted); }
details.old { border: 1px dashed var(--line-strong); border-radius: var(--r); }

.old-body { padding: 0 14px 12px; display: grid; gap: 8px; font-size: 13px; }
.old-row { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); align-items: center; }

.wk-side { position: sticky; top: calc(var(--stick-top) + 54px); display: grid; gap: 14px; }
.prog { padding: 16px 18px; display: grid; gap: 12px; }
.prog-top { display: flex; align-items: baseline; justify-content: space-between; }

.prog-top strong { font-size: 24px; font-variant-numeric: tabular-nums; color: var(--ok); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.prog-rows { display: grid; gap: 6px; font-size: 13px; }
.prog-rows div { display: flex; justify-content: space-between; gap: 8px; }
.prog-rows .v { font-weight: 700; font-variant-numeric: tabular-nums; }

.prog-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@container (max-width: 760px) {
  .wk { padding: 14px 14px 64px; gap: 14px; }
  .wk-head { padding: 18px; border-radius: 12px; }
  .wk-head h1 { font-size: 19px; }
  .wk-head p { font-size: 13.5px; }
  .wk-facts { gap: 6px 18px; }
  .wk-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .wk-side { position: static; order: -1; }
  .prog { padding: 12px 14px; gap: 8px; }
  .prog-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
  .prog-rows div { flex-direction: column-reverse; gap: 0; font-size: 11.5px; }
  .prog-rows .v { font-size: 14px; }
  .prog-actions { display: none; }
  .support-card { display: none; }
  .wsec { padding: 14px; border-radius: 12px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .devs { grid-template-columns: minmax(0, 1fr); }
  .file { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .file-ico { display: none; }
  .file .btn { width: 100%; }
  .bundle .btn { width: 100%; }
  .wstep { grid-template-columns: 32px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .wnum { width: 30px; height: 30px; font-size: 13px; }
}

/* ===== Overlays ===== */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.focus {
  position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto;
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
}
.focus-top { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.focus-top .t { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-bar { height: 4px; background: var(--surface-2); }
.focus-bar span { display: block; height: 100%; background: var(--grad); transition: width .25s; }
.focus-body { padding: 26px 26px 10px; display: grid; gap: 14px; }

.focus-foot { display: flex; gap: 10px; padding: 16px 26px 22px; }
.focus-foot .btn { flex: 1; padding: 12px; font-size: 15px; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(760px, 100%);
  background: var(--surface); box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;

}
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; flex: 1; min-width: 0; }
.drawer-b { overflow-y: auto; padding: 24px; background: var(--surface-2); display: grid; place-items: start center; }
.page-mock { width: 100%; max-width: 560px; aspect-ratio: 1 / 1.414; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 8% 9%; display: grid; align-content: start; gap: 12px; }

.page-mock .ln { height: 9px; border-radius: 4px; background: var(--surface-2); }
.page-mock .img { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.video-mock { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--grad); color: var(--on-brand); display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; }
.video-mock svg.i { width: 54px; height: 54px; }
.drawer-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; }

.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 22px; display: grid; gap: 12px; }
.modal h2 { font-size: 17px; }
.modal p { font-size: 14px; color: var(--muted); }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.scrim.top { z-index: 60; }

.toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); text-align: center; }

/* ===== Admin ===== */
.adm { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
.tree { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }

.tree-list { padding: 0 10px 24px; display: grid; gap: 2px; }
.tree-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; padding: 10px 20px 4px; }
.tc-row { display: flex; align-items: center; gap: 2px; }

.tc-tog.open svg.i { transform: rotate(90deg); }
.tc-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 0; background: none; border-radius: 8px; text-align: left; font-weight: 700; font-size: 13.5px; }

.tc-main .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-main .ct { font-size: 11.5px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.tt-list { display: grid; gap: 1px; padding: 2px 0 6px 28px; position: relative; }
.tt-list::before { content: ""; position: absolute; left: 39px; top: 2px; bottom: 10px; width: 1px; background: var(--line); }
.tt { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 24px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 13px; position: relative; }
.tt .dot { position: absolute; left: 8px; }
.tt .dot.pub, .tree-legend .pub, .order-row .dot.pub, .rc .dot.pub { color: var(--ok); }
.tt .dot.draft, .tree-legend .draft, .order-row .dot.draft, .rc .dot.draft { color: var(--line-strong); }
.tt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt .warn { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 1px 7px; flex: none; }
.tt-add { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 24px; border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; border-radius: 8px; text-align: left; }
.tt-add:hover { background: var(--accent-soft); }
.tt-add svg.i { width: 14px; height: 14px; }
.tree-legend { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }

.ed { container-type: inline-size; min-width: 0; }
.ed-in { max-width: 900px; margin: 0 auto; padding: 22px 28px 120px; }
.ed-head { display: grid; gap: 8px; margin-bottom: 14px; }
.ed-crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }

.ed-title { flex: 1; min-width: 240px; font-size: 22px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; margin-left: -9px; background: none; }
.ed-title:hover { border-color: var(--line); }

.status-pill.pub { background: var(--ok-soft); color: var(--ok); }
.status-pill.draft { background: var(--surface-2); color: var(--muted); }

.tabs { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 6; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 0 -4px 20px; padding: 0 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 10px 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tb { font-size: 11px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.tb.ok { background: var(--ok-soft); color: var(--ok); }
.tb.ok svg.i { width: 12px; height: 12px; stroke-width: 3; }
.tb.n { background: var(--surface-2); color: var(--muted); }
.tb.need { background: var(--warn-soft); color: var(--warn); }

.sect { display: grid; gap: 20px; }
.sect-intro { font-size: 13px; color: var(--muted); margin-top: -6px; }
.blk { padding: 20px; display: grid; gap: 16px; }
.blk-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.blk-h h3 { font-size: 15px; }
.blk-h p { font-size: 12.5px; color: var(--muted); flex-basis: 100%; }
.blk-h .right { margin-left: auto; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.fgrid .full { grid-column: 1 / -1; }
.fld { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fld > label, .fld > .lb { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fld em { font-style: normal; font-size: 10.5px; color: var(--danger); background: var(--danger-soft); border-radius: 4px; padding: 0 5px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.inp, .sel, .ta { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.inp:focus, .sel:focus, .ta:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { background: var(--surface-2); color: var(--muted); }
.inp.err, .ta.err { border-color: var(--danger); }
.ta { resize: vertical; min-height: 84px; }
.inp.mono { font-family: var(--font-mono); font-size: 13.5px; }
.with-unit { display: flex; align-items: center; gap: 8px; }

.with-unit span { font-size: 13px; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 14px; font-size: 13px; }
.toggles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.tags:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12.5px; font-weight: 700; }
.tag button { border: 0; background: none; color: inherit; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.tag button:hover { background: var(--surface); }
.tag svg.i { width: 12px; height: 12px; }
.tags input { flex: 1; min-width: 140px; border: 0; outline: 0; background: none; font-size: 13.5px; padding: 3px 4px; }

.rows { display: grid; gap: 8px; }
.row { display: grid; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.row:hover { border-color: var(--line-strong); }
.row .inp, .row .sel { padding: 7px 10px; font-size: 13.5px; }
.row-no { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; }
.row-dev { grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 90px; }
.row-pre { grid-template-columns: 26px minmax(0, 1fr) 90px; }
.row-bring { grid-template-columns: minmax(0, 1fr) 84px auto 90px; }
.row-man { grid-template-columns: 96px minmax(0, 1.6fr) minmax(0, .8fr) 150px 90px; }
.cols-h { display: grid; gap: 8px; padding: 0 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.req-tg { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.req-tg.on { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.add-row { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line-strong); background: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
.add-row:hover { border-color: var(--accent); background: var(--accent-soft); }
.add-row svg.i { width: 15px; height: 15px; }

.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 22px; display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop b { color: var(--fg); font-size: 14px; }
.drop svg.i { width: 28px; height: 28px; color: var(--accent); }
.row-file { grid-template-columns: 34px minmax(0, 1.3fr) minmax(0, 1fr) 90px; }
.row-file .fn { font-family: var(--font-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.row-file .fm { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

.step-ed { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.step-ed.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step-ed-h { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; }

.step-ed-b { padding: 0 14px 14px 52px; display: grid; gap: 10px; }
.step-flags { display: flex; gap: 6px; align-items: center; margin-right: 4px; }

.radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rc { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 4px; }
.rc b { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.rc span { font-size: 12.5px; color: var(--muted); }
.rc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rc[aria-pressed="true"].pub { border-color: var(--ok); background: var(--ok-soft); }

.icon-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.icon-pick button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-pick button svg.i { width: 24px; height: 24px; }

function makeDemoRecords() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tasks = DEFAULT_DATA.tasks.filter(t => t.status === "published" && t.steps.length);
  const places = ["渋谷店（新規）", "新宿西口店", "横浜みなとみらい店", "大宮駅前店", "名古屋栄店", "梅田店", "福岡天神店", "ホテルグランド東京"];
  const workers = ["田中 美咲", "鈴木 一郎", "高橋 健", "伊藤 大輔"];
  const reasons = ["お客様の都合で、当日は未実施。後日対応", "部材が届いておらず、持参できなかった", "回線工事が未完了のため、通信確認は後日"];
  const hard = ["作業票に作業ID", "展開したフォルダ", "ハッシュ値", "引き渡し", "レシートロール紙"];
  const p2 = n => String(n).padStart(2, "0");
  const out = [];
  for (let n = 0; n < 26; n++) {
    const t = tasks[Math.floor(rnd() * tasks.length)];
    const d = new Date(); d.setDate(d.getDate() - Math.floor(rnd() * 110)); d.setHours(9 + Math.floor(rnd() * 10), Math.floor(rnd() * 60), 0, 0);
    const items = sheetOf(t).flatMap(sec => sec.items.map(it => ({ section: sec.key, key: it.id, label: it.label, checked: rnd() >= (hard.some(h => it.label.includes(h)) ? 0.25 : 0.03) })));
    const done = items.filter(i => i.checked).length;
    out.push({ id: "demo-" + p2(n + 1), taskId: t.id, title: t.title, version: t.version, place: places[Math.floor(rnd() * places.length)], by: workers[Math.floor(rnd() * workers.length)],
      at: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`, notes: "", total: items.length, done,
      skipped: items.filter(i => !i.checked).map(i => i.label), reason: done < items.length ? reasons[Math.floor(rnd() * reasons.length)] : "", items, sync: "local" });
  }
  return out.sort((a, b) => b.at.localeCompare(a.at));
}

function searchHit(t, q) {
  if (!q) return { hit: true };
  const ql = q.toLowerCase(), has = s => String(s || "").toLowerCase().includes(ql);
  if (has(t.title) || has(t.id)) return { hit: true };
  const d = t.devices.find(d => has(d.model) || has(d.name) || has(d.type));
  if (d) return { hit: true, why: has(d.model) ? `型番「${d.model}」に一致` : `機器「${d.name}」に一致` };
  const fl = t.files.find(x => has(x.name));
  if (fl) return { hit: true, why: `ファイル「${fl.name}」に一致` };
  const tg = t.tags.find(has);
  if (tg) return { hit: true, why: `キーワード「${tg}」に一致` };
  if (has(t.summary)) return { hit: true, why: "作業内容に一致" };
  if (t.bring.some(b => has(b.name))) return { hit: true, why: "持参品に一致" };
  return { hit: false };
}

/** 通信が戻ったら最新のデータを読み直す。他の人の変更（承認待ちなど）にも気づける */
async function refreshData(force = false) {
  if (!isSrv() || !AUTH.user || S.a.dirty || (S.layer && S.layer.type !== "modal")) return;
  try {
    const was = AUTH.offline;
    const res = await api("bootstrap", {}, { timeout: 15000 });
    const changed = was || JSON.stringify(res.data) !== JSON.stringify(DATA);
    applyBootstrap(res);
    if (!changed && !force) return;
    if (S.mode === "admin") { if (S.a.sel && !selValid(S.a.sel)) { S.a.sel = null; S.a.draft = null; } if ($("#tree")) $("#tree").innerHTML = treeHtml(); }
    else if (S.w.view === "home" && document.activeElement?.id !== "wq") render();
    if (was) toast("オンラインに戻りました。最新のデータを読み込みました");
  } catch (e) { /* 通信できない間は、今のデータのまま */ }
}

/* ---- サーバー連携（作業記録） ---- */
const SRV = { ok: null };
async function api(route, params = {}, opt = {}) {
  const u = new URLSearchParams({ r: route });
  Object.entries(params).forEach(([k, v]) => { if (v !== "" && v != null) u.set(k, v); });
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), opt.timeout || 8000);
  try {
    const res = await fetch("api/?" + u, {
      method: opt.method || "GET", signal: ctl.signal, credentials: "same-origin",
      headers: { Accept: "application/json", "X-Requested-With": "WorkBase", ...(opt.body ? { "Content-Type": "application/json" } : {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.ok === false) {
      const e = new Error(j.error || "HTTP " + res.status); e.status = res.status || 500;
      if (e.status === 401 && AUTH.mode === "server" && AUTH.user && !opt.noExpire) onSessionExpired();
      throw e;
    }
    return j;
  } finally { clearTimeout(timer); }
}
const byAt = (a, b) => b.at.localeCompare(a.at);
const skipN = r => r.total - r.done;
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const dayLabel = d => { const [y, m, dd] = d.split("-").map(Number); return `${y}年${m}月${dd}日（${WD[new Date(y, m - 1, dd).getDay()]}）`; };
/* サーバーにつながっている間は、まだ送っていない記録だけを端末側から足して表示する */
const localRows = () => RECORDS.filter(r => SRV.ok ? (r.sync === "pending" || r.sync === "error") : true);
function recentRecords() { return [...localRows(), ...(SRV.ok ? (S.rc.recent || []) : [])].sort(byAt).slice(0, 4); }
function syncText(id) {
  const r = RECORDS.find(x => x.id === id);
  if (!r) return "この端末に保存";
  return { pending: "サーバーへの送信待ち。通信が戻ると自動で送信します", synced: "サーバーに送信済み", error: "サーバーに送信できませんでした", local: "この端末に保存" }[r.sync] || "この端末に保存";
}
function syncChipHtml() {
  const pend = RECORDS.filter(r => r.sync === "pending").length, err = RECORDS.filter(r => r.sync === "error").length;

}

function renderWork() {
  if (S.w.view === "records") return recordsHtml();

        <div class="sheet-meta">
          <div class="fld"><label for="sh-place">店舗・案件名</label><input class="inp" id="sh-place" data-meta="place" value="${esc(meta.place || "")}" placeholder="例：〇〇店（新規）" ${dis}></div>
          <div class="fld"><label for="sh-by">作業者</label><input class="inp" id="sh-by" data-meta="by" value="${esc(meta.by ?? me().name)}" ${dis}></div>
        </div>
        <div class="sheet-opts"><span>項目をタップしてチェックします</span><div class="toggles"><button type="button" data-act="shOnly" aria-pressed="${S.w.shOnly}">未完了だけ表示</button></div></div>

          : left.length ? `<b>未完了が ${left.length}件 あります</b><span class="muted" style="font-size:13px">抜けがないか確認してから完了してください。</span><div class="row-btns"><button class="btn primary" type="button" data-act="shMissing">${ic("search")}抜けを確認</button><button class="link" type="button" data-act="shFinish">未完了のまま記録する</button></div>`

/* ---- 作業記録（振り返り） ---- */
const SEC_TITLE = { bring: "出発前：持参品", prep: "作業前：事前確認", files: "ファイルの準備", steps: "作業手順", final: "完了確認" };
const DAYS = [[30, "過去30日"], [90, "過去90日"], [365, "過去1年"], [0, "すべて"]];

function localFiltered(onlyPending = false) {
  const f = S.rc.f, q = f.q.trim().toLowerCase();
  return localRows().filter(r => (!onlyPending || r.sync === "pending" || r.sync === "error")
    && (!q || (r.title + r.place + r.by + r.taskId + (r.notes || "")).toLowerCase().includes(q))
    && (!f.task || r.taskId === f.task)
    && (!f.status || (f.status === "ok" ? skipN(r) === 0 : skipN(r) > 0))
    && (!f.from || r.at.slice(0, 10) >= f.from) && (!f.to || r.at.slice(0, 10) <= f.to)).sort(byAt);
}
function localStats(days) {
  const cut = days ? Date.now() - days * 86400000 : 0;
  const rows = localRows().filter(r => !cut || new Date(r.at.replace(" ", "T")).getTime() >= cut);
  const byTask = {}, miss = {};
  let items = 0, missed = 0;
  rows.forEach(r => {
    const b = (byTask[r.taskId] ||= { taskId: r.taskId, title: r.title, count: 0, withSkips: 0 }); b.count++; if (skipN(r)) b.withSkips++;
    items += r.total; missed += skipN(r);
    (r.items || []).forEach(it => { const k = r.taskId + "|" + it.key + "|" + it.label; const m = (miss[k] ||= { taskId: r.taskId, title: r.title, label: it.label, missed: 0, of: 0 }); m.of++; if (!it.checked) m.missed++; });
  });
  return { days, totals: { records: rows.length, withSkips: rows.filter(r => skipN(r)).length, items, missed },
    byTask: Object.values(byTask).sort((a, b) => b.count - a.count).slice(0, 10),
    topMissed: Object.values(miss).filter(m => m.missed).sort((a, b) => b.missed - a.missed || b.of - a.of).slice(0, 8) };
}

async function loadRecords(reset = true) {
  const R = S.rc;
  if (R.busy) { R.again = true; return; }
  R.busy = true; R.loading = true; R.err = "";
  if (reset) { R.srv = []; R.srvLoaded = 0; }
  try {
    if (SRV.ok) {
      const f = R.f;
      const res = await api("records", { q: f.q.trim(), task: f.task, status: f.status, from: f.from, to: f.to, limit: 30, offset: R.srvLoaded });
      R.srv = R.srv.concat(res.records); R.srvLoaded = R.srv.length;
      const pend = localFiltered(true);
      R.list = [...pend, ...R.srv].sort(byAt); R.total = res.total + pend.length; R.hasMore = R.srvLoaded < res.total;
    } else { R.list = localFiltered(); R.total = R.list.length; R.hasMore = false; }
  } catch (e) {
    if (!e.status) setSrv(false);
    R.err = "サーバーから記録を取得できませんでした。この端末内の記録を表示しています。";
    R.list = localFiltered(); R.total = R.list.length; R.hasMore = false;
  } finally { R.busy = false; R.loading = false; }
  if (R.again) { R.again = false; return loadRecords(true); }
  paintRv();
}
async function loadStats() {
  const R = S.rc;
  try { R.stats = SRV.ok ? await api("stats", { days: R.f.days }) : localStats(R.f.days); }
  catch (e) { R.stats = localStats(R.f.days); }
  paintRv();
}
function paintRv() {
  if (isSrv() && !AUTH.user) return;
  if (S.mode !== "work" || S.w.view !== "records") return;
  const l = $("#rvList"); if (l) l.innerHTML = rvListHtml();
  const t = $("#rvStats"); if (t) t.innerHTML = rvStatsHtml();

}
async function loadRecent() {

}
async function loadDetail(id) {
  const R = S.rc; R.detail = null; R.detailErr = "";
  const local = RECORDS.find(r => r.id === id);
  if (local && (!SRV.ok || local.sync !== "synced")) { R.detail = local; paintDetail(); return; }
  if (SRV.ok) {
    try { const j = await api("records/" + encodeURIComponent(id)); if (S.w.recId === id) R.detail = j.record; }
    catch (e) { if (local) R.detail = local; else R.detailErr = e.status === 404 ? "記録が見つかりません" : "サーバーから記録を取得できませんでした"; }
  } else if (!local) R.detailErr = "サーバーに接続できないため、この記録は表示できません";
  if (S.w.recId === id) paintDetail();
}
function paintDetail() {
  if (isSrv() && !AUTH.user) return;

function rvListHtml() {

    <div class="row-btns"><button class="btn" type="button" data-act="recCopy" data-id="${esc(r.id)}">${ic("copy")}共有用にコピー</button>${task && task.status === "published" ? `<button class="btn primary" type="button" data-act="openTask" data-id="${esc(task.id)}">この作業を開く</button>` : ""}</div>
  </div>`;

/* ---- 送信（未送信の記録を、通信できるときにまとめて送る） ---- */
const recPayload = r => ({ id: r.id, taskId: r.taskId, title: r.title, version: r.version, place: r.place, by: r.by, at: r.at, notes: r.notes, reason: r.reason, items: r.items });
let flushing = false;
async function flushQueue() {
  if (flushing || !SRV.ok || (AUTH.mode === "server" && !AUTH.user)) return;
  flushing = true; let changed = false;
  try {
    for (const r of RECORDS.filter(x => x.sync === "pending" && x.items)) {
      try { await api("records", {}, { method: "POST", body: recPayload(r) }); r.sync = "synced"; delete r.err; changed = true; saveRecords(); }
      catch (e) {
        if (e.status === 401) break;   // ログインが切れている。記録は端末に残し、ログイン後に送る
        if (e.status && e.status >= 400 && e.status < 500) { r.sync = "error"; r.err = e.message; changed = true; saveRecords(); }
        else { if (!e.status) setSrv(false); break; }
      }
    }
  } finally { flushing = false; }
  if (changed) { updateSyncUi(); loadRecent(); }
}
function trimRecords() {
  const keep = RECORDS.filter(r => r.sync === "pending" || r.sync === "error");
  RECORDS = [...keep, ...RECORDS.filter(r => !(r.sync === "pending" || r.sync === "error")).slice(0, 100)].sort(byAt);
}
async function probe() {
  if (!/^https?:$/.test(location.protocol)) { setSrv(false); return false; }
  try { await api("health", {}, { timeout: 5000 }); setSrv(true); return true; } catch (e) { setSrv(false); return false; }
}
function setSrv(ok) { const was = SRV.ok; SRV.ok = ok; if (was !== ok) { updateSyncUi(); if (ok) loadRecent(); } }
function updateSyncUi() {
  document.querySelectorAll("[data-sync]").forEach(el => { el.innerHTML = syncChipHtml(); });
  refreshRecCard();
  if (S.mode === "work" && S.w.view === "sheet") refreshWork();
  if (S.mode === "work" && S.w.view === "records") { loadStats(); loadRecords(true); }
}
async function probeAndFlush() { if (await probe()) { await flushQueue(); await refreshData(); } }
function startSync() {
  probeAndFlush();
  setInterval(probeAndFlush, 90000);
  window.addEventListener("online", probeAndFlush);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) probeAndFlush(); });
}

/* ユーザー・権限 */
function userCell(u, i, self) {
  const isNew = isSrv() && !DATA.users.some(x => x.id === u.id);
  let extra;
  if (!isSrv()) extra = `<span class="ls">${u.last ? "最終ログイン " + u.last.replaceAll("-", "/") : "未ログイン（案内メール送信前）"}${self ? "・ログイン中" : ""}</span>`;
  else if (isNew) extra = `<span class="uidrow">${inp(`${i}.username`, u.username || "", "ログインID（英数字）", "mono")}<input class="inp" type="password" id="${fid(`${i}.password`)}" data-bind="${i}.password" value="${esc(u.password || "")}" placeholder="初期パスワード（8文字以上）" autocomplete="new-password"></span>`;
  else extra = `<span class="ls">ID <b class="mono">${esc(u.username)}</b>・${u.last ? "最終ログイン " + u.last.replaceAll("-", "/") : "未ログイン"}${self ? "・ログイン中" : ""}${u.mustChange ? "・初期パスワード" : ""}　<button class="link" type="button" style="font-size:11px" data-act="uPw" data-i="${i}">パスワード再設定</button></span>`;
  return `<span style="display:grid;gap:2px;min-width:0">${inp(`${i}.name`, u.name, "氏名")}${extra}</span>`;
}

    <p class="sect-intro">ユーザーの登録と権限の変更ができるのは管理者だけです。使わなくなったユーザーは削除せず「無効」にします（ログインできなくなり、変更履歴の記録は残ります）。</p>

function tabsHtml() {
  const s = sectionState(S.a.draft);
  return TABS.map(([k, n]) => {
    const v = s[k];
    const badge = v === "ok" ? `<span class="tb ok">${ic("check")}</span>`
      : v === "need" ? `<span class="tb need">未入力</span>`
      : v === "draft" ? `<span class="tb n">下書き</span>`
      : typeof v === "number" ? `<span class="tb n">${v}</span>` : "";
    return `<button class="tab ${S.a.tab === k ? "on" : ""}" type="button" data-act="tab" data-v="${k}" role="tab" aria-selected="${S.a.tab === k}">${n}${badge}</button>`;

function taskEditor() {
  const d = S.a.draft, c = catOf(d.cat);
  return `
    <div class="ed-head">
      <div class="ed-crumb"><button class="back ed-back" type="button" data-act="selHome">${ic("chev")}一覧</button><span>${esc(c.name)}</span><span>/</span><span class="mono">${esc(d.id)}</span></div>

function reviewBanner() {
  const d = S.a.draft, t = taskById(d.id);
  if (!t) return "";
  if (t.review) {
    const r = t.review, chg = r.snapshot ? changedTabs(t, r.snapshot) : [];
    const info = `${esc(userName(r.by))}さんが ${r.at.replaceAll("-", "/")} に申請${chg.length ? "（変更箇所：" + chg.join("、") + "）" : "（新規の公開申請）"}${r.note ? "　メモ：「" + esc(r.note) + "」" : ""}`;
    if (can.approve()) {
      if (S.a.reviewing) return `<div class="banner info">${ic("shield")}<div class="bn-body"><b>申請内容を表示中です</b>${info}。右のプレビューで現場での見え方を確認できます。</div><div class="bn-acts"><button class="btn sm primary" type="button" data-act="approve">承認して公開</button><button class="btn sm danger" type="button" data-act="rejectAsk">差し戻す</button><button class="btn sm" type="button" data-act="reviewOff">公開中の内容に戻る</button></div></div>`;
      return `<div class="banner warn">${ic("alert")}<div class="bn-body"><b>承認待ちの申請があります</b>${info}</div><div class="bn-acts"><button class="btn sm primary" type="button" data-act="reviewOn">申請内容を確認する</button></div></div>`;
    }
    return `<div class="banner warn">${ic("clock")}<div class="bn-body"><b>承認待ちです</b>${info}。承認されるまで、現場には反映されません。再度保存すると、申請内容が置き換わります。</div></div>`;
  }
  if (t.rejected) {
    const j = t.rejected;
    return `<div class="banner danger">${ic("alert")}<div class="bn-body"><b>差し戻されました</b>${esc(userName(j.by))}さん（${j.at.replaceAll("-", "/")}）：「${esc(j.reason)}」。内容を直して、もう一度申請してください。</div></div>`;
  }
  return "";
}

/* 入力部品 */
const fid = p => "f-" + p.replace(/\./g, "-");
const inp = (p, v, ph = "", cls = "") => `<input class="inp ${cls}" id="${fid(p)}" data-bind="${p}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const fld = (label, p, inner, opt = {}) => `<div class="fld ${opt.full ? "full" : ""}"><label for="${fid(p)}">${label}${opt.req ? "<em>必須</em>" : ""}</label>${inner}${opt.hint ? `<p class="hint">${opt.hint}</p>` : ""}</div>`;
const toolBtns = (list, i, len) => `
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="上へ移動">${ic("up")}</button>
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="1" ${i === len - 1 ? "disabled" : ""} aria-label="下へ移動">${ic("down")}</button>
  <button class="icon-btn del" type="button" data-act="rm" data-l="${list}" data-i="${i}" aria-label="削除">${ic("x")}</button>`;
const tools = (list, i, len) => `<span class="tools">${toolBtns(list, i, len)}</span>`;
const addBtn = (list, label) => `<button class="add-row" type="button" data-act="add" data-l="${list}">${ic("plus")}${label}</button>`;

/* =========================================================

function guard(fn) {
  if (!S.a.dirty) { fn(); return; }
  S.a.pending = fn;
  S.layer = { type: "modal", title: "保存していない変更があります", text: "このまま移動すると、編集中の内容は失われます。", buttons: [
    { label: "キャンセル", act: "mCancel" }, { label: "破棄して移動", act: "mDiscardGo", cls: "danger" }, { label: "保存して移動", act: "mSaveGo", cls: "primary" }
  ] };

}
function allowed(sel) {
  if (!sel) return true;
  if (sel.type === "files") return isSrv() && can.admin();
  if (sel.type === "users") return can.users();
  if (sel.type === "review") return can.approve();
  return can.admin();
}
function selValid(sel) {
  if (!sel || !allowed(sel)) return false;
  if (sel.type === "cat") return DATA.categories.some(c => c.id === sel.id);
  if (sel.type === "task") return !!taskById(sel.id);
  return true;
}
function select(sel) {
  if (sel && !selValid(sel)) sel = null;
  Object.assign(S.a, { sel, dirty: false, pvModal: false, reviewing: false, note: "", draft: null });
  if (sel?.type === "cat") S.a.draft = clone(DATA.categories.find(c => c.id === sel.id));
  else if (sel?.type === "task") { const t = taskById(sel.id); S.a.draft = clone(t); S.a.open[t.cat] = true; S.a.stepOpen = new Set(); }
  else if (sel?.type === "notices") S.a.draft = clone(DATA.notices);
  else if (sel?.type === "users") S.a.draft = clone(DATA.users);
  render(); window.scrollTo(0, 0);
  if (sel?.type === "files") loadFileList();
}
function reload() {
  S.a.draft = clone(taskById(S.a.sel.id)); S.a.reviewing = false; S.a.note = ""; S.a.dirty = false; render();
}
function nextId(cat) {
  const base = { pos: 1100, self: 2100, hotel: 3100, net: 4100, care: 5100 }[cat] || 9000;
  const nums = DATA.tasks.map(t => parseInt(t.id.slice(3))).filter(n => Math.floor(n / 100) === Math.floor(base / 100));
  let n = nums.length ? Math.max(...nums) + 1 : base + 1;
  while (DATA.tasks.some(t => t.id === "WK-" + n)) n++;
  return "WK-" + n;
}
function newTask(cat) {
  const id = nextId(cat);
  return { id, cat, order: tasksOf(cat).length + 1, status: "draft", title: "新しい作業", summary: "", minutes: 30, people: 1, industries: [], tags: [],
    version: "1.0", updated: today(), os: "", devices: [], precheck: [], bring: [], files: [], extractTo: "C:\\Setup\\" + id, steps: [], manuals: [], changelog: "", old: [] };
}
async function save() {

  if (t === "cat") return saveCat();

async function saveCat() {

}
async function saveTask() {
  const a = S.a, d = a.draft, orig = taskById(d.id), approver = can.approve();
  if (!d.title.trim()) { a.tab = "basic"; render(); toast("作業名を入力してください"); $("#f-title")?.focus(); return false; }
  const miss = missing(d);
  if (d.status === "published" && miss.length) {
    a.tab = TABS.find(([, n]) => n === miss[0])[0]; render();
    toast(`公開するには「${miss.join("・")}」の入力が必要です。準備中なら公開設定を「下書き」にして保存してください`);
    return false;
  }
  if (isSrv()) {
    try {
      const r = await srvOp("task.save", { task: d, note: a.note, reviewing: a.reviewing });
      if (r.unchanged) { a.dirty = false; renderSavebar(); toast(r.message); return true; }
      a.open[(taskById(d.id) || d).cat] = true; reload(); toast(r.message); return true;
    } catch (e) { failToast(e); return false; }
  }
  const chg = changedTabs(orig, d), chgTxt = chg.length ? `（変更箇所：${chg.join("、")}）` : "";
  const reviewing = a.reviewing, r0 = orig.review, note = a.note.trim();
  let msg = "保存しました";
  if (approver) {
    const nd = clone(d);
    if (orig.status === "published" && nd.status === "published" && orig.version !== nd.version) nd.old = [{ v: orig.version, date: orig.updated, reason: "新しい版の公開により置き換え" }, ...nd.old];
    if (orig.cat !== nd.cat) nd.order = tasksOf(nd.cat).length + 1;
    nd.updated = today();
    nd.review = reviewing ? null : (r0 || null);
    nd.rejected = reviewing ? null : (orig.rejected || null);
    DATA.tasks = DATA.tasks.map(x => x.id === nd.id ? nd : x);
    a.open[nd.cat] = true;
    if (reviewing) { log("publish", "task", nd.id, nd.title, `${userName(r0.by)}さんの申請を承認して公開${chgTxt}${orig.version !== nd.version ? "。版 " + orig.version + " → " + nd.version : ""}`); msg = "承認して公開しました。現場ビューに反映されています"; }
    else if (orig.status !== "published" && nd.status === "published") { log("publish", "task", nd.id, nd.title, `公開しました（版 ${nd.version}）`); msg = "公開しました。現場ビューに反映されています"; }
    else if (orig.status === "published" && nd.status !== "published") { log("update", "task", nd.id, nd.title, "公開を停止（下書きに変更）"); msg = "下書きに戻しました。現場には表示されません"; }
    else { log("update", "task", nd.id, nd.title, chg.length ? `内容を更新${chgTxt}` : "更新"); if (nd.status === "published") msg = "保存しました。現場ビューに反映されています"; }
  } else if (orig.status === "published") {
    if (!chg.length) { a.dirty = false; renderSavebar(); toast("変更がありません"); return true; }
    const snap = clone(d); delete snap.review; delete snap.rejected; snap.status = "published";
    orig.review = { by: S.me, at: nowStr(), note, snapshot: snap };
    orig.rejected = null;
    log("request", "task", d.id, d.title, `公開中の内容への変更を申請${chgTxt}${note ? "　メモ：" + note : ""}`);
    msg = "変更を承認待ちにしました。承認されるまで現場には反映されません";
  } else {
    const nd = clone(d); nd.status = "draft"; nd.updated = today(); nd.rejected = null;
    if (orig.cat !== nd.cat) nd.order = tasksOf(nd.cat).length + 1;
    nd.review = d.status === "published" ? { by: S.me, at: nowStr(), note, snapshot: null } : null;
    DATA.tasks = DATA.tasks.map(x => x.id === nd.id ? nd : x);
    a.open[nd.cat] = true;
    if (nd.review) { log("request", "task", nd.id, nd.title, `公開を申請${note ? "　メモ：" + note : ""}`); msg = "公開を申請しました。承認されると現場に表示されます"; }
    else { log("update", "task", nd.id, nd.title, chg.length ? `下書きを更新${chgTxt}` : "下書きを更新"); msg = "下書きとして保存しました"; }
  }
  saveData(); reload(); toast(msg);
  return true;
}
async function saveNotices() {
  const a = S.a, d = a.draft, old = DATA.notices, short = x => x.length > 30 ? x.slice(0, 30) + "…" : x;
  if (d.some(n => !n.text.trim())) { toast("内容が空のお知らせがあります。入力するか、削除してください"); return false; }
  if (isSrv()) {

  }
  if (!can.approve() && d.some(n => n.status === "published" && old.find(x => x.id === n.id)?.status !== "published")) { toast("お知らせを公開できるのは、公開承認の権限を持つ人だけです"); return false; }
  d.forEach(n => {

    else if (JSON.stringify(o) !== JSON.stringify(n)) log("update", "notice", "", short(n.text), "内容を更新");

async function saveUsers() {

async function uploadFiles(list) {
  const d = S.a.draft; if (!d || !list.length) return;

  if (!S.up.limits) await loadFilesInfo();

    S.up.items.push({ key: "u" + Math.random().toString(36).slice(2, 8), name: file.name, size: file.size, sent: 0, state: "wait", file, taskId: d.id, chunk: 0, uploadId: "", cancel: false, err: "" });
  }

let upRunning = false;
async function runUploads() {
  if (upRunning) return;
  upRunning = true;
  try { for (;;) { const it = S.up.items.find(x => x.state === "wait"); if (!it) break; await uploadOne(it); } } finally { upRunning = false; }
}
async function uploadOne(it) {
  it.state = "up"; it.err = ""; it.cancel = false; paintUp();
  const post = async (offset, blob) => {
    const res = await fetch("api/?" + new URLSearchParams({ r: "upload/chunk", id: it.uploadId, offset }), { method: "POST", body: blob, credentials: "same-origin", headers: { "X-Requested-With": "WorkBase", "Content-Type": "application/octet-stream" } });
    return { res, j: await res.json().catch(() => ({})) };
  };
  try {
    if (!it.uploadId) { const r = await api("upload/init", {}, { method: "POST", body: { name: it.name, size: it.size } }); it.uploadId = r.uploadId; it.chunk = r.chunkBytes; it.sent = 0; }
    else { const st = await api("upload/status", { id: it.uploadId }); it.sent = st.received; it.chunk = st.chunkBytes; }
    let tries = 0, conflicts = 0;
    while (it.sent < it.size) {
      if (it.cancel) throw new Error("cancel");
      let out;
      try { out = await post(it.sent, it.file.slice(it.sent, Math.min(it.size, it.sent + it.chunk))); }
      catch (e) {
        if (++tries > 5) throw new Error("通信が途切れました。電波の良い場所で「続きから再開」を押してください");
        await sleep(1000 * tries);
        try { it.sent = (await api("upload/status", { id: it.uploadId })).received; } catch (e2) { /* 次の周で再試行 */ }
        continue;
      }
      const { res, j } = out;
      if (res.ok) { it.sent = j.received; tries = 0; paintUp(); continue; }
      if (res.status === 413 && it.chunk > 262144) { it.chunk = Math.max(262144, Math.floor(it.chunk / 2)); continue; }   // サーバー側の上限が小さいときは、小さく分けて送り直す
      if (res.status === 409 && j.received != null && ++conflicts < 20) { it.sent = j.received; continue; }
      if (res.status === 401) { onSessionExpired(); throw new Error("ログインの有効期限が切れました"); }
      throw new Error(j.error || "HTTP " + res.status);
    }
    it.state = "fin"; paintUp();
    const fin = await api("upload/finish", {}, { method: "POST", body: { id: it.uploadId }, timeout: 900000 });
    it.state = "done"; it.file = null;
    const d = S.a.draft;
    if (d && d.id === it.taskId && S.a.sel?.type === "task") {
      d.files.push({ ...fin.file }); rerenderSection();
      toast(`${fin.file.name} をアップロードしました。「保存」すると作業に反映されます`);
    } else toast(`${fin.file.name} のアップロードは完了しましたが、元の作業の編集画面から離れたため、作業には追加されていません。もう一度追加してください`);
  } catch (e) {
    if (e.message === "cancel") { it.state = "cancel"; try { await api("upload/cancel", {}, { method: "POST", body: { id: it.uploadId } }); } catch (e2) { /* 24時間後に自動で片付く */ } it.uploadId = ""; }
    else { it.state = "err"; it.err = e.message; }
  }
  paintUp();
}

async function addFiles(list) {
  const d = S.a.draft; if (!d || !list.length) return;
  if (isSrv()) return uploadFiles(list);
  const added = [...list].map(file => {
    const row = { name: file.name, size: file.size, desc: "", sha: file.size > 300 * MB ? "アップロード時に計算" : "計算中…" };
    d.files.push(row);
    return { file, row };
  });
  rerenderSection();
  toast(`${added.length}件のファイルを追加しました`);
  for (const { file, row } of added) {
    if (row.sha !== "計算中…") continue;
    try {
      const buf = await file.arrayBuffer();
      const h = await crypto.subtle.digest("SHA-256", buf);
      row.sha = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch { row.sha = "アップロード時に計算"; }
    if (S.a.draft === d && S.a.tab === "files") rerenderSection();
  }
}

    S.layer = { type: "modal", title: left.length ? "未完了のまま記録しますか？" : "作業を完了して記録します", body, wide: true, reason: "", note: "", buttons: [{ label: "キャンセル", act: "mCancel" }, { label: "記録する", act: "finishDo", cls: "primary" }] };

  finishDo: async () => {
    const L = S.layer, t = taskById(S.w.taskId), secs = sheetOf(t), all = secs.flatMap(x => x.items), left = all.filter(it => !chk(t, it.id));
    if (left.length && !(L.reason || "").trim()) { toast("未完了のまま記録する理由を入力してください"); $("#mReason")?.focus(); return; }
    const P = (PROG[t.id] ||= {}), meta = P.meta || {};
    const r = { id: newId(), taskId: t.id, title: t.title, version: t.version, place: (meta.place || "").trim(), by: (meta.by ?? me().name).trim(), at: nowStr(), notes: (L.note || "").trim(),
      total: all.length, done: all.length - left.length, skipped: left.map(it => it.label), reason: (L.reason || "").trim(),
      items: secs.flatMap(x => x.items.map(it => ({ section: x.key, key: it.id, label: it.label, checked: chk(t, it.id) }))), sync: "pending" };
    RECORDS.unshift(r); trimRecords(); saveRecords();
    P.rec = { id: r.id, at: r.at }; saveProg();
    S.layer = null; render();
    if (!SRV.ok) await probe();
    if (SRV.ok) await flushQueue();
    const mine = RECORDS.find(x => x.id === r.id);
    toast(!mine ? "作業記録を保存しました" : mine.sync === "synced" ? "作業記録をサーバーに送信しました。お疲れさまでした" : mine.sync === "error" ? `作業記録を端末に保存しましたが、送信できませんでした：${mine.err}` : "作業記録を端末に保存しました。通信が戻ると自動で送信します");
    if (S.w.view === "sheet") refreshWork();
    refreshRecCard();
  },
  shAgain: () => { delete PROG[S.w.taskId]; saveProg(); render(); toast("チェックシートをリセットしました"); },
  recCopy: el => {
    const r = RECORDS.find(x => x.id === el.dataset.id) || S.rc.list.find(x => x.id === el.dataset.id) || (S.rc.recent || []).find(x => x.id === el.dataset.id) || (S.rc.detail && S.rc.detail.id === el.dataset.id ? S.rc.detail : null);
    if (!r) return;
    const miss = r.items ? r.items.filter(i => !i.checked).map(i => i.label) : (r.skipped || []);
    const txt = [`【作業記録】${r.title}（${r.taskId} 版${r.version}）`, `店舗・案件：${r.place || "—"}　作業者：${r.by || "—"}　完了：${r.at}`,
      `結果：${r.total}件中 ${r.done}件 完了${skipN(r) ? `／未完了 ${skipN(r)}件` : ""}`,
      ...(skipN(r) ? [...(miss.length ? ["未完了：", ...miss.map(x => "・" + x)] : []), "理由：" + (r.reason || "—")] : []), ...(r.notes ? ["備考：" + r.notes] : [])].join("\n");
    copyText(txt, "作業記録");
  },

  /* 承認 */
  selMenu: el => guard(() => select(el.dataset.v === "home" ? null : { type: el.dataset.v })),
  openReviewTask: el => guard(() => { select({ type: "task", id: el.dataset.id }); if (can.approve() && taskById(el.dataset.id)?.review) ACT.reviewOn(); }),
  reviewOn: () => {
    const t = taskById(S.a.sel.id), r = t.review, snap = r.snapshot ? clone(r.snapshot) : clone(t);
    snap.status = "published"; S.a.draft = snap; S.a.reviewing = true; S.a.dirty = false; render();
  },
  reviewOff: () => guard(() => { S.a.draft = clone(taskById(S.a.sel.id)); S.a.reviewing = false; S.a.dirty = false; render(); }),
  approve: () => save(),
  rejectAsk: () => {
    S.layer = { type: "modal", title: "申請を差し戻しますか？", text: "理由は、申請した人の画面に表示されます。", body: `<textarea class="ta" id="mText" rows="3" placeholder="例：注意点にアンカー固定の許可を追記してください"></textarea>`, value: "", buttons: [{ label: "キャンセル", act: "mCancel" }, { label: "差し戻す", act: "rejectDo", cls: "danger solid" }] };
    renderLayer();
  },
  rejectDo: async () => {
    const reason = (S.layer.value || "").trim();
    if (!reason) { toast("差し戻しの理由を入力してください"); $("#mText")?.focus(); return; }
    if (isSrv()) {
      const id = S.a.sel.id;
      try { await srvOp("task.reject", { id, reason }); S.layer = null; select({ type: "task", id }); toast("差し戻しました"); } catch (e) { failToast(e); S.layer = null; renderLayer(); }
      return;
    }
    const t = taskById(S.a.sel.id), by = t.review.by;
    t.review = null; t.rejected = { by: S.me, to: by, at: nowStr(), reason };
    log("reject", "task", t.id, t.title, `差し戻し：「${reason}」（申請者：${userName(by)}）`); saveData();
    S.layer = null; select({ type: "task", id: t.id }); toast("差し戻しました");
  },

  /* お知らせ・ユーザー・履歴 */
  nAdd: () => { S.a.draft.unshift({ id: "n" + Date.now().toString(36), date: today(), level: "accent", text: "", task: "", status: "draft", until: "" }); $("#edIn").innerHTML = noticesHtml(); touched(); $("#f-0-text")?.focus(); },
  nRm: el => { S.a.draft.splice(+el.dataset.i, 1); $("#edIn").innerHTML = noticesHtml(); touched(); },
  nStatus: el => { S.a.draft[+el.dataset.i].status = el.dataset.v; $("#edIn").innerHTML = noticesHtml(); touched(); },
  uAdd: () => {
    S.a.draft.push({ id: "u" + Date.now().toString(36), name: "", email: "", dept: "", role: "viewer", active: true, last: "" });
    $("#edIn").innerHTML = usersHtml(); touched();
    const n = document.querySelector(`[data-bind="${S.a.draft.length - 1}.name"]`); n?.focus(); n?.scrollIntoView({ block: "center" });
  },
  togActive: el => { const u = S.a.draft[+el.dataset.i]; u.active = !u.active; $("#edIn").innerHTML = usersHtml(); touched(); },
  histType: el => { S.a.hist.type = el.dataset.v; $("#edIn").innerHTML = historyHtml(); },

  /* モーダル */
  mCancel: () => { S.layer = null; S.a.pending = null; renderLayer(); },
  mDiscardGo: () => { const fn = S.a.pending; S.layer = null; S.a.pending = null; S.a.dirty = false; renderLayer(); fn && fn(); },
  mSaveGo: async () => { const fn = S.a.pending; S.layer = null; S.a.pending = null; renderLayer(); if (await save()) fn && fn(); },
  mDelTask: async () => {
    const id = S.a.draft.id;
    if (isSrv()) { try { const r = await srvOp("task.delete", { id }); delete PROG[id]; saveProg(); S.layer = null; select(null); toast(r.message); } catch (e) { failToast(e); S.layer = null; renderLayer(); } return; }
    log("delete", "task", id, S.a.draft.title, "作業を削除"); DATA.tasks = DATA.tasks.filter(t => t.id !== id); delete PROG[id]; saveData(); saveProg();
    S.layer = null; select(null); toast(`${id} を削除しました`);
  },
  mDelCat: async () => { const id = S.a.draft.id; if (isSrv()) { try { const r = await srvOp("cat.delete", { id }); S.layer = null; select(null); toast(r.message); } catch (e) { failToast(e); S.layer = null; renderLayer(); } return; } log("delete", "category", "", S.a.draft.name, "大項目を削除"); DATA.categories = DATA.categories.filter(c => c.id !== id); saveData(); S.layer = null; select(null); toast("大項目を削除しました"); },
  mReset: () => { DATA = clone(DEFAULT_DATA); PROG = {}; RECORDS = makeDemoRecords(); saveData(); saveProg(); saveRecords(); S.layer = null; select(null); toast("サンプルデータに戻しました"); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});

/* 検索欄（日本語入力の変換中は更新しない） */
let rvT;
function onSearch(el) {
  if (el.id === "wq") { S.w.q = el.value.trim(); refreshResults(); }
  else if (el.id === "rvQ") { S.rc.f.q = el.value; clearTimeout(rvT); rvT = setTimeout(() => loadRecords(true), 250); }
  else if (el.id === "treeQ") {
    S.a.treeQ = el.value; const pos = el.selectionStart;
    $("#tree").innerHTML = treeHtml();
    const n = $("#treeQ"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
  }
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "wq" || el.id === "treeQ" || el.id === "rvQ") { if (!e.isComposing) onSearch(el); return; }
  if (el.id === "histQ") { S.a.hist.q = el.value; if (!e.isComposing) $("#histList").innerHTML = histListHtml(); return; }
  if (el.id === "mText") { S.layer.value = el.value; return; }
  if (el.id === "mReason") { S.layer.reason = el.value; return; }
  if (el.id === "mNote") { S.layer.note = el.value; return; }
  if (el.id === "reviewNote") { S.a.note = el.value; touched(); return; }
  if (el.dataset.meta) { const p = (PROG[S.w.taskId] ||= {}); (p.meta ||= {})[el.dataset.meta] = el.value; saveProg(); return; }
  const b = el.dataset.bind;
  if (b && S.a.draft) {
    let v = el.value;
    if (el.dataset.type === "num") v = v === "" ? "" : Number(v);
    setPath(S.a.draft, b, v);
    touched();
  }
});
document.addEventListener("compositionend", e => { if (e.target.id === "wq" || e.target.id === "treeQ" || e.target.id === "rvQ") onSearch(e.target); });

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fileIn") { addFiles(el.files); el.value = ""; return; }
  if (el.id === "rvTask") { S.rc.f.task = el.value; loadRecords(true); return; }
  if (el.id === "rvFrom" || el.id === "rvTo") { S.rc.f[el.id === "rvFrom" ? "from" : "to"] = el.value; loadRecords(true); return; }
  if (el.id === "rvDays") { S.rc.f.days = +el.value; loadStats(); return; }
  const ck = el.dataset.wck;
  if (ck) {
    const inFocus = S.layer?.type === "focus";
    const id = inFocus ? S.layer.id : S.w.taskId, t = taskById(id);
    setChk(t, ck, el.checked);
    if (inFocus) {
      renderLayer();
      if (el.checked && S.layer.i < t.steps.length - 1) setTimeout(() => { if (S.layer?.type === "focus") { S.layer.i++; renderLayer(); } }, 350);
    }
    refreshWork();
    if (S.w.view === "sheet" && el.checked) {
      const sec = sheetOf(t).find(x => x.items.some(it => it.id === ck));
      if (sec && sec.items.every(it => chk(t, it.id))) setTimeout(() => { if (S.w.view === "sheet" && S.w.taskId === id) { S.w.shClosed[id + ":" + sec.key] = true; refreshWork(); } }, 700);
    }
    if (progOf(t).complete) toast("すべての項目が完了しました。作業票への記入を忘れずに");
    return;
  }
  if (el.dataset.hist) { S.a.hist[el.dataset.hist] = el.value; $("#edIn").innerHTML = historyHtml(); }
});

document.addEventListener("focusin", e => {
  const el = e.target;
  const i = el.dataset?.focusOpen;
  if (i !== undefined && !S.a.stepOpen.has(+i)) {
    S.a.stepOpen.add(+i);
    const id = el.id, pos = el.selectionStart;
    $("#secBody").innerHTML = sectionHtml();
    const n = document.getElementById(id); n?.focus(); try { n.setSelectionRange(pos, pos); } catch {}
  }
});

document.addEventListener("submit", e => { if (e.target.id === "loginForm") { e.preventDefault(); doLogin(); } });

document.addEventListener("keydown", e => {
  if (e.target.id === "tagIn" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const v = e.target.value.trim();
    if (v && !S.a.draft.tags.includes(v)) { S.a.draft.tags.push(v); rerenderSection(); $("#tagIn")?.focus(); }
    else e.target.value = "";
  }
  if (e.target.id === "wq" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault(); onSearch(e.target);
    document.querySelector(".results")?.scrollIntoView({ behavior: "smooth", block: "start" }); e.target.blur();
  }
  if (e.key === "Escape") {
    if (S.menuOpen) { S.menuOpen = false; renderLayer(); }
    else if (S.layer?.type === "modal") ACT.mCancel();
    else if (S.layer) ACT.closeLayer();
    else if (S.a.pvModal) ACT.pvClose();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && S.mode === "admin" && S.a.dirty) { e.preventDefault(); save(); }
});

["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.add("over");
}));
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files);
});
window.addEventListener("beforeunload", e => { if (S.a.dirty) { e.preventDefault(); e.returnValue = ""; } });

startSync();
$("#app").innerHTML = `<div class="boot">読み込み中…</div>`;

/* PWA: インストールとオフライン対応 */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__bip = e; if (S.menuOpen) renderLayer(); });
window.addEventListener("appinstalled", () => { window.__bip = null; toast("WorkBase Portal をインストールしました"); });
const syncOnline = () => { $("#offlineNote").hidden = navigator.onLine; };
window.addEventListener("online", syncOnline); window.addEventListener("offline", syncOnline); syncOnline();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

boot().then(afterBoot);
</script>
</body>
</html>
