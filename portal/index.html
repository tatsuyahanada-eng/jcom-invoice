/* =========================================================
   設定画面の操作
   ========================================================= */
function guard(fn) {
  if (!S.a.dirty) { fn(); return; }
  S.a.pending = fn;
  S.layer = { type: "modal", title: "保存していない変更があります", text: "このまま移動すると、編集中の内容は失われます。", buttons: [
    { label: "キャンセル", act: "mCancel" }, { label: "破棄して移動", act: "mDiscardGo", cls: "danger" }, { label: "保存して移動", act: "mSaveGo", cls: "primary" }
  ] };
  renderLayer();
}
function select(sel) {
  S.a.sel = sel; S.a.dirty = false; S.a.pvModal = false;
  if (!sel) S.a.draft = null;
  else if (sel.type === "cat") S.a.draft = clone(DATA.categories.find(c => c.id === sel.id));
  else { const t = taskById(sel.id); S.a.draft = clone(t); S.a.open[t.cat] = true; S.a.stepOpen = new Set(); }
  render(); window.scrollTo(0, 0);
}
function nextId(cat) {
  const base = { pos: 1100, self: 2100, hotel: 3100, net: 4100, care: 5100 }[cat] || 9000;
  const nums = DATA.tasks.map(t => parseInt(t.id.slice(3))).filter(n => Math.floor(n / 100) === Math.floor(base / 100));
  let n = nums.length ? Math.max(...nums) + 1 : base + 1;
  while (DATA.tasks.some(t => t.id === "WK-" + n)) n++;
  return "WK-" + n;
}
function newTask(cat) {
  const id = nextId(cat);
  return { id, cat, order: tasksOf(cat).length + 1, status: "draft", title: "新しい作業", summary: "", minutes: 30, people: 1, industries: [], tags: [],
    version: "1.0", updated: today(), os: "", devices: [], precheck: [], bring: [], files: [], extractTo: "C:\\Setup\\" + id, steps: [], manuals: [], changelog: "", old: [] };
}
function save() {
  const a = S.a, d = a.draft;
  if (a.sel.type === "task") {
    if (!d.title.trim()) { a.tab = "basic"; render(); toast("作業名を入力してください"); $("#f-title")?.focus(); return false; }
    const miss = missing(d);
    if (d.status === "published" && miss.length) {
      a.tab = TABS.find(([, n]) => n === miss[0])[0]; render();
      toast(`公開するには「${miss.join("・")}」の入力が必要です。準備中なら公開設定を「下書き」にして保存してください`);
      return false;
    }
    const orig = taskById(d.id);
    if (orig && orig.status === "published" && d.status === "published" && orig.version !== d.version) {
      d.old = [{ v: orig.version, date: orig.updated, reason: "新しい版の公開により置き換え" }, ...d.old];
    }
    if (orig && orig.cat !== d.cat) d.order = tasksOf(d.cat).length + 1;
    d.updated = today();
    DATA.tasks = DATA.tasks.map(t => t.id === d.id ? clone(d) : t);
    a.open[d.cat] = true;
  } else {
    if (!d.name.trim()) { toast("大項目の名前を入力してください"); return false; }
    DATA.categories = DATA.categories.map(c => c.id === d.id ? clone(d) : c);
  }
  saveData(); a.dirty = false;
  render();
  toast(a.sel.type === "task" && d.status === "published" ? "保存しました。現場ビューに反映されています" : "保存しました");
  return true;
}
function discard() { select(S.a.sel); toast("変更を破棄しました"); }

async function addFiles(list) {
  const d = S.a.draft; if (!d || !list.length) return;
  const added = [...list].map(file => {
    const row = { name: file.name, size: file.size, desc: "", sha: file.size > 300 * MB ? "アップロード時に計算" : "計算中…" };
    d.files.push(row);
    return { file, row };
  });
  rerenderSection();
  toast(`${added.length}件のファイルを追加しました`);
  for (const { file, row } of added) {
    if (row.sha !== "計算中…") continue;
    try {
      const buf = await file.arrayBuffer();
      const h = await crypto.subtle.digest("SHA-256", buf);
      row.sha = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch { row.sha = "アップロード時に計算"; }
    if (S.a.draft === d && S.a.tab === "files") rerenderSection();
  }
}

    .sort((a, b) => catOf(a.t.cat).order - catOf(b.t.cat).order || a.t.order - b.t.order);

const ACT = {
  /* 共通 */
  mode: el => {
    const v = el.dataset.v; if (v === S.mode) return;
    guard(() => {
      S.mode = v; S.a.dirty = false; S.layer = null;
      if (v === "admin" && S.a.sel && (S.a.sel.type === "cat" ? DATA.categories.some(c => c.id === S.a.sel.id) : taskById(S.a.sel.id))) select(S.a.sel);
      else { if (v === "admin") { S.a.sel = null; S.a.draft = null; } render(); }
      window.scrollTo(0, 0);
    });
  },
  goHome: () => guard(() => { S.mode = "work"; S.w.view = "home"; S.a.dirty = false; S.layer = null; render(); window.scrollTo(0, 0); }),
  copy: el => copyText(el.dataset.v, el.dataset.l || "内容"),
  closeLayer: () => { S.layer = null; render(); },

  /* 現場ビュー */
  setQ: el => { S.w.q = el.dataset.v; render(); },
  clearQ: () => { S.w.q = ""; const n = $("#wq"); if (n) n.value = ""; refreshResults(); n?.focus(); },
  wCat: el => { S.w.cat = S.w.cat === el.dataset.id ? null : el.dataset.id; refreshWork(); },
  wInd: el => { S.w.ind = S.w.ind === el.dataset.v ? null : el.dataset.v; refreshResults(); },
  wReset: () => { S.w.cat = null; S.w.ind = null; S.w.q = ""; refreshWork(); },
  openTask: el => {
    const id = el.dataset.id;
    S.mode = "work"; S.w.view = "task"; S.w.taskId = id;

    render(); window.scrollTo(0, 0);
  },
  jump: el => {
    const root = el.closest(".wk"); const sec = root?.querySelector(`[data-sec="${el.dataset.to}"]`);
    if (!sec) return;
    const scr = el.closest(".phone-scr");
    if (scr) scr.scrollTo({ top: sec.getBoundingClientRect().top - scr.getBoundingClientRect().top + scr.scrollTop - 50, behavior: "smooth" });
    else sec.scrollIntoView({ behavior: "smooth", block: "start" });
  },
  dl: el => {
    const t = taskById(S.w.taskId); if (!t) return;
    const p = PROG[t.id] ||= {}; (p.files ||= {})[el.dataset.v] = true; saveProg();
    toast(`サンプルのためダウンロードは行いません：${el.dataset.v}`); refreshWork();
  },
  dlAll: () => {
    const t = taskById(S.w.taskId); if (!t) return;
    const p = PROG[t.id] ||= {}; p.files ||= {}; t.files.forEach(x => p.files[x.name] = true); saveProg();
    toast(`サンプルのためダウンロードは行いません（${t.files.length}ファイル）`); refreshWork();
  },
  resetProg: () => { delete PROG[S.w.taskId]; saveProg(); refreshWork(); toast("進み具合をリセットしました"); },
  focusStart: el => {
    const t = taskById(el.dataset.id); if (!t || !t.steps.length) return;
    const done = (PROG[t.id] || {}).steps || {};
    let i = t.steps.findIndex((_, k) => !done[k]); if (i < 0) i = 0;
    S.layer = { type: "focus", id: t.id, i }; renderLayer();
  },
  focusGo: el => { const t = taskById(S.layer.id); S.layer.i = Math.max(0, Math.min(t.steps.length - 1, S.layer.i + +el.dataset.d)); renderLayer(); },
  manual: el => { S.layer = { type: "manual", id: S.w.taskId, i: +el.dataset.i, page: 1 }; renderLayer(); },
  page: el => { S.layer.page = Math.max(1, S.layer.page + +el.dataset.d); renderLayer(); },

  /* 設定：ツリー */
  tog: el => { S.a.open[el.dataset.id] = !S.a.open[el.dataset.id]; $("#tree").innerHTML = treeHtml(); },
  selHome: () => guard(() => select(null)),
  selCat: el => guard(() => { S.a.open[el.dataset.id] = true; select({ type: "cat", id: el.dataset.id }); }),
  selTask: el => guard(() => { if (S.a.sel?.type !== "task") S.a.tab = "basic"; select({ type: "task", id: el.dataset.id }); }),
  addCat: () => guard(() => {
    const id = "c" + Date.now().toString(36);
    DATA.categories.push({ id, order: Math.max(0, ...DATA.categories.map(c => c.order)) + 1, name: "新しい大項目", icon: "box", desc: "" });
    saveData(); S.a.open[id] = true; select({ type: "cat", id });
    setTimeout(() => { const n = $("#f-name"); n?.focus(); n?.select(); }, 0);
    toast("大項目を追加しました。名前とアイコンを設定してください");
  }),
  addTask: el => guard(() => {
    const t = newTask(el.dataset.id); DATA.tasks.push(t); saveData();
    S.a.tab = "basic"; select({ type: "task", id: t.id });
    setTimeout(() => { const n = $("#f-title"); n?.focus(); n?.select(); }, 0);
    toast(`小項目 ${t.id} を下書きで追加しました`);
  }),
  taskMv: el => {
    const t = taskById(el.dataset.id); const list = tasksOf(t.cat); const i = list.indexOf(t); const j = i + +el.dataset.d;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    list.forEach((x, k) => x.order = k + 1);
    saveData(); $("#tree").innerHTML = treeHtml(); $("#edIn").innerHTML = catEditor();
  },

  /* 設定：大項目 */
  setIcon: el => { S.a.draft.icon = el.dataset.v; $("#edIn").innerHTML = catEditor(); touched(); },
  delCat: () => {
    if (tasksOf(S.a.draft.id).length) { toast("小項目が残っているため削除できません。先に小項目を別の大項目へ移すか、削除してください"); return; }
    S.layer = { type: "modal", title: `「${S.a.draft.name}」を削除しますか？`, text: "この操作は元に戻せません。", buttons: [{ label: "キャンセル", act: "mCancel" }, { label: "削除する", act: "mDelCat", cls: "danger solid" }] };
    renderLayer();
  },

  /* 設定：小項目 */
  tab: el => { S.a.tab = el.dataset.v; $("#tabs").innerHTML = tabsHtml(); $("#secBody").innerHTML = sectionHtml(); },
  add: el => {
    const l = el.dataset.l; S.a.draft[l].push(ADD_DEFAULTS[l]());
    const last = S.a.draft[l].length - 1;
    if (l === "steps") S.a.stepOpen = new Set([last]);
    rerenderSection();
    const target = document.querySelector(`#secBody [data-bind="${l}.${last}"], #secBody [data-bind^="${l}.${last}."]`);
    target?.focus();
  },
  rm: el => {
    const l = el.dataset.l, i = +el.dataset.i; S.a.draft[l].splice(i, 1);
    if (l === "steps") S.a.stepOpen = new Set([...S.a.stepOpen].filter(k => k !== i).map(k => k > i ? k - 1 : k));
    rerenderSection();
  },
  mv: el => {
    const l = el.dataset.l, i = +el.dataset.i, j = i + +el.dataset.d, arr = S.a.draft[l];
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    if (l === "steps") { const o = S.a.stepOpen, hi = o.has(i), hj = o.has(j); o.delete(i); o.delete(j); if (hi) o.add(j); if (hj) o.add(i); }
    rerenderSection();
  },
  togReq: el => { const b = S.a.draft.bring[+el.dataset.i]; b.required = !b.required; rerenderSection(); },
  togInd: el => { const d = S.a.draft, v = el.dataset.v; d.industries = d.industries.includes(v) ? d.industries.filter(x => x !== v) : [...d.industries, v]; rerenderSection(); },
  rmTag: el => { S.a.draft.tags.splice(+el.dataset.i, 1); rerenderSection(); $("#tagIn")?.focus(); },
  stepTog: el => { const i = +el.dataset.i, o = S.a.stepOpen; o.has(i) ? o.delete(i) : o.add(i); $("#secBody").innerHTML = sectionHtml(); },
  setStatus: el => {

  dupTask: () => guard(() => {

    Object.assign(t, { id, title: src.title + "（コピー）", status: "draft", order: tasksOf(src.cat).length + 1, updated: today(), old: [], extractTo: "C:\\Setup\\" + id });
    DATA.tasks.push(t); saveData(); select({ type: "task", id }); toast(`${src.id} を複製して ${id} を作成しました（下書き）`);
  }),
  delTask: () => {
    S.layer = { type: "modal", title: `「${S.a.draft.title}」を削除しますか？`, text: "現場ビューからも消え、元に戻せません。一時的に隠したい場合は、公開設定を「下書き」に戻してください。", buttons: [{ label: "キャンセル", act: "mCancel" }, { label: "削除する", act: "mDelTask", cls: "danger solid" }] };
    renderLayer();
  },
  pvOpen: () => { S.a.pvModal = true; renderLayer(); },
  pvClose: () => { S.a.pvModal = false; renderLayer(); },
  save: () => save(),
  discard: () => discard(),
  resetData: () => {
    S.layer = { type: "modal", title: "サンプルデータに戻しますか？", text: "このブラウザで行った追加・変更はすべて元に戻ります。", buttons: [{ label: "キャンセル", act: "mCancel" }, { label: "元に戻す", act: "mReset", cls: "danger solid" }] };

  /* モーダル */
  mCancel: () => { S.layer = null; S.a.pending = null; renderLayer(); },

  mSaveGo: () => { const fn = S.a.pending; S.layer = null; S.a.pending = null; renderLayer(); if (save()) fn && fn(); },
  mDelTask: () => {

};

document.addEventListener("click", e => {

/* 検索欄（日本語入力の変換中は更新しない） */
function onSearch(el) {

  else if (el.id === "treeQ") {
    S.a.treeQ = el.value; const pos = el.selectionStart;
    $("#tree").innerHTML = treeHtml();
    const n = $("#treeQ"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
  }
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "wq" || el.id === "treeQ") { if (!e.isComposing) onSearch(el); return; }
  const b = el.dataset.bind;
  if (b && S.a.draft) {
    let v = el.value;
    if (el.dataset.type === "num") v = v === "" ? "" : Number(v);
    setPath(S.a.draft, b, v);
    touched();
  }
});
document.addEventListener("compositionend", e => { if (e.target.id === "wq" || e.target.id === "treeQ") onSearch(e.target); });

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fileIn") { addFiles(el.files); el.value = ""; return; }
  const ck = el.dataset.wck;
  if (ck) {
    const inFocus = S.layer?.type === "focus";
    const id = inFocus ? S.layer.id : S.w.taskId;
    const [k, i] = ck.split(":");
    const p = PROG[id] ||= {}; (p[k] ||= {})[i] = el.checked; saveProg();
    if (inFocus) {
      renderLayer();
      const t = taskById(id);
      if (el.checked && S.layer.i < t.steps.length - 1) setTimeout(() => { if (S.layer?.type === "focus") { S.layer.i++; renderLayer(); } }, 350);
    }
    refreshWork();
    if (progOf(taskById(id)).complete) toast("すべての項目が完了しました。作業票への記入を忘れずに");
  }
});

document.addEventListener("focusin", e => {

  if (i !== undefined && !S.a.stepOpen.has(+i)) {
    S.a.stepOpen.add(+i);

    else e.target.value = "";
  }
  if (e.target.id === "wq" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault(); onSearch(e.target);
    document.querySelector(".results")?.scrollIntoView({ behavior: "smooth", block: "start" }); e.target.blur();
  }
  if (e.key === "Escape") {
    if (S.layer?.type === "modal") ACT.mCancel();
    else if (S.layer) ACT.closeLayer();
    else if (S.a.pvModal) ACT.pvClose();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && S.mode === "admin" && S.a.dirty) { e.preventDefault(); save(); }
});

["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.add("over");
}));
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files);
});
window.addEventListener("beforeunload", e => { if (S.a.dirty) { e.preventDefault(); e.returnValue = ""; } });

if (S.mode === "admin") select({ type: "task", id: "WK-1101" }); else render();
</script>
