<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkBase Portal</title>
<meta name="application-name" content="WorkBase Portal">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1f2e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WorkBase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lexend:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout:
   現場ビュー … グラデーションのヘッダー帯に大きな検索欄 → カテゴリ → 作業カード。作業詳細は「準備 / 機器 / ファイル / 手順 / マニュアル」を1ページに並べ、
                 コンテナクエリで PC は2カラム・スマホは1カラムに切り替わる（設定画面のスマホプレビューも同じ部品を使う）。
   設定画面   … 左：大項目→小項目のツリー ／ 中央：タブで1セクションずつ編集 ／ 右：スマホ表示のライブプレビュー。
   色はすべて下のトークンで管理。ブランドのグラデーションは参考画像（濃い青 → 水色）に合わせている。 */
:root {
  --brand-a: #0866b6;
  --brand-b: #1c9ddc;
  --brand-c: #27b3e8;
  --grad: linear-gradient(100deg, var(--brand-a) 0%, var(--brand-b) 62%, var(--brand-c) 100%);
  --on-brand: #ffffff;
  --on-brand-soft: rgba(255, 255, 255, .16);
  --on-brand-line: rgba(255, 255, 255, .32);
  --brand-ink: #0866b6;

  --bg: #f1f6fb;
  --surface: #ffffff;
  --surface-2: #e9f1f8;
  --line: #d8e4ee;
  --line-strong: #b4c7d7;
  --fg: #0d2537;
  --muted: #587084;
  --accent: #0a6fc2;
  --accent-soft: #e1effa;
  --ok: #17845a;
  --ok-soft: #dff3ea;
  --warn: #9c5d00;
  --warn-soft: #fcf0d9;
  --danger: #c2334a;
  --danger-soft: #fce6e9;
  --shadow: 0 1px 2px rgba(13, 37, 55, .06), 0 4px 14px rgba(13, 37, 55, .05);
  --shadow-lg: 0 10px 40px rgba(13, 37, 55, .18);
  --scrim: rgba(8, 24, 38, .5);
  --bezel: #0d2537;
  --logo-a: #0451b0;
  --logo-b: #05bbf6;
  --font-logo: "Lexend", "Noto Sans JP", system-ui, sans-serif;

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  --r-lg: 14px;
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
    --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
    --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
    --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000; --logo-a: #8cc4ff; --logo-b: #27c2fb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
  --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
  --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
  --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000; --logo-a: #8cc4ff; --logo-b: #27c2fb;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.4; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .88em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== App bar ===== */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--bar-h); background: var(--grad); color: var(--on-brand);
}
.appbar-in { max-width: 1440px; margin: 0 auto; height: 100%; padding: 0 20px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .02em; white-space: nowrap; background: none; border: 0; color: inherit; padding: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--on-brand); color: var(--brand-ink); display: grid; place-items: center; }
.brand-mark svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
.seg { display: flex; background: var(--on-brand-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--on-brand); padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button svg.i { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--on-brand); color: var(--brand-ink); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
.who-av { width: 32px; height: 32px; border-radius: 50%; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.offline-note { font-size: 12.5px; text-align: center; padding: 6px 16px; background: var(--fg); color: var(--bg); }
.sample-note { font-size: 12px; text-align: center; padding: 5px 16px; background: var(--warn-soft); color: var(--warn); }

/* ===== Common parts ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 700; white-space: nowrap; line-height: 1.4;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn.done { border-color: var(--ok); color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border-radius: 7px; border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--accent); }
.icon-btn.del:hover { color: var(--danger); background: var(--danger-soft); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.icon-btn svg.i { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; line-height: 1; padding: 5px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip svg.i { width: 12px; height: 12px; stroke-width: 2.4; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
.model { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.ico-tile { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ico-tile svg.i { width: 22px; height: 22px; }

/* ===== Worker: home ===== */
.hero { background: var(--grad); color: var(--on-brand); padding: 26px 20px 30px; position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); pointer-events: none;
}
.hero-in { max-width: 1060px; margin: 0 auto; display: grid; gap: 14px; position: relative; z-index: 1; }
.hero h1 { font-size: 26px; letter-spacing: .02em; }
.hero p { opacity: .92; font-size: 14px; }
.bigsearch { display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 0 8px 0 16px; box-shadow: var(--shadow-lg); max-width: 760px; }
.bigsearch svg.i { color: var(--accent); width: 22px; height: 22px; }
.bigsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; height: 56px; font-size: 16.5px; }
.bigsearch .icon-btn { width: 36px; height: 36px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; }
.suggest span { opacity: .85; }
.suggest button { border: 1px solid var(--on-brand-line); background: var(--on-brand-soft); color: var(--on-brand); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.suggest button:hover { background: var(--on-brand); color: var(--brand-ink); }

.home { max-width: 1100px; margin: 0 auto; padding: 22px 20px 72px; display: grid; gap: 18px; }
.notices { padding: 4px 18px; }
.nt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 0; font-size: 13.5px; line-height: 1.6; }
.nt + .nt { border-top: 1px solid var(--line); }
.nt-tx { flex: 1; min-width: 12em; }
.nt time { color: var(--muted); font-size: 12px; }
.vtog { display: inline-flex; margin-left: auto; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.vtog button { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.vtog button svg.i { width: 14px; height: 14px; }
.vtog button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
.reg { display: grid; overflow: hidden; }
.reg-h, .reg-r { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.2fr) minmax(0, 1.4fr) 54px 76px 76px 50px 108px; gap: 10px; align-items: center; padding: 10px 16px; }
.reg.fl .reg-h, .reg.fl .reg-r { grid-template-columns: minmax(0, 2.6fr) minmax(0, 1.2fr) minmax(0, 1.4fr) 76px 76px 50px 92px; }
.reg-h { font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.reg-r { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg); }
.reg-r:last-child { border-bottom: 0; }
.reg-r:hover { background: var(--surface-2); }
.reg-r:hover .reg-t b { color: var(--accent); }
.reg .c { text-align: center; }
.reg-t { display: grid; gap: 1px; min-width: 0; }
.reg-t b { font-size: 14px; line-height: 1.5; }
.reg-t small { font-size: 11.5px; color: var(--muted); }
.reg-c { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; min-width: 0; }
.reg-c svg.i { width: 15px; height: 15px; flex: none; }
.reg-m { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
.reg-s { display: grid; gap: 3px; justify-items: start; font-size: 12px; color: var(--muted); }
.reg-count { font-size: 12px; padding: 10px 16px 0; }
.reg-top { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.reg-f { display: flex; flex-wrap: wrap; gap: 8px; }
.reg-q { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; }
.reg-q svg.i { color: var(--accent); }
.reg-q input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; height: 40px; font-size: 14px; }
.reg-f .sel { width: auto; }
@media (max-width: 900px) {
  .reg-h { display: none; }
  .reg-r, .reg.fl .reg-r { grid-template-columns: minmax(0, 1fr) auto; grid-auto-flow: row; gap: 4px 10px; padding: 12px 14px; }
  .reg-r .reg-t { grid-column: 1 / -1; }
  .reg-r .reg-c, .reg-r .reg-m { grid-column: 1 / -1; }
  .reg-r .c { display: none; }
  .reg-r .reg-s { grid-column: 1 / -1; grid-auto-flow: column; justify-content: start; align-items: center; gap: 8px; }
}
.esec { display: grid; gap: 10px; scroll-margin-top: calc(var(--bar-h) + 60px); margin-bottom: 26px; }
.esec-h { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.esec-h small { font-size: 12px; color: var(--muted); font-weight: 400; }
.esec-h em { font-style: normal; font-size: 11.5px; color: var(--danger); font-weight: 700; }
.esec-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-size: 13px; flex: none; }
.esec .sect { gap: 10px; }
.ex-list { display: grid; }
.ex-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ex-list > .ex-row:first-child { border-top: 0; }
.ex-p { display: grid; gap: 2px; min-width: 0; flex: 1; }
.ex-p b { font-size: 14px; overflow-wrap: anywhere; }
.ex-p small { font-size: 12px; color: var(--muted); }
.ex-dir { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ex-row:not(.reg) .ex-p { display: block; }
.ex-row:not(.reg) .ex-p b { font-size: 14px; }
.ex-row:not(.reg) .ex-p small { display: block; }
.ex-d { font-size: 13px; }
.ex-t { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.ex-ops { display: flex; gap: 6px; flex: none; }
.ex-man { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; font-size: 13px; font-weight: 700; }
.ex-man-in { display: flex; gap: 8px; }
.ex-man-in .inp { flex: 1; min-width: 0; }
.ex-tasks { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: grid; gap: 4px; margin-top: 4px; }
.ex-g { display: grid; gap: 0; }
.ex-g > b { font-size: 12px; color: var(--muted); padding: 6px 4px 2px; }
@media (max-width: 640px) { .ex-row { flex-direction: column; align-items: stretch; } .ex-ops { justify-content: flex-end; } }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--accent); }
details.more[open] summary { margin-bottom: 10px; }
.pubck { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.pubck input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); flex: none; }
.pubck span { display: grid; gap: 2px; }
.pubck b { font-size: 15px; }
.pubck small { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.dash-add { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12.5px; }
.hero-help { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--on-brand-line); background: var(--on-brand-soft); color: var(--on-brand); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 700; }
.hero-help svg.i { width: 15px; height: 15px; }
.hero-help:hover { background: var(--on-brand); color: var(--brand-ink); }
@media (min-width: 1081px) { .hero-help { display: none; } }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.home-side { display: grid; gap: 16px; position: sticky; top: calc(var(--bar-h) + 16px); }
.sec-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
.sec-h h2 { font-size: 18px; }
.sec-h .muted { font-size: 12.5px; }
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cbox { display: flex; flex-direction: column; overflow: hidden; }
.cbox-h { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.cbox-h:hover { background: var(--surface-2); }
.cbox-h:hover b { color: var(--accent); }
.cbox-tx { display: grid; gap: 1px; flex: 1; min-width: 0; }
.cbox-tx b { font-size: 15.5px; }
.cbox-tx small { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbox-n { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 10px; }
.cbox-list { list-style: none; margin: 0; padding: 4px 0; }
.cbox-list button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 16px; font-size: 14px; line-height: 1.5; color: var(--fg); }
.cbox-list button:hover { background: var(--surface-2); color: var(--accent); }
.cbox-list button svg.i { width: 15px; height: 15px; color: var(--line-strong); flex: none; margin-left: auto; }
.cbox-list button:hover svg.i { color: var(--accent); }
.cbox-t { min-width: 0; }
.cbox-more { margin-top: auto; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 16px; text-align: left; color: var(--accent); font-weight: 700; font-size: 13px; }
.cbox-more:hover { background: var(--surface-2); }
.crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumb button { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; padding: 2px 0; color: var(--accent); font-weight: 700; font-size: 13px; }
.crumb button:hover { text-decoration: underline; }
.crumb svg.i { width: 14px; height: 14px; }
.crumb > svg.i { color: var(--line-strong); }
.crumb > span { color: var(--fg); font-weight: 700; }
.wk > .crumb { margin-bottom: -6px; }
.cswitch { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 14px; padding-bottom: 2px; }
.cswitch::-webkit-scrollbar { display: none; }
.cswitch button { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 700; color: var(--muted); }
.cswitch button svg.i { width: 15px; height: 15px; }
.cswitch button:hover { color: var(--accent); border-color: var(--accent); }
.cswitch button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.sib-box { padding: 4px 8px 8px; }
.sib-box h3 { font-size: 14px; padding: 12px 8px 6px; display: flex; align-items: center; gap: 8px; }
.sib-box ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.sib-box li button { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.5; color: var(--fg); }
.sib-box li button:hover { background: var(--surface-2); color: var(--accent); }
.sib-box li button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.list-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 12px; }
.list-head h2 { font-size: 18px; }
.list-head .count { color: var(--muted); font-size: 13px; }
.list-desc { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.results { display: grid; gap: 10px; scroll-margin-top: calc(var(--bar-h) + 12px); }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; text-align: left; width: 100%; }
.res:hover { border-color: var(--accent); }
.res-body { display: grid; gap: 4px; min-width: 0; }
.res-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.res-title { font-weight: 700; font-size: 15.5px; line-height: 1.5; }
.res-sum { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 2px; }
.res-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.res-meta svg.i { width: 14px; height: 14px; color: var(--accent); }
.res-meta b { color: var(--fg); }
.res-meta .zero { opacity: .55; }
.res-meta .zero svg.i { color: var(--muted); }
.res-why { font-size: 12px; color: var(--warn); font-weight: 700; }
.res-chev { color: var(--line-strong); }
.res:hover .res-chev { color: var(--accent); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }

.side { display: grid; gap: 16px; }
.side .card { padding: 4px 18px 10px; }
.side h3 { font-size: 14px; padding: 12px 0 8px; display: flex; align-items: center; gap: 8px; }
.notice { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; display: grid; gap: 4px; line-height: 1.6; }
.notice time { color: var(--muted); font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; text-align: left; }
.link:hover { text-decoration: underline; }
.recent-item { display: grid; gap: 1px; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; font-size: 13px; }
.recent-item:hover b { color: var(--accent); }
.recent-item small { color: var(--muted); font-size: 12px; }
.support strong { font-size: 18px; display: block; letter-spacing: .03em; }

/* ===== Worker: task detail (container query で PC / スマホ を切り替え) ===== */
.wk-c { container-type: inline-size; --stick-top: var(--bar-h); }
.wk { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 0; justify-self: start; }
.back svg.i { transform: rotate(180deg); width: 16px; height: 16px; }
.wk-head { background: var(--grad); color: var(--on-brand); border-radius: var(--r-lg); padding: 22px 24px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.wk-head::after { content: ""; position: absolute; right: -80px; bottom: -140px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); }
.wk-crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; position: relative; z-index: 1; }
.pill-w { display: inline-flex; align-items: center; gap: 6px; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); border-radius: 999px; padding: 2px 10px 2px 7px; font-weight: 700; }
.pill-w svg.i { width: 15px; height: 15px; }
.wk-head h1 { font-size: 22px; position: relative; z-index: 1; }
.wk-head p { font-size: 14px; opacity: .94; max-width: 70ch; position: relative; z-index: 1; }
.wk-facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 4px 0 0; position: relative; z-index: 1; }
.wk-facts div { display: grid; }
.wk-facts dt { font-size: 11px; opacity: .8; letter-spacing: .06em; }
.wk-facts dd { margin: 0; font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.wk-nav {
  position: sticky; top: var(--stick-top); z-index: 5;
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: -8px 0;
  background: var(--bg); scrollbar-width: none;
}
.wk-nav::-webkit-scrollbar { display: none; }
.wk-nav button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.wk-nav button:hover { color: var(--accent); border-color: var(--accent); }
.wk-nav button.go { color: var(--accent); border-color: var(--accent); }
.wk-nav button:disabled { opacity: .6; }
.wk-nav button svg.i { width: 15px; height: 15px; }
.wk-nav .n { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
.wk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
.wk-main { display: grid; gap: 18px; min-width: 0; }
.wsec { padding: 18px 20px 20px; display: grid; gap: 14px; scroll-margin-top: calc(var(--stick-top) + 56px); }
.wsec-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.wsec-h h2 { font-size: 16.5px; }
.wsec-h .sub { font-size: 12.5px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.sub-h { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.sub-h svg.i { width: 15px; height: 15px; }
.cks { display: grid; gap: 2px; }
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.6; }
.ck:hover { background: var(--surface-2); }
.ck input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
.ck.on > span:first-of-type { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.ck .qty { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
.ck .req { font-size: 10.5px; font-weight: 700; color: var(--danger); margin-left: 6px; }
.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.dev { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.dev-type { font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.dev-name { font-weight: 700; font-size: 14px; }
.dev-model { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); }
.dev-note { font-size: 12px; color: var(--muted); }
.os-line { font-size: 13px; color: var(--muted); }
.bundle { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); }
.bundle b { display: block; font-size: 14.5px; }
.bundle small { font-size: 12.5px; color: var(--muted); }
.files { border: 1px solid var(--line); border-radius: var(--r); }
.file { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; }
.file-ico { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.file-name { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.5; }
.file-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.hash { display: inline-flex; align-items: center; gap: 2px; }
.hash .icon-btn { width: 24px; height: 24px; }
.code-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; margin-top: -6px; }
.code pre { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; white-space: pre; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6; background: var(--warn-soft); color: var(--fg); }
.note svg.i { color: var(--warn); margin-top: 1px; }
.note.info { background: var(--accent-soft); }
.note.info svg.i { color: var(--accent); }
.note b { display: block; }
.wsteps { display: grid; gap: 10px; }
.wstep { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); }
.wstep.on { background: var(--ok-soft); border-color: transparent; }
.wnum { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--surface); cursor: pointer; position: relative; }
.wnum:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.wstep.on .wnum { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.wnum input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.wnum svg.i { stroke-width: 3; width: 16px; height: 16px; }
.wstep h3 { font-size: 15px; }
.wstep p { font-size: 14px; color: var(--fg); margin-top: 2px; white-space: pre-line; }
.wstep .note { margin-top: 8px; }
.mans { display: grid; gap: 8px; }
.man { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.man-ico { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.man-ico.pdf { background: var(--danger-soft); color: var(--danger); }
.man-ico.mov { background: var(--accent-soft); color: var(--accent); }
.man-ico.web { background: var(--ok-soft); color: var(--ok); }
.man b { font-size: 14px; display: block; line-height: 1.5; }
.man small { font-size: 12px; color: var(--muted); }
details.old { border: 1px dashed var(--line-strong); border-radius: var(--r); }
details.old summary { padding: 10px 14px; font-size: 13px; color: var(--muted); cursor: pointer; }
.old-body { padding: 0 14px 12px; display: grid; gap: 8px; font-size: 13px; }
.old-row { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); align-items: center; }

.wk-side { position: sticky; top: calc(var(--stick-top) + 54px); display: grid; gap: 14px; }
.prog { padding: 16px 18px; display: grid; gap: 12px; }
.prog-top { display: flex; align-items: baseline; justify-content: space-between; }
.prog-top b { font-size: 14px; }
.prog-top strong { font-size: 24px; font-variant-numeric: tabular-nums; color: var(--ok); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.prog-rows { display: grid; gap: 6px; font-size: 13px; }
.prog-rows div { display: flex; justify-content: space-between; gap: 8px; }
.prog-rows .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.prog-rows .v.ok { color: var(--ok); }
.prog-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@container (max-width: 760px) {
  .wk { padding: 14px 14px 64px; gap: 14px; }
  .wk-head { padding: 18px; border-radius: 12px; }
  .wk-head h1 { font-size: 19px; }
  .wk-head p { font-size: 13.5px; }
  .wk-facts { gap: 6px 18px; }
  .wk-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .wk-side { position: static; }
  .prog { padding: 12px 14px; gap: 8px; }
  .prog-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
  .prog-rows div { flex-direction: column-reverse; gap: 0; font-size: 11.5px; }
  .prog-rows .v { font-size: 14px; }
  .prog-actions { display: none; }
  .support-card { display: none; }
  .wsec { padding: 14px; border-radius: 12px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .devs { grid-template-columns: minmax(0, 1fr); }
  .file { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .file-ico { display: none; }
  .file .btn { width: 100%; }
  .bundle .btn { width: 100%; }
  .wstep { grid-template-columns: 32px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .wnum { width: 30px; height: 30px; font-size: 13px; }
}

/* ===== Overlays ===== */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.focus {
  position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto;
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
}
.focus-top { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.focus-top .t { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-bar { height: 4px; background: var(--surface-2); }
.focus-bar span { display: block; height: 100%; background: var(--grad); transition: width .25s; }
.focus-body { padding: 26px 26px 10px; display: grid; gap: 14px; }
.focus-no { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .06em; }
.focus-body h2 { font-size: 22px; }
.focus-body p { font-size: 16px; line-height: 1.85; white-space: pre-line; }
.focus-done { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; cursor: pointer; font-size: 15px; }
.focus-done input { width: 22px; height: 22px; accent-color: var(--ok); margin: 0; }
.focus-done.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.focus-foot { display: flex; gap: 10px; padding: 16px 26px 22px; }
.focus-foot .btn { flex: 1; padding: 12px; font-size: 15px; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(760px, 100%);
  background: var(--surface); box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.drawer.wide { width: min(860px, 100%); }
.ex-b { display: grid; place-items: start center; background: var(--surface-2); }
.ex-b img { max-width: 100%; height: auto; border-radius: 6px; box-shadow: var(--shadow); background: #fff; }
.ct-box { padding: 4px 16px 14px; display: grid; gap: 10px; }
.ct-box h3 { font-size: 14px; padding: 12px 0 0; display: flex; align-items: center; gap: 8px; }
.ct { display: grid; gap: 6px; padding: 10px 0 2px; border-top: 1px solid var(--line); }
.ct-box h3 + .ct { border-top: 0; padding-top: 2px; }
.n-prev .ct { border-top: 0; }
.ct-h { display: flex; align-items: center; gap: 10px; }
.ct-h b { font-size: 14px; }
.ct-h small { font-size: 12px; color: var(--muted); }
.ct-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--ok-soft, var(--accent-soft)); color: var(--ok, var(--accent)); display: grid; place-items: center; flex: none; }
.ct-ic svg.i { width: 16px; height: 16px; }
.ct-t { font-size: 13px; line-height: 1.6; color: var(--fg); margin: 0; }
.ct-scope { justify-self: start; font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 9px; }
.ct-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.ct-acts .btn { text-decoration: none; }
.ct-acts a.btn:not(.primary) { color: var(--accent); }
.ct-acts .as-text { cursor: default; }
.ct-foot { font-size: 12px; color: var(--muted); margin: 0; }
.docs { display: grid; gap: 12px; }
.doc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.doc.has-ex { grid-template-columns: minmax(0, 1fr) 168px; }
.doc-main { display: grid; gap: 10px; align-content: start; min-width: 0; }
.doc-h { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.doc-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.doc-pts { background: var(--surface-2); border-radius: 9px; padding: 10px 14px; }
.doc-pts .sub-h { margin-bottom: 4px; }
.doc-pts ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; font-size: 13.5px; line-height: 1.6; }
.doc-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.doc-thumb { display: grid; gap: 6px; justify-items: center; align-content: start; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px; color: var(--accent); font-size: 12px; font-weight: 700; }
.doc-thumb img { width: 100%; height: 190px; object-fit: cover; object-position: top; border-radius: 6px; background: #fff; }
.doc-thumb span { display: inline-flex; align-items: center; gap: 4px; }
.doc-thumb span svg.i { width: 14px; height: 14px; }
.doc-thumb:hover { border-color: var(--accent); }
.doc-thumb.ph { min-height: 120px; align-content: center; }
.doc-thumb .ph-ic { width: 52px; height: 64px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 13px; color: var(--danger); }
.doc-thumb:disabled { opacity: .7; }
.doc-blk { display: grid; gap: 12px; }
.row-doc { grid-template-columns: 28px minmax(0, 1fr) auto; }
.dslots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dslot { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; }
.dslot.has { border-style: solid; border-color: var(--line); }
.dslot-h { display: grid; gap: 1px; }
.dslot-h b { font-size: 13px; }
.dslot-h small { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.dslot-f { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dslot-f .fn { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dslot-f .fm { font-size: 11.5px; color: var(--muted); }
.dslot-f > span:nth-child(2) { flex: 1; }
.dslot-img { width: 44px; height: 56px; object-fit: cover; object-position: top; border-radius: 4px; border: 1px solid var(--line); flex: none; background: #fff; }
.dslot-add { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 9px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; }
.dslot-add:hover { filter: brightness(.97); }
@media (max-width: 640px) {
  .doc.has-ex { grid-template-columns: minmax(0, 1fr); }
  .doc-thumb img { height: 220px; }
  .dslots { grid-template-columns: minmax(0, 1fr); }
}
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; flex: 1; min-width: 0; }
.drawer-b { overflow-y: auto; padding: 24px; background: var(--surface-2); display: grid; place-items: start center; }
.page-mock { width: 100%; max-width: 560px; aspect-ratio: 1 / 1.414; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 8% 9%; display: grid; align-content: start; gap: 12px; }
.page-mock h3 { font-size: 17px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.page-mock .ln { height: 9px; border-radius: 4px; background: var(--surface-2); }
.page-mock .img { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.video-mock { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--grad); color: var(--on-brand); display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; }
.video-mock svg.i { width: 54px; height: 54px; }
.drawer-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; }

.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 22px; display: grid; gap: 12px; }
.modal h2 { font-size: 17px; }
.modal p { font-size: 14px; color: var(--muted); }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.scrim.top { z-index: 60; }

.toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); text-align: center; }

/* ===== Admin ===== */
.adm { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
.tree { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.tree-h { padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tree-h h2 { font-size: 15px; }
.tree-q { padding: 0 16px 10px; }
.tree-q input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.tree-home { margin: 0 10px 6px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; font-weight: 700; font-size: 13.5px; text-align: left; }
.tree-home:hover, .tc-main:hover, .tt:hover { background: var(--surface-2); }
.tree-home.on, .tc-main.on, .tt.on { background: var(--accent-soft); color: var(--accent); }
.tree-list { padding: 0 10px 24px; display: grid; gap: 2px; }
.tree-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; padding: 10px 20px 4px; }
.tc-row { display: flex; align-items: center; gap: 2px; }
.tc-tog { width: 26px; height: 32px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 6px; flex: none; }
.tc-tog svg.i { width: 14px; height: 14px; transition: transform .15s; }
.tc-tog.open svg.i { transform: rotate(90deg); }
.tc-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 0; background: none; border-radius: 8px; text-align: left; font-weight: 700; font-size: 13.5px; }
.tc-main .ic { width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.tc-main .ic svg.i { width: 15px; height: 15px; }
.tc-main .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-main .ct { font-size: 11.5px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.tt-list { display: grid; gap: 1px; padding: 2px 0 6px 28px; position: relative; }
.tt-list::before { content: ""; position: absolute; left: 39px; top: 2px; bottom: 10px; width: 1px; background: var(--line); }
.tt { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 24px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 13px; position: relative; }
.tt .dot { position: absolute; left: 8px; }
.tt .dot.pub, .tree-legend .pub, .order-row .dot.pub, .rc .dot.pub { color: var(--ok); }
.tt .dot.draft, .tree-legend .draft, .order-row .dot.draft, .rc .dot.draft { color: var(--line-strong); }
.tt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt .warn { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 1px 7px; flex: none; }
.tt-add { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 24px; border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; border-radius: 8px; text-align: left; }
.tt-add:hover { background: var(--accent-soft); }
.tt-add svg.i { width: 14px; height: 14px; }
.tree-legend { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.tree-legend span { display: inline-flex; align-items: center; gap: 5px; }

.ed { container-type: inline-size; min-width: 0; }
.ed-in { max-width: 900px; margin: 0 auto; padding: 22px 28px 120px; }
.ed-head { display: grid; gap: 8px; margin-bottom: 14px; }
.ed-crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.ed-crumb .mono { color: var(--fg); }
.ed-back { display: none; margin-right: 6px; }
.ed-title-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.ed-title { flex: 1; min-width: 240px; font-size: 22px; font-weight: 700; border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; margin-left: -9px; background: none; }
.ed-title:hover { border-color: var(--line); }
.ed-title:focus { outline: 0; border-color: var(--accent); background: var(--surface); }
.ed-title.err { border-color: var(--danger); }
.ed-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; }
.status-pill.pub { background: var(--ok-soft); color: var(--ok); }
.status-pill.draft { background: var(--surface-2); color: var(--muted); }

.tabs { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 6; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 0 -4px 20px; padding: 0 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 10px 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tb { font-size: 11px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.tb.ok { background: var(--ok-soft); color: var(--ok); }
.tb.ok svg.i { width: 12px; height: 12px; stroke-width: 3; }
.tb.n { background: var(--surface-2); color: var(--muted); }
.tb.need { background: var(--warn-soft); color: var(--warn); }

.sect { display: grid; gap: 20px; }
.sect-intro { font-size: 13px; color: var(--muted); margin-top: -6px; }
.blk { padding: 20px; display: grid; gap: 16px; }
.blk-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.blk-h h3 { font-size: 15px; }
.blk-h p { font-size: 12.5px; color: var(--muted); flex-basis: 100%; }
.blk-h .right { margin-left: auto; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.fgrid .full { grid-column: 1 / -1; }
.fld { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fld > label, .fld > .lb { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fld em { font-style: normal; font-size: 10.5px; color: var(--danger); background: var(--danger-soft); border-radius: 4px; padding: 0 5px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.inp, .sel, .ta { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.inp:focus, .sel:focus, .ta:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { background: var(--surface-2); color: var(--muted); }
.inp.err, .ta.err { border-color: var(--danger); }
.ta { resize: vertical; min-height: 84px; }
.inp.mono { font-family: var(--font-mono); font-size: 13.5px; }
.with-unit { display: flex; align-items: center; gap: 8px; }
.with-unit .inp { max-width: 120px; }
.with-unit span { font-size: 13px; color: var(--muted); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 14px; font-size: 13px; }
.toggles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.tags:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12.5px; font-weight: 700; }
.tag button { border: 0; background: none; color: inherit; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.tag button:hover { background: var(--surface); }
.tag svg.i { width: 12px; height: 12px; }
.tags input { flex: 1; min-width: 140px; border: 0; outline: 0; background: none; font-size: 13.5px; padding: 3px 4px; }

.rows { display: grid; gap: 8px; }
.row { display: grid; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.row:hover { border-color: var(--line-strong); }
.row .inp, .row .sel { padding: 7px 10px; font-size: 13.5px; }
.row-no { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; }
.row-dev { grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 90px; }
.row-pre { grid-template-columns: 26px minmax(0, 1fr) 90px; }
.row-bring { grid-template-columns: minmax(0, 1fr) 84px auto 90px; }
.row-man { grid-template-columns: 96px minmax(0, 1.6fr) minmax(0, .8fr) 150px 90px; }
.cols-h { display: grid; gap: 8px; padding: 0 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.req-tg { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.req-tg.on { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.add-row { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line-strong); background: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
.add-row:hover { border-color: var(--accent); background: var(--accent-soft); }
.add-row svg.i { width: 15px; height: 15px; }
.empty-row { font-size: 13px; color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); text-align: center; }

.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 22px; display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop b { color: var(--fg); font-size: 14px; }
.drop svg.i { width: 28px; height: 28px; color: var(--accent); }
.row-file { grid-template-columns: 34px minmax(0, 1.3fr) minmax(0, 1fr) 90px; }
.row-file .fn { font-family: var(--font-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.row-file .fm { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

.step-ed { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.step-ed.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step-ed-h { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; }
.step-ed-h .row-no { background: var(--accent-soft); color: var(--accent); }
.step-ed-h .inp { border-color: transparent; font-weight: 700; padding: 6px 8px; }
.step-ed-h .inp:hover { border-color: var(--line); }
.step-ed-h .inp:focus { border-color: var(--accent); }
.step-ed-b { padding: 0 14px 14px 52px; display: grid; gap: 10px; }
.step-flags { display: flex; gap: 6px; align-items: center; margin-right: 4px; }

.radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rc { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 4px; }
.rc b { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.rc span { font-size: 12.5px; color: var(--muted); }
.rc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rc[aria-pressed="true"].pub { border-color: var(--ok); background: var(--ok-soft); }

.icon-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.icon-pick button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-pick button svg.i { width: 24px; height: 24px; }
.icon-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.order-list { display: grid; gap: 6px; }
.order-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--r); font-size: 13.5px; }
.order-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; font-weight: 700; }
.order-row .nm:hover { color: var(--accent); text-decoration: underline; }

.dash { display: grid; gap: 22px; }
.dash-h { display: grid; gap: 6px; }
.dash-h.reg-top { display: flex; }
.reg-top .btn { flex: none; }
.dash-h h1 { font-size: 22px; }
.dash-h p { color: var(--muted); font-size: 14px; max-width: 64ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; display: grid; gap: 2px; }
.stat small { font-size: 12px; color: var(--muted); font-weight: 700; }
.stat b { font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat.warn b { color: var(--warn); }
.stat.ok b { color: var(--ok); }
.todo { display: grid; padding-bottom: 6px; }
.todo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.todo-row:hover { background: var(--surface-2); }
.todo-row b { font-size: 14px; }
.todo-row .miss { display: flex; gap: 5px; flex-wrap: wrap; }
.todo-row small { font-size: 12px; color: var(--muted); }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.flow-i { padding: 16px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); align-content: start; }
.flow-i b { color: var(--fg); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.flow-i .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-size: 12px; }

.pv { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); border-left: 1px solid var(--line); background: var(--surface); display: none; flex-direction: column; align-items: center; padding: 16px 0 0; gap: 12px; overflow: hidden; }
.pv-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; padding: 0 16px; width: 100%; }
.pv-h small { font-weight: 400; color: var(--muted); margin-left: auto; font-size: 11.5px; }
.phone { width: 360px; max-width: 100%; flex: 1; min-height: 0; max-height: 740px; border: 10px solid var(--bezel); border-bottom: 0; border-radius: 40px 40px 0 0; overflow: hidden; background: var(--bg); position: relative; }
.phone::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 90px; height: 22px; border-radius: 99px; background: var(--bezel); z-index: 9; }
.phone-scr { height: 100%; overflow-y: auto; padding-top: 30px; }
.phone-scr .wk-c { --stick-top: 0px; }
.pv-modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; gap: 10px; justify-items: center; width: min(360px, calc(100% - 32px)); }
.pv-modal .phone { border-bottom: 10px solid var(--bezel); border-radius: 40px; height: min(720px, calc(100vh - 140px)); flex: none; }
.pv-modal .btn { box-shadow: var(--shadow-lg); }

.savebar {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100% - 32px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--fg); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow-lg);
}
.savebar .msg { flex: 1; min-width: 160px; font-size: 13.5px; font-weight: 500; display: grid; line-height: 1.5; }
.savebar .msg small { opacity: .7; font-size: 11.5px; font-weight: 400; }
.savebar .btn.ghost { color: var(--bg); }
.savebar .btn.ghost:hover { background: var(--on-brand-soft); color: var(--bg); }
.savebar .btn.primary { background: var(--brand-c); border-color: var(--brand-c); color: var(--on-brand); }

@container (max-width: 680px) {
  .ed-in { padding: 16px 16px 120px; }
  .fgrid { grid-template-columns: minmax(0, 1fr); }
  .row-dev { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row-dev > .tools { grid-column: 1 / -1; justify-content: flex-end; }
  .row-man { grid-template-columns: 90px minmax(0, 1fr); }
  .row-man > .tools { grid-column: 1 / -1; justify-content: flex-end; }
  .row-bring { grid-template-columns: minmax(0, 1fr) 72px; }
  .row-bring > .req-tg { justify-self: start; }
  .row-bring > .tools { justify-content: flex-end; }
  .row-file { grid-template-columns: minmax(0, 1fr) 90px; }
  .row-file > .file-ico { display: none; }
  .row-file > .inp { grid-column: 1 / -1; grid-row: 2; }
  .cols-h { display: none !important; }
  .step-ed-h { grid-template-columns: 26px minmax(0, 1fr); }
  .step-ed-h > .tools { grid-column: 1 / -1; justify-content: flex-end; }
  .step-ed-b { padding: 0 12px 12px; }
  .radio-cards { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .blk { padding: 16px; }
  .ed-title { font-size: 19px; min-width: 0; flex-basis: 100%; }
}

@media (min-width: 1360px) {
  .adm.pv-on { grid-template-columns: 290px minmax(0, 1fr) 400px; }
  .adm.pv-on .pv { display: flex; }
  .adm.pv-on .pv-btn { display: none; }
}
@media (max-width: 1080px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  .home-side { position: static; }
}
@media (max-width: 900px) {
  .adm { grid-template-columns: minmax(0, 1fr); }
  .tree { position: static; height: auto; min-height: calc(100vh - var(--bar-h)); border-right: 0; }
  .adm.has-sel .tree { display: none; }
  .adm:not(.has-sel) .ed { display: none; }
  .ed-back { display: inline-flex; }
}
@media (max-width: 640px) {
  :root { --bar-h: 56px; }
  .appbar-in { padding: 0 14px; gap: 10px; }
  .brand-txt, .who-name { display: none; }
  .seg { margin-left: auto; }
  .seg button { padding: 6px 12px; }
  .who { margin-left: 0; }
  .hero { padding: 18px 16px 20px; }
  .hero h1 { font-size: 19px; }
  .bigsearch input { height: 50px; font-size: 16px; }
  .home { padding: 14px 16px 56px; gap: 14px; }
  .cgrid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .cbox-h { padding: 12px 14px; }
  .cbox-list button { padding: 11px 14px; }

function searchHit(t, q) {
  if (!q) return { hit: true };
  const ql = q.toLowerCase(), has = s => String(s || "").toLowerCase().includes(ql);
  if (has(t.title) || has(t.id)) return { hit: true };
  const d = t.devices.find(d => has(d.model) || has(d.name) || has(d.type));
  if (d) return { hit: true, why: has(d.model) ? `型番「${d.model}」に一致` : `機器「${d.name}」に一致` };
  const fl = allFiles(t).find(x => has(x.name) || has(x.desc));
  if (fl) return { hit: true, why: `ファイル「${fl.name}」に一致` };
  const tg = t.tags.find(has);
  if (tg) return { hit: true, why: `キーワード「${tg}」に一致` };
  if (has(t.summary)) return { hit: true, why: "作業内容に一致" };
  const dc = t.docs.find(x => has(x.title));
  if (dc) return { hit: true, why: `書類「${dc.title}」に一致` };
  if (t.bring.some(b => has(b.name))) return { hit: true, why: "持参品に一致" };
  const mn = t.manuals.find(m => has(m.title));
  if (mn) return { hit: true, why: `マニュアル「${mn.title}」に一致` };
  const st = t.steps.find(x => has(x.title) || has(x.body));
  if (st) return { hit: true, why: `作業手順「${st.title}」に一致` };
  if (t.precheck.some(has)) return { hit: true, why: "事前確認に一致" };
  return { hit: false };
}

async function doLogin() {
  const u = $("#lgUser").value.trim(), pw = $("#lgPass").value, err = $("#lgErr"), btn = $("#lgBtn");
  if (!u || !pw) { err.textContent = "ユーザー名とパスワードを入力してください"; err.hidden = false; return; }
  btn.disabled = true; err.hidden = true;
  try {
    await api("auth/login", {}, { method: "POST", body: { username: u, password: pw }, noExpire: true });
    applyBootstrap(await api("bootstrap", {}, { noExpire: true }));
    S.mode = "work"; S.w.view = "home"; S.a.sel = null; S.a.draft = null; S.a.dirty = false;
    render(); probeAndRefresh();
  } catch (e) {
    err.textContent = e.status ? e.message : "サーバーに接続できません。通信状況を確認してください"; err.hidden = false;
    btn.disabled = false; $("#lgPass").value = ""; $("#lgPass").focus();

}

/** 通信が戻ったら最新のデータを読み直す。他の人の変更（承認待ちなど）にも気づける */
async function refreshData(force = false) {
  if (!isSrv() || !AUTH.user || S.a.dirty || (S.layer && S.layer.type !== "modal")) return;
  try {
    const was = AUTH.offline;
    const res = await api("bootstrap", {}, { timeout: 15000 });
    const changed = was || JSON.stringify(res.data) !== JSON.stringify(DATA);
    applyBootstrap(res);
    if (!changed && !force) return;
    if (S.mode === "admin") { if (S.a.sel && !selValid(S.a.sel)) { S.a.sel = null; S.a.draft = null; } if ($("#tree")) $("#tree").innerHTML = treeHtml(); }
    else if (S.w.view === "home" && document.activeElement?.id !== "wq") render();
    if (was) toast("オンラインに戻りました。最新のデータを読み込みました");
  } catch (e) { /* 通信できない間は、今のデータのまま */ }
}

const SRV = { ok: null };
async function api(route, params = {}, opt = {}) {
  const u = new URLSearchParams({ r: route });
  Object.entries(params).forEach(([k, v]) => { if (v !== "" && v != null) u.set(k, v); });
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), opt.timeout || 8000);
  try {
    const res = await fetch("api/?" + u, {
      method: opt.method || "GET", signal: ctl.signal, credentials: "same-origin",
      headers: { Accept: "application/json", "X-Requested-With": "WorkBase", ...(opt.body ? { "Content-Type": "application/json" } : {}) },
      body: opt.body ? JSON.stringify(opt.body) : undefined
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.ok === false) {
      const e = new Error(j.error || "HTTP " + res.status); e.status = res.status || 500;
      if (e.status === 401 && AUTH.mode === "server" && AUTH.user && !opt.noExpire) onSessionExpired();
      throw e;
    }
    return j;
  } finally { clearTimeout(timer); }
}

/* ---- サーバーとの接続確認・データの読み直し ---- */
async function probe() {
  if (!/^https?:$/.test(location.protocol)) { SRV.ok = false; return false; }
  try { await api("health", {}, { timeout: 5000 }); SRV.ok = true; return true; } catch (e) { SRV.ok = false; return false; }
}
async function probeAndRefresh() { if (await probe()) await refreshData(); }
function startSync() {
  probeAndRefresh();
  setInterval(probeAndRefresh, 90000);
  window.addEventListener("online", probeAndRefresh);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) probeAndRefresh(); });
}

   作業記録：いつ・誰が・どこの店舗で・どんな作業をしたか、その結果、報告書の写真・PDF
   ========================================================= */
const LG_RESULT = { done: ["完了", "ok"], partial: ["一部未完了", "warn"], stopped: ["中止", "danger"] };
const LG_IMG = /\.(jpe?g|png|gif|webp)$/i, LG_PDF = /\.pdf$/i, LG_EXT = /\.(jpe?g|png|gif|webp|pdf)$/i;
const LG_MAX_FILES = 20;
const lgFileUrl = (f, inline = true) => "api/?r=files/" + encodeURIComponent(f.fid) + (inline ? "&inline=1" : "");
const lgReal = f => isSrv() && f.fid && !String(f.fid).startsWith("demo-");
const lgCan = l => !isSrv() || l.user.id === AUTH.user.id || (ROLES[AUTH.user.role]?.lv || 0) >= 1;
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const lgMD = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const lgWeekday = d => `${d.slice(0, 4)}（${WD[new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)).getDay()]}）`;

/* 検索語の強調（空白で区切った語を、それぞれ強調する） */
function lgHl(text) {
  const terms = S.lg.f.q.trim().split(/[\s　]+/).filter(Boolean).slice(0, 6);
  const t = String(text ?? "");
  if (!terms.length) return esc(t);
  const re = new RegExp("(" + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return t.split(re).map((seg, i) => i % 2 ? `<mark>${esc(seg)}</mark>` : esc(seg)).join("");
}

/* ---- サンプル（サーバーなしで開いたときだけ。この端末の中だけに保存） ---- */
function makeDemoLogs() {
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tasks = DEFAULT_DATA.tasks.filter(t => t.status === "published");
  const places = ["渋谷店（新規）", "新宿西口店", "横浜みなとみらい店", "大宮駅前店", "名古屋栄店", "梅田店", "福岡天神店", "ホテルグランド東京", "札幌すすきの店"];
  const users = DEFAULT_DATA.users.filter(u => u.active && u.role !== "viewer");
  const memos = ["問題なく完了。店長に報告書を渡した。", "回線工事が未完了のため、通信確認は後日。", "お客様の都合で、当日は未実施。", "プリンタの設定に時間がかかった。次回は予備を持参する。", ""];
  const out = [];
  for (let n = 0; n < 24; n++) {
    const t = tasks[Math.floor(rnd() * tasks.length)], u = users[Math.floor(rnd() * users.length)], d = new Date();
    d.setDate(d.getDate() - Math.floor(rnd() * 100));
    const at = `${ymd(d)} ${pad2(9 + Math.floor(rnd() * 9))}:${pad2(Math.floor(rnd() * 60))}`;
    out.push({ id: "rdemo" + String(n + 1).padStart(7, "0"), date: ymd(d), place: places[Math.floor(rnd() * places.length)], taskId: t.id, taskTitle: t.title,
      result: ["done", "done", "done", "partial", "stopped"][Math.floor(rnd() * 5)], notes: memos[Math.floor(rnd() * memos.length)],
      user: { id: u.id, name: u.name, username: u.id }, files: rnd() < 0.4 ? [{ fid: "demo-" + n, name: "作業報告書_" + ymd(d).replaceAll("-", "") + ".jpg", size: 412000 }] : [], createdAt: at, updatedAt: at });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
}
let DEMO_LOGS = store.get("portal5.logs", null) || makeDemoLogs();
const saveDemoLogs = () => store.set("portal5.logs", DEMO_LOGS);
function demoFilter(f) {
  const terms = f.q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean);
  return DEMO_LOGS.filter(l => terms.every(t => [l.place, l.user.name, l.user.username, l.taskTitle, l.taskId, l.notes].join("\n").toLowerCase().includes(t))
    && (!f.from || l.date >= f.from) && (!f.to || l.date <= f.to) && (!f.task || l.taskId === f.task) && (!f.user || l.user.id === f.user) && (!f.result || l.result === f.result))
    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
}
function demoMeta() {
  const users = new Map(); DEMO_LOGS.forEach(l => users.set(l.user.id, l.user.name));
  return { users: [...users].map(([id, name]) => ({ id, name })), places: [...new Set(DEMO_LOGS.map(l => l.place))] };
}

const lgParams = (offset, limit) => { const f = S.lg.f; return { q: f.q.trim(), from: f.from, to: f.to, task: f.task, user: f.user, result: f.result, limit, offset }; };
async function loadLogs(reset = true) {
  const L = S.lg, seq = L.seq = (L.seq || 0) + 1;
  if (isSrv() && AUTH.offline) { L.err = "オフラインのため、作業記録を表示できません。通信できる場所でもう一度開いてください。"; L.list = []; L.total = 0; paintLogs(); return; }
  L.loading = true; L.err = ""; paintLogs();
  try {
    const off = reset ? 0 : L.list.length;
    let r;
    if (isSrv()) r = await api("logs", lgParams(off, 30), { timeout: 15000 });
    else { const all = demoFilter(L.f); r = { total: all.length, logs: all.slice(off, off + 30), ...(off ? {} : demoMeta()) }; }
    if (seq !== L.seq) return;
    L.list = reset ? r.logs : [...L.list, ...r.logs]; L.total = r.total;
    if (r.users) L.users = r.users;
    if (r.places) L.places = r.places;
  } catch (e) { if (seq === L.seq) L.err = e.message || "読み込めませんでした"; }
  finally { if (seq === L.seq) { L.loading = false; paintLogs(); } }
}

  if (S.lg.places.length) return;
  try {

}

/* 写真は、長辺 1800px・JPEG に縮小してから送る（通信量とサーバーの容量を節約。PDF・GIF はそのまま） */
async function lgPrepImage(file) {
  if (!/\.(jpe?g|png|webp)$/i.test(file.name) || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size <= 1.5 * 1048576) { bmp.close && bmp.close(); return file; }
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    if (!blob || (sc === 1 && blob.size >= file.size)) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
  } catch { return file; }
}
async function lgUpload(file, onPct) {
  const init = await api("upload/init", {}, { method: "POST", body: { name: file.name, size: file.size, purpose: "record" } });
  let chunk = init.chunkBytes, sent = 0, tries = 0;
  while (sent < file.size) {
    let res, j;
    try {
      res = await fetch("api/?" + new URLSearchParams({ r: "upload/chunk", id: init.uploadId, offset: sent }), { method: "POST", body: file.slice(sent, Math.min(file.size, sent + chunk)), credentials: "same-origin", headers: { "X-Requested-With": "WorkBase", "Content-Type": "application/octet-stream" } });
      j = await res.json().catch(() => ({}));
    } catch (e) {
      if (++tries > 4) throw new Error("通信が途切れました。電波の良い場所で、もう一度お試しください");
      await sleep(1000 * tries);
      try { sent = (await api("upload/status", { id: init.uploadId })).received; } catch (e2) { /* 次の周で再試行 */ }
      continue;
    }
    if (res.ok) { sent = j.received; tries = 0; onPct(sent / file.size); continue; }
    if (res.status === 413 && chunk > 262144) { chunk = Math.max(262144, chunk >> 1); continue; }
    if (res.status === 409 && j.received != null) { sent = j.received; continue; }
    if (res.status === 401) { onSessionExpired(); throw new Error("ログインの有効期限が切れました"); }
    throw new Error(j.error || "HTTP " + res.status);
  }
  return (await api("upload/finish", {}, { method: "POST", body: { id: init.uploadId }, timeout: 120000 })).file;
}
async function lgAddFiles(list) {
  const F = S.lg.form; if (!F) return;
  for (const file of [...list]) {
    if (!LG_EXT.test(file.name)) { toast(`${file.name}：画像（JPG・PNG）か PDF を選んでください`); continue; }
    if (F.files.length >= LG_MAX_FILES) { toast(`添付できるのは ${LG_MAX_FILES} 件までです`); break; }
    F.touched = true;
    if (!isSrv()) { F.files.push({ key: newKey(), fid: "demo-" + newKey(), name: file.name, size: file.size, state: "done" }); continue; }
    if (AUTH.offline) { toast("オフラインのため、ファイルを添付できません"); break; }
    const it = { key: newKey(), name: file.name, size: file.size, state: "up", pct: 0 };
    F.files.push(it); paintLgFiles();
    try {
      const prepared = await lgPrepImage(file);
      it.name = prepared.name; it.size = prepared.size;
      const done = await lgUpload(prepared, p => { it.pct = p; paintLgFiles(); });
      Object.assign(it, { fid: done.fid, name: done.name, size: done.size, state: "done" });
    } catch (e) { it.state = "err"; it.err = e.message; }
    paintLgFiles();
  }
  paintLgFiles();
}

              return `<button class="tt ${ton ? "on" : ""}" type="button" data-act="selTask" data-id="${t.id}"><span class="dot ${t.review ? "rev" : t.status === "published" ? "pub" : "draft"}"></span><span class="nm">${esc(t.title)}</span>${t.review ? `<span class="warn">承認待ち</span>` : miss ? `<span class="warn" title="未入力の項目があります">未入力 ${miss}</span>` : ""}</button>`;
            }).join("")}
            <button class="tt-add" type="button" data-act="addTask" data-id="${c.id}">${ic("plus")}小項目を追加</button>
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
    <div class="tree-legend"><span><span class="dot pub"></span>公開中</span><span><span class="dot draft"></span>非公開</span></div>`;
}
