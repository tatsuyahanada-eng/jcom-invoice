/* 作業の入力：1ページにすべての項目を並べる（上の目次から各項目へ移動できる） */
const ED_SECS = [["basic", "作業名・内容"], ["dev", "対象機器"], ["steps", "作業手順"], ["files", "設定データ"], ["man", "マニュアル"], ["docs", "書類"], ["prep", "準備・持参品"], ["pub", "表示"]];
function edCount(d, k) {
  return { dev: d.devices.length, steps: d.steps.length, files: d.files.length, man: d.manuals.length, docs: d.docs.length, prep: d.precheck.length + d.bring.length }[k];
}
function tabsHtml() {
  const d = S.a.draft;
  return ED_SECS.map(([k, n]) => {
    const c = edCount(d, k);
    const badge = k === "basic" ? (d.title.trim() ? `<span class="tb ok">${ic("check")}</span>` : `<span class="tb need">必須</span>`)
      : k === "pub" ? `<span class="tb n">${d.status === "published" ? "公開" : "非公開"}</span>`
      : c ? `<span class="tb n">${c}</span>` : "";
    return `<button class="tab" type="button" data-act="edJump" data-v="${k}">${n}${badge}</button>`;
  }).join("");
}
function allSectionsHtml() {
  return ED_SECS.map(([k, n], i) => `<section class="esec" id="es-${k}"><h2 class="esec-h"><span class="esec-n">${i + 1}</span>${n}${k === "basic" ? `<em>作業名は必須</em>` : k === "pub" ? "" : `<small>任意</small>`}</h2>${sectionHtml(k)}</section>`).join("");
}

function taskEditor() {
  const d = S.a.draft, c = catOf(d.cat), isNew = !d.id;
  return `
    <div class="ed-head">
      <div class="ed-crumb"><button class="back ed-back" type="button" data-act="selHome">${ic("chev")}一覧</button><span>${esc(c.name)}</span><span>/</span><span class="mono">${isNew ? "新規" : esc(d.id)}</span></div>
      <div class="ed-title-row">
        <h1 class="ed-h">${isNew ? "作業の登録" : esc(d.title || "（作業名が未入力です）")}</h1>
        <div class="ed-acts">
          ${statusPill(d.id)}
          <button class="btn sm pv-btn" type="button" data-act="pvOpen">${ic("phone")}スマホで確認</button>
          ${isNew ? "" : `<button class="btn sm ghost" type="button" data-act="dupTask">${ic("dup")}複製</button>
          <button class="btn sm ghost danger" type="button" data-act="delTask" aria-label="この作業を削除">${ic("trash")}</button>`}
        </div>
      </div>
      ${isNew ? `<p class="sect-intro" style="margin:6px 0 0">上から順に入力して、最後に「登録」を押してください。作業名以外は空欄のままでも登録でき、あとから追加できます。</p>` : ""}
    </div>
    <nav class="tabs" id="tabs" aria-label="入力項目へ移動">${tabsHtml()}</nav>
    <div id="secBody">${allSectionsHtml()}</div>`;
}

/* 入力部品 */
const fid = p => "f-" + p.replace(/\./g, "-");
const inp = (p, v, ph = "", cls = "") => `<input class="inp ${cls}" id="${fid(p)}" data-bind="${p}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const fld = (label, p, inner, opt = {}) => `<div class="fld ${opt.full ? "full" : ""}"><label for="${fid(p)}">${label}${opt.req ? "<em>必須</em>" : ""}</label>${inner}${opt.hint ? `<p class="hint">${opt.hint}</p>` : ""}</div>`;
const toolBtns = (list, i, len) => `
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="上へ移動">${ic("up")}</button>
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="1" ${i === len - 1 ? "disabled" : ""} aria-label="下へ移動">${ic("down")}</button>
  <button class="icon-btn del" type="button" data-act="rm" data-l="${list}" data-i="${i}" aria-label="削除">${ic("x")}</button>`;
const tools = (list, i, len) => `<span class="tools">${toolBtns(list, i, len)}</span>`;
const addBtn = (list, label) => `<button class="add-row" type="button" data-act="add" data-l="${list}">${ic("plus")}${label}</button>`;

function sectionHtml(tab) {
  const d = S.a.draft;
  switch (tab) {
    case "basic": return `<div class="sect">
      <section class="card blk"><div class="fgrid">
        ${fld("作業名", "title", `<input class="inp ${d.title.trim() ? "" : "err"}" id="f-title" data-bind="title" value="${esc(d.title)}" placeholder="例：POSレジ本体 初期セットアップ">`, { full: true, req: true })}
        ${fld("大項目", "cat", `<select class="sel" id="f-cat" data-bind="cat">${catsSorted().map(c => `<option value="${c.id}" ${c.id === d.cat ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`)}
        <div class="fld"><label for="f-id">作業ID</label><input class="inp mono" id="f-id" value="${d.id ? esc(d.id) : "登録すると自動で付きます"}" disabled></div>
        ${fld("作業内容", "summary", `<textarea class="ta" id="f-summary" data-bind="summary" rows="3" placeholder="例：新規導入店舗で POS 端末にイメージを適用し、印字とドロア開閉までを確認します。">${esc(d.summary)}</textarea>`, { full: true, hint: "TOPページの一覧と、作業ページの先頭に表示されます。" })}
        <div class="fld full"><label for="tagIn">検索キーワード（任意）</label>
          <div class="tags">${d.tags.map((t, i) => `<span class="tag">${esc(t)}<button type="button" data-act="rmTag" data-i="${i}" aria-label="${esc(t)}を削除">${ic("x")}</button></span>`).join("")}<input id="tagIn" placeholder="入力して Enter で追加" enterkeyhint="enter"></div>
          <p class="hint">作業名・型番・ファイル名・マニュアル名・手順は、登録しなくても検索できます。それ以外の言葉で探されそうなときに追加します。</p></div>
      </div></section></div>`;

    case "dev": return `<div class="sect">
      <p class="sect-intro">型番は現場の検索に使われます。機器ラベルに書かれているとおりに入力してください。</p>
      <section class="card blk">
        <div class="blk-h"><h3>対象機器</h3><span class="chip right">${d.devices.length}台</span></div>
        ${d.devices.length ? `<div class="cols-h row-dev"><span>機器種別</span><span>機器名</span><span>型番</span><span>備考</span><span></span></div>` : ""}
        <div class="rows">${d.devices.map((x, i) => `<div class="row row-dev">
          ${inp(`devices.${i}.type`, x.type, "例：POS端末")}
          ${inp(`devices.${i}.name`, x.name, "例：POSターミナル 15型")}
          ${inp(`devices.${i}.model`, x.model, "型番", "mono")}
          ${inp(`devices.${i}.note`, x.note, "備考（任意）")}
          ${tools("devices", i, d.devices.length)}
        </div>`).join("") || `<div class="empty-row">対象機器がまだありません</div>`}</div>
        ${addBtn("devices", "機器を追加")}
      </section>
      </div>`;

    case "prep": return `<div class="sect">
      <p class="sect-intro">現場ではチェックリストとして表示されます。1行に1項目ずつ、短く書いてください。</p>
      <section class="card blk">
        <div class="blk-h"><h3>事前確認</h3><span class="chip right">${d.precheck.length}件</span><p>作業を始める前に満たしておく条件（工事の完了、データの準備など）。</p></div>
        <div class="rows">${d.precheck.map((x, i) => `<div class="row row-pre"><span class="row-no">${i + 1}</span>${inp(`precheck.${i}`, x, "例：店舗の LAN 配線と電源工事が完了している")}${tools("precheck", i, d.precheck.length)}</div>`).join("") || `<div class="empty-row">事前確認はまだありません</div>`}</div>
        ${addBtn("precheck", "事前確認を追加")}
      </section>
      <section class="card blk">
        <div class="blk-h"><h3>現地持参品</h3><span class="chip right">${d.bring.length}件</span><p>出発前に確認する持ち物。「必須」にした品は現場で赤く表示されます。</p></div>
        <div class="rows">${d.bring.map((x, i) => `<div class="row row-bring">
          ${inp(`bring.${i}.name`, x.name, "品名（例：LANケーブル 3m）")}
          ${inp(`bring.${i}.qty`, x.qty, "数量")}
          <button class="req-tg ${x.required ? "on" : ""}" type="button" data-act="togReq" data-i="${i}" aria-pressed="${!!x.required}">${x.required ? "必須" : "任意"}</button>
          ${tools("bring", i, d.bring.length)}
        </div>`).join("") || `<div class="empty-row">持参品はまだありません</div>`}</div>
        ${addBtn("bring", "持参品を追加")}
      </section></div>`;

    case "files": if (isSrv()) return filesTabServer(d);
      return `<div class="sect">
      <p class="sect-intro">現場でダウンロードするファイルです。追加すると、破損確認用のハッシュ値（SHA-256）が自動で計算されます。</p>
      <section class="card blk">
        <label class="drop" for="fileIn" id="drop">${ic("upload")}<b>ここにファイルをドラッグ＆ドロップ</b><span>またはクリックしてファイルを選択（zip・exe・msi・bin など）</span></label>
        <div class="rows">${d.files.map((x, i) => `<div class="row row-file">
          <span class="file-ico">${ic(/\.zip$/i.test(x.name) ? "zip" : "file")}</span>
          <span style="display:grid;gap:2px;min-width:0"><span class="fn">${esc(x.name)}</span><span class="fm"><span class="num">${fmtBytes(x.size)}</span><span>SHA-256 <span class="mono">${esc(String(x.sha).slice(0, 12))}${String(x.sha).length > 12 ? "…" : ""}</span></span></span></span>
          ${inp(`files.${i}.desc`, x.desc, "説明（例：POS アプリ本体）")}
          ${tools("files", i, d.files.length)}
        </div>`).join("") || `<div class="empty-row">ファイルはまだありません。ファイルを使わない作業はこのままで構いません。</div>`}</div>
      </section>
      <section class="card blk"><div class="fgrid">
        ${fld("展開先フォルダ", "extractTo", inp("extractTo", d.extractTo, "C:\\Setup\\WK-xxxx", "mono"), { full: true, hint: "現場には、このフォルダへ展開する PowerShell コマンドが自動で表示されます。" })}
      </div></section></div>`;

    case "steps": return `<div class="sect">
      <p class="sect-intro">現場では番号付きの手順として表示され、スマホでは「1手順ずつ表示」で大きく読めます。手順名を押すと説明を編集できます。</p>
      <div class="rows">${d.steps.map((s, i) => {
        const open = S.a.stepOpen.has(i);
        return `<div class="step-ed ${open ? "open" : ""}">
          <div class="step-ed-h">
            <span class="row-no">${i + 1}</span>
            <input class="inp" id="${fid(`steps.${i}.title`)}" data-bind="steps.${i}.title" value="${esc(s.title)}" placeholder="手順名（例：機器の設置と配線）" data-focus-open="${i}">
            <span class="tools">
              ${open ? "" : `<span class="step-flags">${s.body ? "" : `<span class="chip warn">説明なし</span>`}${s.caution ? `<span class="chip warn">${ic("alert")}注意あり</span>` : ""}</span>`}
              <button class="icon-btn" type="button" data-act="stepTog" data-i="${i}" aria-label="${open ? "説明を閉じる" : "説明を開く"}" aria-expanded="${open}">${ic(open ? "up" : "down")}</button>
              <span style="width:1px;height:18px;background:var(--line);margin:0 4px"></span>
              ${toolBtns("steps", i, d.steps.length)}
            </span>
          </div>
          ${open ? `<div class="step-ed-b">
            ${fld("説明", `steps.${i}.body`, `<textarea class="ta" id="${fid(`steps.${i}.body`)}" data-bind="steps.${i}.body" rows="3" placeholder="現場で読んで分かるように、操作の順番どおりに書きます。改行も反映されます。">${esc(s.body)}</textarea>`)}
            ${fld("注意点（任意）", `steps.${i}.caution`, inp(`steps.${i}.caution`, s.caution, "例：途中で電源を切るとやり直しになります。"), { hint: "入力すると、現場では黄色の注意枠で表示されます。" })}
          </div>` : ""}
        </div>`;
      }).join("") || `<div class="empty-row">手順がまだありません</div>`}</div>
      ${addBtn("steps", "手順を追加")}</div>`;

    case "man": return `<div class="sect">
      <p class="sect-intro">PDF の手順書、作業動画、社内Wikiのページなどを登録できます。現場ではポータル上でそのまま開けます。</p>
      <section class="card blk">
        ${d.manuals.length ? `<div class="cols-h row-man"><span>種類</span><span>タイトル</span><span>ページ数・時間</span><span>更新日</span><span></span></div>` : ""}
        <div class="rows">${d.manuals.map((m, i) => `<div class="row row-man">
          <select class="sel" id="${fid(`manuals.${i}.kind`)}" data-bind="manuals.${i}.kind" aria-label="種類">${["PDF", "動画", "Web"].map(k => `<option ${k === m.kind ? "selected" : ""}>${k}</option>`).join("")}</select>
          ${inp(`manuals.${i}.title`, m.title, "タイトル")}
          ${inp(`manuals.${i}.meta`, m.meta, m.kind === "動画" ? "例：8分" : "例：32ページ")}
          <input class="inp num" type="date" id="${fid(`manuals.${i}.updated`)}" data-bind="manuals.${i}.updated" value="${esc(m.updated)}" aria-label="更新日">
          ${tools("manuals", i, d.manuals.length)}
        </div>`).join("") || `<div class="empty-row">マニュアルはまだありません</div>`}</div>
        ${addBtn("manuals", "マニュアルを追加")}
      </section></div>`;

    case "docs": return docsTab(d);

    case "pub": return `<div class="sect"><section class="card blk">
      <label class="pubck"><input type="checkbox" id="f-pub" ${d.status === "published" ? "checked" : ""}><span><b>TOPページに表示する</b><small>保存するとすぐにTOPページと検索に反映されます。準備中で、まだ現場に見せたくないときはチェックを外します。</small></span></label>
    </section></div>`;
  }
  return "";
}

function pvInner() {
  return `<div class="pv-h">${ic("phone")} スマホでの表示<small>保存前の内容を表示中</small></div>
    <div class="phone"><div class="phone-scr" id="pvScr">${wkDetail(S.a.draft, true)}</div></div>`;
}

/* =========================================================
   描画
   ========================================================= */
function render() {
  document.body.classList.toggle("is-login", isSrv() && !AUTH.user);
  if (isSrv() && !AUTH.user) { $("#app").innerHTML = loginHtml(); $("#savebar").innerHTML = ""; renderLayer(); $("#lgUser")?.focus(); return; }
  $(".sample-note").hidden = isSrv();
  const pb = $("#pwBanner");
  pb.hidden = !(isSrv() && AUTH.user && AUTH.user.mustChange);
  pb.innerHTML = pb.hidden ? "" : `<span>初期パスワードのままです。安全のため、早めに変更してください。</span><button class="link" type="button" data-act="pwOpen">パスワードを変更する</button>`;
  $("#offlineNote").textContent = AUTH.offline ? "オフラインです。最後に読み込んだ内容を表示しています（変更の保存や、作業記録の登録はできません）。" : "オフラインです。表示済みの作業は見られますが、作業記録の登録・検索には通信が必要です。";
  $("#brandMark").innerHTML = LOGO_MARK;
  $("#modeWork").innerHTML = ic("grid") + "作業一覧";
  $("#modeAdmin").innerHTML = ic("gear") + "設定";
  const onRecs = S.mode === "work" && ["logs", "log", "logform"].includes(S.w.view);
  $("#modeRecords").innerHTML = ic("sheet") + "作業記録";
  $("#modeWork").setAttribute("aria-pressed", S.mode === "work" && !onRecs);
  $("#modeRecords").setAttribute("aria-pressed", onRecs);
  $("#modeAdmin").setAttribute("aria-pressed", S.mode === "admin");
  $("#modeAdmin").hidden = !can.admin();
  const m = me();
  $("#who").innerHTML = `<span class="who-name">${esc(m.name)}</span><span class="who-role">${ROLES[m.role].label}</span><span class="who-av" aria-hidden="true">${esc(m.name.slice(0, 1))}</span>`;
  const treeScroll = $("#tree")?.scrollTop || 0;
  $("#app").innerHTML = S.mode === "work" ? renderWork() : renderAdmin();
  if ($("#tree")) $("#tree").scrollTop = treeScroll;
  renderLayer(); renderSavebar();
}
function renderLayer() {
  const L = S.layer; let h = "";
  if (L?.type === "focus") h = focusHtml();
  else if (L?.type === "manual") h = manualHtml();
  else if (L?.type === "example") h = exampleHtml();
  else if (L?.type === "lgimg") h = lgViewerHtml();
  if (S.a.pvModal && S.mode === "admin" && S.a.draft && S.a.sel?.type === "task") {
    h += `<div class="scrim top" data-act="pvClose"></div><div class="pv-modal"><div class="phone"><div class="phone-scr" id="pvScr2">${wkDetail(S.a.draft, true)}</div></div><button class="btn" type="button" data-act="pvClose">プレビューを閉じる</button></div>`;
  }
  if (S.menuOpen) {
    const inst = window.__bip ? `<button class="btn sm primary" type="button" data-act="installApp">${ic("dl")}アプリとしてインストール</button>`
      : matchMedia("(display-mode: standalone)").matches ? `<span class="muted">インストール済みのアプリとして開いています。</span>`
      : `<span class="muted">スマホでは、ブラウザのメニューの「ホーム画面に追加」（iPhone は共有ボタンから）でインストールできます。</span>`;
    const m = me();
    const body = isSrv()
      ? `<div class="um-h">${esc(m.name)}<small>${esc(m.dept || "—")}・ログインID <span class="mono">${esc(AUTH.user.username || "")}</span></small></div>
         <div style="padding:0 12px 6px"><span class="chip ${ROLES[m.role].cls}">${ROLES[m.role].label}</span></div>
         <button class="um-it" role="menuitem" type="button" data-act="pwOpen"><span class="um-t"><b>パスワードを変更</b></span></button>
         <button class="um-it" role="menuitem" type="button" data-act="logout"><span class="um-t"><b>ログアウト</b></span></button>`
      : `<div class="um-h">ログインユーザーの切り替え<small>サンプル用の機能です。本番では、ログインしたユーザーの権限が自動で適用されます。</small></div>${DATA.users.filter(u => u.active).map(u => `<button class="um-it ${u.id === S.me ? "on" : ""}" role="menuitem" type="button" data-act="setMe" data-id="${u.id}"><span class="h-av">${esc(u.name.slice(0, 1))}</span><span class="um-t"><b>${esc(u.name)}</b><small>${esc(u.dept)}</small></span><span class="chip ${ROLES[u.role].cls}">${ROLES[u.role].label}</span>${u.id === S.me ? ic("check") : ""}</button>`).join("")}`;
    h += `<div class="scrim clear" data-act="userMenuClose"></div><div class="umenu" role="menu">${body}<div class="um-inst"><b>WorkBase Portal をアプリとして使う</b>${inst}</div></div>`;
  }
  if (L?.type === "modal") {
    h += `<div class="scrim top"></div><div class="modal ${L.wide ? "wide" : ""}" role="alertdialog" aria-modal="true" aria-labelledby="mT"><h2 id="mT">${esc(L.title)}</h2>${L.text ? `<p>${esc(L.text)}</p>` : ""}${L.body || ""}
      <div class="modal-f">${L.buttons.map(b => `<button class="btn ${b.cls || ""}" type="button" data-act="${b.act}">${esc(b.label)}</button>`).join("")}</div></div>`;
  }
  $("#layer").innerHTML = h;
}
function renderSavebar() {
  const a = S.a;
  if (S.mode !== "admin" || !a.dirty) { $("#savebar").innerHTML = ""; return; }
  let sub = "保存するまで現場には反映されません。", label = "保存";
  if (a.sel?.type === "task") {
    if (!a.draft.id) { label = "登録"; sub = a.draft.status === "published" ? "登録すると、すぐにTOPページと検索に表示されます。" : "非公開で登録します（現場には表示されません）。"; }
    else sub = a.draft.status === "published" ? "保存すると、すぐにTOPページと検索に反映されます。" : "非公開の作業です。現場には表示されません。";
  }
  $("#savebar").innerHTML = `<div class="savebar" role="region" aria-label="保存">
    <span class="msg">未保存の変更があります<small>${sub}</small></span>
    <button class="btn ghost" type="button" data-act="discard">変更を破棄</button>
    <button class="btn primary" type="button" data-act="save">${ic("check")}${label}</button>
  </div>`;
}

/* 入力のたびに、タブの状態・プレビューだけを部分更新する */
let pvTimer;
function touched() {
  S.a.dirty = true;
  renderSavebar();
  if (S.a.sel?.type === "task") {
    const tabs = $("#tabs"); if (tabs) tabs.innerHTML = tabsHtml();
    $("#f-title")?.classList.toggle("err", !S.a.draft.title.trim());
    clearTimeout(pvTimer);
    pvTimer = setTimeout(() => {
      [$("#pvScr"), $("#pvScr2")].forEach(el => { if (el) { const st = el.scrollTop; el.innerHTML = wkDetail(S.a.draft, true); el.scrollTop = st; } });
    }, 200);
  }
}
function rerenderSection() {
  const b = $("#secBody"); if (b) b.innerHTML = allSectionsHtml();
  touched();
}

/* =========================================================
   設定画面の操作
   ========================================================= */
function guard(fn) {
  if (!S.a.dirty) { fn(); return; }
  S.a.pending = fn;
  S.layer = { type: "modal", title: "保存していない変更があります", text: "このまま移動すると、編集中の内容は失われます。", buttons: [
    { label: "キャンセル", act: "mCancel" }, { label: "破棄して移動", act: "mDiscardGo", cls: "danger" }, { label: "保存して移動", act: "mSaveGo", cls: "primary" }
  ] };
  renderLayer();
}
function allowed(sel) {
  if (!sel) return true;
  if (sel.type === "files" || sel.type === "ext") return isSrv() && can.admin();
  if (sel.type === "users") return can.users();

function newTask(cat) {   // 登録するまではサーバーに作らない（id は登録時に付く）

async function saveNotices() {

    else e.textContent = it.state === "fin" ? "仕上げ中…" : `アップロード中 ${it.size ? Math.floor(it.sent / it.size * 100) : 0}%`; });

async function uploadFiles(list) {

  if (!S.up.limits) await loadFilesInfo();

    S.up.items.push({ key: "u" + Math.random().toString(36).slice(2, 8), name: file.name, size: file.size, sent: 0, state: "wait", file, taskId: d.id, chunk: 0, uploadId: "", cancel: false, err: "" });

let upRunning = false;
async function runUploads() {
  if (upRunning) return;
  upRunning = true;
  try { for (;;) { const it = S.up.items.find(x => x.state === "wait"); if (!it) break; await uploadOne(it); } } finally { upRunning = false; }
}
async function uploadOne(it) {
  it.state = "up"; it.err = ""; it.cancel = false; paintUp();
  const post = async (offset, blob) => {
    const res = await fetch("api/?" + new URLSearchParams({ r: "upload/chunk", id: it.uploadId, offset }), { method: "POST", body: blob, credentials: "same-origin", headers: { "X-Requested-With": "WorkBase", "Content-Type": "application/octet-stream" } });
    return { res, j: await res.json().catch(() => ({})) };
  };
  try {
    if (!it.uploadId) { const r = await api("upload/init", {}, { method: "POST", body: { name: it.name, size: it.size } }); it.uploadId = r.uploadId; it.chunk = r.chunkBytes; it.sent = 0; }
    else { const st = await api("upload/status", { id: it.uploadId }); it.sent = st.received; it.chunk = st.chunkBytes; }
    let tries = 0, conflicts = 0;
    while (it.sent < it.size) {
      if (it.cancel) throw new Error("cancel");
      let out;
      try { out = await post(it.sent, it.file.slice(it.sent, Math.min(it.size, it.sent + it.chunk))); }
      catch (e) {
        if (++tries > 5) throw new Error("通信が途切れました。電波の良い場所で「続きから再開」を押してください");
        await sleep(1000 * tries);
        try { it.sent = (await api("upload/status", { id: it.uploadId })).received; } catch (e2) { /* 次の周で再試行 */ }
        continue;
      }
      const { res, j } = out;
      if (res.ok) { it.sent = j.received; tries = 0; paintUp(); continue; }
      if (res.status === 413 && it.chunk > 262144) { it.chunk = Math.max(262144, Math.floor(it.chunk / 2)); continue; }   // サーバー側の上限が小さいときは、小さく分けて送り直す
      if (res.status === 409 && j.received != null && ++conflicts < 20) { it.sent = j.received; continue; }
      if (res.status === 401) { onSessionExpired(); throw new Error("ログインの有効期限が切れました"); }
      throw new Error(j.error || "HTTP " + res.status);
    }
    it.state = "fin"; paintUp();
    const fin = await api("upload/finish", {}, { method: "POST", body: { id: it.uploadId }, timeout: 900000 });
    it.state = "done"; it.file = null;
    const d = S.a.draft;
    if (it.target) {
      if (d && d.id === it.taskId && S.a.sel?.type === "task" && d.docs.includes(it.target.doc)) {
        it.target.doc[it.target.slot] = { name: fin.file.name, size: fin.file.size, sha: fin.file.sha, fid: fin.file.fid };
        S.up.items = S.up.items.filter(x => x !== it);
        rerenderSection();
        toast(`${fin.file.name} をアップロードしました。「保存」すると作業に反映されます`);
      } else toast(`${fin.file.name} のアップロードは完了しましたが、編集画面から離れたため、書類には設定されていません`);
    } else if (d && d.id === it.taskId && S.a.sel?.type === "task") {
      d.files.push({ ...fin.file }); rerenderSection();
      toast(`${fin.file.name} をアップロードしました。「保存」すると作業に反映されます`);
    } else toast(`${fin.file.name} のアップロードは完了しましたが、元の作業の編集画面から離れたため、作業には追加されていません。もう一度追加してください`);
  } catch (e) {
    if (e.message === "cancel") { it.state = "cancel"; try { await api("upload/cancel", {}, { method: "POST", body: { id: it.uploadId } }); } catch (e2) { /* 24時間後に自動で片付く */ } it.uploadId = ""; }
    else { it.state = "err"; it.err = e.message; }
  }
  paintUp();
}

async function addFiles(list) {
  const d = S.a.draft; if (!d || !list.length) return;
  if (isSrv()) return uploadFiles(list);
  const added = [...list].map(file => {
    const row = { name: file.name, size: file.size, desc: "", sha: file.size > 300 * MB ? "アップロード時に計算" : "計算中…" };
    d.files.push(row);
    return { file, row };
  });
  rerenderSection();
  toast(`${added.length}件のファイルを追加しました`);
  for (const { file, row } of added) {
    if (row.sha !== "計算中…") continue;
    try {
      const buf = await file.arrayBuffer();
      const h = await crypto.subtle.digest("SHA-256", buf);
      row.sha = [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch { row.sha = "アップロード時に計算"; }
    if (S.a.draft === d) rerenderSection();
  }
}

  /* モーダル */
  mCancel: () => { S.layer = null; S.a.pending = null; renderLayer(); },
  mDiscardGo: () => { const fn = S.a.pending; S.layer = null; S.a.pending = null; S.a.dirty = false; renderLayer(); fn && fn(); },
  mSaveGo: async () => { const fn = S.a.pending; S.layer = null; S.a.pending = null; renderLayer(); if (await save()) fn && fn(); },
  mDelTask: async () => {
    const id = S.a.draft.id;
    if (isSrv()) { try { const r = await srvOp("task.delete", { id }); delete PROG[id]; saveProg(); S.layer = null; select(null); toast(r.message); } catch (e) { failToast(e); S.layer = null; renderLayer(); } return; }
    log("delete", "task", id, S.a.draft.title, "作業を削除"); DATA.tasks = DATA.tasks.filter(t => t.id !== id); delete PROG[id]; saveData(); saveProg();
    S.layer = null; select(null); toast(`${id} を削除しました`);
  },
  mDelCat: async () => { const id = S.a.draft.id; if (isSrv()) { try { const r = await srvOp("cat.delete", { id }); S.layer = null; select(null); toast(r.message); } catch (e) { failToast(e); S.layer = null; renderLayer(); } return; } log("delete", "category", "", S.a.draft.name, "大項目を削除"); DATA.categories = DATA.categories.filter(c => c.id !== id); saveData(); S.layer = null; select(null); toast("大項目を削除しました"); },
  mReset: () => { DATA = clone(DEFAULT_DATA); PROG = {}; DEMO_LOGS = makeDemoLogs(); saveData(); saveProg(); saveDemoLogs(); S.layer = null; select(null); toast("サンプルデータに戻しました"); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});

/* 検索欄（日本語入力の変換中は更新しない） */
let rvT;
function onSearch(el) {
  if (el.id === "wq") { S.w.q = el.value.trim(); refreshResults(); }
  else if (el.id === "lgQ") { S.lg.f.q = el.value; const c = document.querySelector('[data-act="lgClearQ"]'); if (c) c.hidden = !el.value; clearTimeout(rvT); rvT = setTimeout(() => loadLogs(true), 250); }
  else if (el.id === "treeQ") {
    S.a.treeQ = el.value; const pos = el.selectionStart;
    $("#tree").innerHTML = treeHtml();
    const n = $("#treeQ"); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
  }
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "wq" || el.id === "treeQ" || el.id === "lgQ") { if (!e.isComposing) onSearch(el); return; }
  if (el.id === "exTq") { const q = el.value.trim().toLowerCase(); document.querySelectorAll("#exTasks .ck").forEach(l => { l.hidden = !!q && !l.dataset.tx.includes(q); }); document.querySelectorAll("#exTasks .ex-g").forEach(g => { g.hidden = ![...g.querySelectorAll(".ck")].some(l => !l.hidden); }); return; }
  if (el.id === "admQ") { S.a.list.q = el.value; if (!e.isComposing) $("#admList").innerHTML = admListHtml(); return; }
  if (el.id === "histQ") { S.a.hist.q = el.value; if (!e.isComposing) $("#histList").innerHTML = histListHtml(); return; }
  if (el.id === "mText") { S.layer.value = el.value; return; }
  if (el.id === "mReason") { S.layer.reason = el.value; return; }
  if (el.id === "mNote") { S.layer.note = el.value; return; }
  if (el.id === "reviewNote") { S.a.note = el.value; touched(); return; }
  if (el.dataset.lgf && S.lg.form) { S.lg.form[el.dataset.lgf] = el.value; S.lg.form.touched = true; return; }
  if (el.dataset.meta) { const p = (PROG[S.w.taskId] ||= {}); (p.meta ||= {})[el.dataset.meta] = el.value; saveProg(); return; }
  const b = el.dataset.bind;
  if (b && S.a.draft) {
    let v = el.value;
    if (el.dataset.type === "num") v = v === "" ? "" : Number(v);
    setPath(S.a.draft, b, v);
    touched();
  }
});
document.addEventListener("compositionend", e => { if (e.target.id === "admQ") { S.a.list.q = e.target.value; $("#admList").innerHTML = admListHtml(); } });
document.addEventListener("compositionend", e => { if (e.target.id === "wq" || e.target.id === "treeQ" || e.target.id === "lgQ") onSearch(e.target); });

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fileIn") { addFiles(el.files); el.value = ""; return; }
  if (el.id === "admCat" || el.id === "admSt") { S.a.list[el.id === "admCat" ? "cat" : "st"] = el.value; $("#admList").innerHTML = admListHtml(); return; }
  if (el.id === "f-pub" && S.a.draft) { S.a.draft.status = el.checked ? "published" : "draft"; touched(); renderSavebar(); return; }
  if (el.dataset.doc != null && el.type === "file") { addDocFile(+el.dataset.doc, el.dataset.slot, el.files[0]); el.value = ""; return; }
  if (el.id === "lfFrom" || el.id === "lfTo") { S.lg.f[el.id === "lfFrom" ? "from" : "to"] = el.value; loadLogs(true); return; }
  if (el.id === "lfTask" || el.id === "lfUser" || el.id === "lfResult") { S.lg.f[{ lfTask: "task", lfUser: "user", lfResult: "result" }[el.id]] = el.value; loadLogs(true); return; }
  if (el.id === "lgFile") { lgAddFiles(el.files); el.value = ""; return; }
  if (el.id === "lgTaskSel" && S.lg.form) { const F = S.lg.form; F.taskId = el.value; F.touched = true; const o = $("#lgTitle"); o.hidden = el.value !== "__other"; if (!o.hidden) o.focus(); return; }
  const ck = el.dataset.wck;
  if (ck) {
    const inFocus = S.layer?.type === "focus";
    const id = inFocus ? S.layer.id : S.w.taskId, t = taskById(id);
    setChk(t, ck, el.checked);
    if (inFocus) {
      renderLayer();
      if (el.checked && S.layer.i < t.steps.length - 1) setTimeout(() => { if (S.layer?.type === "focus") { S.layer.i++; renderLayer(); } }, 350);
    }
    refreshWork();
    return;
  }
  if (el.dataset.hist) { S.a.hist[el.dataset.hist] = el.value; $("#edIn").innerHTML = historyHtml(); }
});

document.addEventListener("focusin", e => {
  const el = e.target;
  const i = el.dataset?.focusOpen;
  if (i !== undefined && !S.a.stepOpen.has(+i)) {
    S.a.stepOpen.add(+i);
    const id = el.id, pos = el.selectionStart;
    $("#secBody").innerHTML = allSectionsHtml();
    const n = document.getElementById(id); n?.focus(); try { n.setSelectionRange(pos, pos); } catch {}
  }
});

document.addEventListener("submit", e => { if (e.target.id === "loginForm") { e.preventDefault(); doLogin(); } });

document.addEventListener("keydown", e => {
  if (e.target.id === "tagIn" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    const v = e.target.value.trim();
    if (v && !S.a.draft.tags.includes(v)) { S.a.draft.tags.push(v); rerenderSection(); $("#tagIn")?.focus(); }
    else e.target.value = "";
  }
  if (e.target.id === "wq" && e.key === "Enter" && !e.isComposing) {
    e.preventDefault(); onSearch(e.target);
    document.querySelector(".results")?.scrollIntoView({ behavior: "smooth", block: "start" }); e.target.blur();
  }
  if (e.key === "Escape") {
    if (S.menuOpen) { S.menuOpen = false; renderLayer(); }
    else if (S.layer?.type === "modal") ACT.mCancel();
    else if (S.layer) ACT.closeLayer();
    else if (S.a.pvModal) ACT.pvClose();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "s" && S.mode === "admin" && S.a.dirty) { e.preventDefault(); save(); }
});

["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.add("over");
}));
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => {
  const d = e.target.closest?.("#drop"); if (!d) return; e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files);
});
window.addEventListener("beforeunload", e => { if (S.a.dirty) { e.preventDefault(); e.returnValue = ""; } });

startSync();
$("#app").innerHTML = `<div class="boot">読み込み中…</div>`;

/* PWA: インストールとオフライン対応 */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__bip = e; if (S.menuOpen) renderLayer(); });
window.addEventListener("appinstalled", () => { window.__bip = null; toast("WorkBase Portal をインストールしました"); });
const syncOnline = () => { $("#offlineNote").hidden = navigator.onLine; };
window.addEventListener("online", syncOnline); window.addEventListener("offline", syncOnline); syncOnline();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

boot().then(afterBoot);
</script>
</body>
</html>
