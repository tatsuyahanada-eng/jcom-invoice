<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>現地作業ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout:
   現場ビュー … グラデーションのヘッダー帯に大きな検索欄 → カテゴリ → 作業カード。作業詳細は「準備 / 機器 / ファイル / 手順 / マニュアル」を1ページに並べ、
                 コンテナクエリで PC は2カラム・スマホは1カラムに切り替わる（設定画面のスマホプレビューも同じ部品を使う）。
   設定画面   … 左：大項目→小項目のツリー ／ 中央：タブで1セクションずつ編集 ／ 右：スマホ表示のライブプレビュー。
   色はすべて下のトークンで管理。ブランドのグラデーションは参考画像（濃い青 → 水色）に合わせている。 */
:root {
  --brand-a: #0866b6;
  --brand-b: #1c9ddc;
  --brand-c: #27b3e8;
  --grad: linear-gradient(100deg, var(--brand-a) 0%, var(--brand-b) 62%, var(--brand-c) 100%);
  --on-brand: #ffffff;
  --on-brand-soft: rgba(255, 255, 255, .16);
  --on-brand-line: rgba(255, 255, 255, .32);
  --brand-ink: #0866b6;

  --bg: #f1f6fb;
  --surface: #ffffff;
  --surface-2: #e9f1f8;
  --line: #d8e4ee;
  --line-strong: #b4c7d7;
  --fg: #0d2537;
  --muted: #587084;
  --accent: #0a6fc2;
  --accent-soft: #e1effa;
  --ok: #17845a;
  --ok-soft: #dff3ea;
  --warn: #9c5d00;
  --warn-soft: #fcf0d9;
  --danger: #c2334a;
  --danger-soft: #fce6e9;
  --shadow: 0 1px 2px rgba(13, 37, 55, .06), 0 4px 14px rgba(13, 37, 55, .05);
  --shadow-lg: 0 10px 40px rgba(13, 37, 55, .18);
  --scrim: rgba(8, 24, 38, .5);
  --bezel: #0d2537;

  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  --r-lg: 14px;
  --bar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
    --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
    --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
    --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand-a: #06508f; --brand-b: #1279b8; --brand-c: #1b93cc; --brand-ink: #0866b6;
  --bg: #0a1520; --surface: #0f1f2e; --surface-2: #15293b; --line: #1f3649; --line-strong: #2f4c64;
  --fg: #e3edf5; --muted: #8ea6b9; --accent: #52b5ee; --accent-soft: #12314a;
  --ok: #5cc795; --ok-soft: #12342a; --warn: #e6a74d; --warn-soft: #36290f; --danger: #f07a8d; --danger-soft: #3c1a21;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --bezel: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.4; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .88em; letter-spacing: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ===== App bar ===== */
.appbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--bar-h); background: var(--grad); color: var(--on-brand);
}
.appbar-in { max-width: 1440px; margin: 0 auto; height: 100%; padding: 0 20px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: .02em; white-space: nowrap; background: none; border: 0; color: inherit; padding: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--on-brand); color: var(--brand-ink); display: grid; place-items: center; }
.brand-mark svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
.seg { display: flex; background: var(--on-brand-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--on-brand); padding: 6px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button svg.i { width: 15px; height: 15px; }
.seg button[aria-pressed="true"] { background: var(--on-brand); color: var(--brand-ink); }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap; }
.who-av { width: 32px; height: 32px; border-radius: 50%; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.sample-note { font-size: 12px; text-align: center; padding: 5px 16px; background: var(--warn-soft); color: var(--warn); }

/* ===== Common parts ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
  font-size: 13.5px; font-weight: 700; white-space: nowrap; line-height: 1.4;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }
.btn.done { border-color: var(--ok); color: var(--ok); }
.icon-btn { width: 30px; height: 30px; border-radius: 7px; border: 0; background: none; color: var(--muted); display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--accent); }
.icon-btn.del:hover { color: var(--danger); background: var(--danger-soft); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.icon-btn svg.i { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; line-height: 1; padding: 5px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip svg.i { width: 12px; height: 12px; stroke-width: 2.4; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
.model { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.ico-tile { width: 42px; height: 42px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.ico-tile svg.i { width: 22px; height: 22px; }

/* ===== Worker: home ===== */
.hero { background: var(--grad); color: var(--on-brand); padding: 30px 20px 72px; position: relative; overflow: hidden; }
.hero::after {
  content: ""; position: absolute; right: -120px; top: -160px; width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); pointer-events: none;
}
.hero-in { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; position: relative; z-index: 1; }
.hero h1 { font-size: 26px; letter-spacing: .02em; }
.hero p { opacity: .92; font-size: 14px; }
.bigsearch { display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 0 8px 0 16px; box-shadow: var(--shadow-lg); max-width: 760px; }
.bigsearch svg.i { color: var(--accent); width: 22px; height: 22px; }
.bigsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; height: 56px; font-size: 16.5px; }
.bigsearch .icon-btn { width: 36px; height: 36px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; }
.suggest span { opacity: .85; }
.suggest button { border: 1px solid var(--on-brand-line); background: var(--on-brand-soft); color: var(--on-brand); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
.suggest button:hover { background: var(--on-brand); color: var(--brand-ink); }

.home { max-width: 1100px; margin: -44px auto 0; padding: 0 20px 72px; position: relative; z-index: 2; display: grid; gap: 28px; }
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.cat { text-align: left; padding: 16px; display: grid; gap: 10px; align-content: start; transition: border-color .15s, transform .15s; }
.cat:hover { border-color: var(--accent); transform: translateY(-1px); }
.cat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.cat-name { font-weight: 700; font-size: 14.5px; line-height: 1.45; }
.cat-sub { font-size: 12px; color: var(--muted); line-height: 1.55; }
.cat-count { font-size: 12px; color: var(--accent); font-weight: 700; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.list-head h2 { font-size: 17px; }
.list-head .count { color: var(--muted); font-size: 13px; }
.ind { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.ind button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
.ind button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.results { display: grid; gap: 10px; scroll-margin-top: calc(var(--bar-h) + 12px); }
.res {
  display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: center;
  padding: 14px 16px; text-align: left; width: 100%;
}
.res:hover { border-color: var(--accent); }
.res-body { display: grid; gap: 4px; min-width: 0; }
.res-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.res-title { font-weight: 700; font-size: 15.5px; line-height: 1.5; }
.res-sum { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-models { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.res-why { font-size: 12px; color: var(--warn); font-weight: 700; }
.res-side { display: grid; gap: 6px; justify-items: end; font-size: 12px; color: var(--muted); }
.res-chev { color: var(--line-strong); }
.res:hover .res-chev { color: var(--accent); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }

.side { display: grid; gap: 16px; }
.side .card { padding: 4px 18px 10px; }
.side h3 { font-size: 14px; padding: 12px 0 8px; display: flex; align-items: center; gap: 8px; }
.notice { padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; display: grid; gap: 4px; line-height: 1.6; }
.notice time { color: var(--muted); font-size: 12px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13px; font-weight: 700; text-align: left; }
.link:hover { text-decoration: underline; }
.recent-item { display: grid; gap: 1px; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; font-size: 13px; }
.recent-item:hover b { color: var(--accent); }
.recent-item small { color: var(--muted); font-size: 12px; }
.support strong { font-size: 18px; display: block; letter-spacing: .03em; }

/* ===== Worker: task detail (container query で PC / スマホ を切り替え) ===== */
.wk-c { container-type: inline-size; --stick-top: var(--bar-h); }
.wk { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; display: grid; gap: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 0; justify-self: start; }
.back svg.i { transform: rotate(180deg); width: 16px; height: 16px; }
.wk-head { background: var(--grad); color: var(--on-brand); border-radius: var(--r-lg); padding: 22px 24px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.wk-head::after { content: ""; position: absolute; right: -80px; bottom: -140px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.14), rgba(255,255,255,0)); }
.wk-crumb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; position: relative; z-index: 1; }
.pill-w { display: inline-flex; align-items: center; gap: 6px; background: var(--on-brand-soft); border: 1px solid var(--on-brand-line); border-radius: 999px; padding: 2px 10px 2px 7px; font-weight: 700; }
.pill-w svg.i { width: 15px; height: 15px; }
.wk-head h1 { font-size: 22px; position: relative; z-index: 1; }
.wk-head p { font-size: 14px; opacity: .94; max-width: 70ch; position: relative; z-index: 1; }
.wk-facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 4px 0 0; position: relative; z-index: 1; }
.wk-facts div { display: grid; }
.wk-facts dt { font-size: 11px; opacity: .8; letter-spacing: .06em; }
.wk-facts dd { margin: 0; font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.wk-nav {
  position: sticky; top: var(--stick-top); z-index: 5;
  display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin: -8px 0;
  background: var(--bg); scrollbar-width: none;
}
.wk-nav::-webkit-scrollbar { display: none; }
.wk-nav button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.wk-nav button:hover { color: var(--accent); border-color: var(--accent); }
.wk-nav button.go { color: var(--accent); border-color: var(--accent); }
.wk-nav button:disabled { opacity: .6; }
.wk-nav button svg.i { width: 15px; height: 15px; }
.wk-nav .n { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
.wk-grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
.wk-main { display: grid; gap: 18px; min-width: 0; }
.wsec { padding: 18px 20px 20px; display: grid; gap: 14px; scroll-margin-top: calc(var(--stick-top) + 56px); }
.wsec-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.wsec-h h2 { font-size: 16.5px; }
.wsec-h .sub { font-size: 12.5px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.sub-h { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.sub-h svg.i { width: 15px; height: 15px; }
.cks { display: grid; gap: 2px; }
.ck { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1.6; }
.ck:hover { background: var(--surface-2); }
.ck input { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
.ck.on > span:first-of-type { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.ck .qty { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
.ck .req { font-size: 10.5px; font-weight: 700; color: var(--danger); margin-left: 6px; }
.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.dev { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.dev-type { font-size: 11.5px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.dev-name { font-weight: 700; font-size: 14px; }
.dev-model { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); }
.dev-note { font-size: 12px; color: var(--muted); }
.os-line { font-size: 13px; color: var(--muted); }
.bundle { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); }
.bundle b { display: block; font-size: 14.5px; }
.bundle small { font-size: 12.5px; color: var(--muted); }
.files { border: 1px solid var(--line); border-radius: var(--r); }
.file { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.file:first-child { border-top: 0; }
.file-ico { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.file-name { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.5; }
.file-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.hash { display: inline-flex; align-items: center; gap: 2px; }
.hash .icon-btn { width: 24px; height: 24px; }
.code-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.code { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; margin-top: -6px; }
.code pre { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; white-space: pre; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6; background: var(--warn-soft); color: var(--fg); }
.note svg.i { color: var(--warn); margin-top: 1px; }
.note.info { background: var(--accent-soft); }
.note.info svg.i { color: var(--accent); }
.note b { display: block; }
.wsteps { display: grid; gap: 10px; }
.wstep { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); }
.wstep.on { background: var(--ok-soft); border-color: transparent; }
.wnum { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--surface); cursor: pointer; position: relative; }
.wnum:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.wstep.on .wnum { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.wnum input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.wnum svg.i { stroke-width: 3; width: 16px; height: 16px; }
.wstep h3 { font-size: 15px; }
.wstep p { font-size: 14px; color: var(--fg); margin-top: 2px; white-space: pre-line; }
.wstep .note { margin-top: 8px; }
.mans { display: grid; gap: 8px; }
.man { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.man-ico { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .04em; }
.man-ico.pdf { background: var(--danger-soft); color: var(--danger); }
.man-ico.mov { background: var(--accent-soft); color: var(--accent); }
.man-ico.web { background: var(--ok-soft); color: var(--ok); }
.man b { font-size: 14px; display: block; line-height: 1.5; }
.man small { font-size: 12px; color: var(--muted); }
details.old { border: 1px dashed var(--line-strong); border-radius: var(--r); }

.old-body { padding: 0 14px 12px; display: grid; gap: 8px; font-size: 13px; }

.wk-side { position: sticky; top: calc(var(--stick-top) + 54px); display: grid; gap: 14px; }
.prog { padding: 16px 18px; display: grid; gap: 12px; }
.prog-top { display: flex; align-items: baseline; justify-content: space-between; }

.prog-top strong { font-size: 24px; font-variant-numeric: tabular-nums; color: var(--ok); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.prog-rows { display: grid; gap: 6px; font-size: 13px; }
.prog-rows div { display: flex; justify-content: space-between; gap: 8px; }
.prog-rows .v { font-weight: 700; font-variant-numeric: tabular-nums; }

.prog-actions { display: flex; flex-wrap: wrap; gap: 8px; }

@container (max-width: 760px) {
  .wk { padding: 14px 14px 64px; gap: 14px; }

  .wk-head p { font-size: 13.5px; }
  .wk-facts { gap: 6px 18px; }
  .wk-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .wk-side { position: static; order: -1; }
  .prog { padding: 12px 14px; gap: 8px; }
  .prog-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
  .prog-rows div { flex-direction: column-reverse; gap: 0; font-size: 11.5px; }
  .prog-rows .v { font-size: 14px; }

  .support-card { display: none; }
  .wsec { padding: 14px; border-radius: 12px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .devs { grid-template-columns: minmax(0, 1fr); }
  .file { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .file-ico { display: none; }
  .file .btn { width: 100%; }
  .bundle .btn { width: 100%; }
  .wstep { grid-template-columns: 32px minmax(0, 1fr); padding: 12px; gap: 10px; }
  .wnum { width: 30px; height: 30px; font-size: 13px; }
}

/* ===== Overlays ===== */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.focus {
  position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(640px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto;
  background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
}
.focus-top { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.focus-top .t { font-size: 13px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus-bar { height: 4px; background: var(--surface-2); }
.focus-bar span { display: block; height: 100%; background: var(--grad); transition: width .25s; }
.focus-body { padding: 26px 26px 10px; display: grid; gap: 14px; }

.focus-body p { font-size: 16px; line-height: 1.85; white-space: pre-line; }
.focus-done { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; cursor: pointer; font-size: 15px; }
.focus-done input { width: 22px; height: 22px; accent-color: var(--ok); margin: 0; }
.focus-done.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.focus-foot { display: flex; gap: 10px; padding: 16px 26px 22px; }
.focus-foot .btn { flex: 1; padding: 12px; font-size: 15px; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(760px, 100%);
  background: var(--surface); box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;

}
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; flex: 1; min-width: 0; }
.drawer-b { overflow-y: auto; padding: 24px; background: var(--surface-2); display: grid; place-items: start center; }
.page-mock { width: 100%; max-width: 560px; aspect-ratio: 1 / 1.414; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 8% 9%; display: grid; align-content: start; gap: 12px; }

.page-mock .ln { height: 9px; border-radius: 4px; background: var(--surface-2); }
.page-mock .img { aspect-ratio: 16 / 9; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.video-mock { width: 100%; max-width: 640px; aspect-ratio: 16 / 9; border-radius: 10px; background: var(--grad); color: var(--on-brand); display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; }
.video-mock svg.i { width: 54px; height: 54px; }
.drawer-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13px; }

.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 32px)); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 22px; display: grid; gap: 12px; }
.modal h2 { font-size: 17px; }
.modal p { font-size: 14px; color: var(--muted); }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.scrim.top { z-index: 60; }

.toast { position: fixed; left: 50%; top: calc(var(--bar-h) + 14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); text-align: center; }

/* ===== Admin ===== */
.adm { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--bar-h)); }
.tree { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }

.tree-q { padding: 0 16px 10px; }

.tree-home { margin: 0 10px 6px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; font-weight: 700; font-size: 13.5px; text-align: left; }

.tree-list { padding: 0 10px 24px; display: grid; gap: 2px; }
.tree-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; padding: 10px 20px 4px; }
.tc-row { display: flex; align-items: center; gap: 2px; }

.tc-tog.open svg.i { transform: rotate(90deg); }
.tc-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 0; background: none; border-radius: 8px; text-align: left; font-weight: 700; font-size: 13.5px; }

.tc-main .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-main .ct { font-size: 11.5px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.tt-list { display: grid; gap: 1px; padding: 2px 0 6px 28px; position: relative; }
.tt-list::before { content: ""; position: absolute; left: 39px; top: 2px; bottom: 10px; width: 1px; background: var(--line); }
.tt { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 24px; border: 0; background: none; border-radius: 8px; text-align: left; font-size: 13px; position: relative; }
.tt .dot { position: absolute; left: 8px; }
.tt .dot.pub, .tree-legend .pub, .order-row .dot.pub, .rc .dot.pub { color: var(--ok); }
.tt .dot.draft, .tree-legend .draft, .order-row .dot.draft, .rc .dot.draft { color: var(--line-strong); }
.tt .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt .warn { font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 1px 7px; flex: none; }
.tt-add { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 24px; border: 0; background: none; color: var(--accent); font-size: 12.5px; font-weight: 700; border-radius: 8px; text-align: left; }
.tt-add:hover { background: var(--accent-soft); }
.tt-add svg.i { width: 14px; height: 14px; }
.tree-legend { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); }
.tree-legend span { display: inline-flex; align-items: center; gap: 5px; }

.ed { container-type: inline-size; min-width: 0; }
.ed-in { max-width: 900px; margin: 0 auto; padding: 22px 28px 120px; }
.ed-head { display: grid; gap: 8px; margin-bottom: 14px; }
.ed-crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }

.tabs { position: sticky; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); z-index: 6; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin: 0 -4px 20px; padding: 0 4px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 12px 10px 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tb { font-size: 11px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.tb.ok { background: var(--ok-soft); color: var(--ok); }
.tb.ok svg.i { width: 12px; height: 12px; stroke-width: 3; }
.tb.n { background: var(--surface-2); color: var(--muted); }
.tb.need { background: var(--warn-soft); color: var(--warn); }

.sect { display: grid; gap: 20px; }
.sect-intro { font-size: 13px; color: var(--muted); margin-top: -6px; }
.blk { padding: 20px; display: grid; gap: 16px; }
.blk-h { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.blk-h h3 { font-size: 15px; }
.blk-h p { font-size: 12.5px; color: var(--muted); flex-basis: 100%; }
.blk-h .right { margin-left: auto; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.fgrid .full { grid-column: 1 / -1; }
.fld { display: grid; gap: 6px; min-width: 0; align-content: start; }
.fld > label, .fld > .lb { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.fld em { font-style: normal; font-size: 10.5px; color: var(--danger); background: var(--danger-soft); border-radius: 4px; padding: 0 5px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.inp, .sel, .ta { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 12px; background: var(--surface); font-size: 14px; line-height: 1.5; }
.inp:focus, .sel:focus, .ta:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp:disabled { background: var(--surface-2); color: var(--muted); }
.inp.err, .ta.err { border-color: var(--danger); }
.ta { resize: vertical; min-height: 84px; }
.inp.mono { font-family: var(--font-mono); font-size: 13.5px; }
.with-unit { display: flex; align-items: center; gap: 8px; }

.toggles { display: flex; flex-wrap: wrap; gap: 6px; }

.toggles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
.tags:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12.5px; font-weight: 700; }
.tag button { border: 0; background: none; color: inherit; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.tag button:hover { background: var(--surface); }

.rows { display: grid; gap: 8px; }
.row { display: grid; gap: 8px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.row:hover { border-color: var(--line-strong); }
.row .inp, .row .sel { padding: 7px 10px; font-size: 13.5px; }
.row-no { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; }
.row-dev { grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 90px; }
.row-pre { grid-template-columns: 26px minmax(0, 1fr) 90px; }
.row-bring { grid-template-columns: minmax(0, 1fr) 84px auto 90px; }
.row-man { grid-template-columns: 96px minmax(0, 1.6fr) minmax(0, .8fr) 150px 90px; }
.cols-h { display: grid; gap: 8px; padding: 0 9px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.req-tg { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.req-tg.on { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.add-row { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line-strong); background: none; border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
.add-row:hover { border-color: var(--accent); background: var(--accent-soft); }

.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 22px; display: grid; justify-items: center; gap: 6px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.drop b { color: var(--fg); font-size: 14px; }
.drop svg.i { width: 28px; height: 28px; color: var(--accent); }
.row-file { grid-template-columns: 34px minmax(0, 1.3fr) minmax(0, 1fr) 90px; }
.row-file .fn { font-family: var(--font-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.row-file .fm { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }

.step-ed { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.step-ed.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step-ed-h { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; }

.step-ed-b { padding: 0 14px 14px 52px; display: grid; gap: 10px; }
.step-flags { display: flex; gap: 6px; align-items: center; margin-right: 4px; }

.radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rc { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px; display: grid; gap: 4px; }
.rc b { display: flex; align-items: center; gap: 8px; font-size: 14.5px; }
.rc span { font-size: 12.5px; color: var(--muted); }
.rc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rc[aria-pressed="true"].pub { border-color: var(--ok); background: var(--ok-soft); }

.icon-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.icon-pick button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.icon-pick button svg.i { width: 24px; height: 24px; }
.icon-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.order-list { display: grid; gap: 6px; }
.order-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 8px 8px 12px; border: 1px solid var(--line); border-radius: var(--r); font-size: 13.5px; }
.order-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; font-weight: 700; }
.order-row .nm:hover { color: var(--accent); text-decoration: underline; }

.dash { display: grid; gap: 22px; }
.dash-h { display: grid; gap: 6px; }
.dash-h h1 { font-size: 22px; }
.dash-h p { color: var(--muted); font-size: 14px; max-width: 64ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 16px 18px; display: grid; gap: 2px; }
.stat small { font-size: 12px; color: var(--muted); font-weight: 700; }

function fmtBytes(b) {
  if (!b && b !== 0) return "—";
  if (b >= GB) return (b / GB).toFixed(1) + " GB";
  if (b >= MB) return Math.round(b / MB) + " MB";
  return Math.max(1, Math.round(b / KB)) + " KB";
}
function dlTime(b) {
  const sec = b * 8 / (60 * 1e6); // 実効 60Mbps
  if (sec < 60) return "1分未満";
  const m = Math.round(sec / 60);
  return m < 60 ? `約${m}分` : `約${Math.floor(m / 60)}時間${m % 60}分`;
}

  const s = String(text ?? "");
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
}

function copyText(text, label) {
  const ok = () => toast(`${label}をコピーしました`);
  const fb = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch { toast("コピーできませんでした"); }
    ta.remove();
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
}

function searchHit(t, q) {
  if (!q) return { hit: true };
  const ql = q.toLowerCase(), has = s => String(s || "").toLowerCase().includes(ql);
  if (has(t.title) || has(t.id)) return { hit: true };
  const d = t.devices.find(d => has(d.model) || has(d.name) || has(d.type));
  if (d) return { hit: true, why: has(d.model) ? `型番「${d.model}」に一致` : `機器「${d.name}」に一致` };
  const fl = t.files.find(x => has(x.name));
  if (fl) return { hit: true, why: `ファイル「${fl.name}」に一致` };
  const tg = t.tags.find(has);
  if (tg) return { hit: true, why: `キーワード「${tg}」に一致` };
  if (has(t.summary)) return { hit: true, why: "作業内容に一致" };
  if (t.bring.some(b => has(b.name))) return { hit: true, why: "持参品に一致" };
  return { hit: false };
}
function progOf(t) {
  const p = PROG[t.id] || {};
  const cnt = (o, n) => Object.entries(o || {}).filter(([k, v]) => v && +k < n).length;
  const prepT = t.precheck.length + t.bring.length;
  const prepD = cnt(p.prep, t.precheck.length) + cnt(p.bring, t.bring.length);
  const fileD = t.files.filter(x => (p.files || {})[x.name]).length;
  const stepD = cnt(p.steps, t.steps.length);
  const total = prepT + t.files.length + t.steps.length;
  const done = prepD + fileD + stepD;
  return { p, prepT, prepD, fileD, stepD, total, done, started: done > 0, complete: total > 0 && done === total };
}

        }).join("")}
      </div>
    </section>

    <div class="home-grid">
      <section aria-labelledby="resH" id="resSec">${resultsHtml(list, q, cat)}</section>

      <aside class="side">
        <section class="card">
          <h3>${ic("bell")} お知らせ</h3>
          ${DATA.notices.map(n => `<div class="notice">
            <time class="num">${fmtDate(n.date)}</time>
            <span><span class="chip ${n.level}">${n.level === "danger" ? "重要" : n.level === "warn" ? "期限あり" : "更新"}</span> ${esc(n.text)}</span>
            ${taskById(n.task) ? `<button class="link" type="button" data-act="openTask" data-id="${n.task}">${n.task} を開く →</button>` : ""}
          </div>`).join("")}
        </section>
        <section class="card">
          <h3>${ic("clock")} 最近開いた作業</h3>
          ${RECENT.map(taskById).filter(t => t && t.status === "published").slice(0, 4).map(t => {
            const p = progOf(t);
            return `<button class="recent-item" type="button" data-act="openTask" data-id="${t.id}"><b>${esc(t.title)}</b><small class="num">${t.id}・進み具合 ${p.done}/${p.total}</small></button>`;
          }).join("") || `<p class="muted" style="font-size:13px;padding:8px 0">まだありません</p>`}
        </section>
        <section class="card support">
          <h3>${ic("info")} 現場で困ったとき</h3>
          <div style="padding:2px 0 8px;font-size:13px">技術サポート窓口（平日 8:30–19:00）<strong>内線 4410</strong><span class="muted">作業IDをお伝えください</span></div>
        </section>
      </aside>
    </div>
  </div>`;
}

function resultsHtml(list, q, cat) {
  return `
    <div class="list-head">
      <h2 id="resH">${q ? `「${esc(q)}」の検索結果` : cat ? esc(cat.name) : "すべての作業"}</h2>
      <span class="count num">${list.length}件</span>
      ${S.w.cat || q || S.w.ind ? `<button class="link" type="button" data-act="wReset">条件をクリア</button>` : ""}
      <div class="ind" role="group" aria-label="業種で絞り込み">
        ${INDUSTRIES.map(i => `<button type="button" data-act="wInd" data-v="${i}" aria-pressed="${S.w.ind === i}">${i}</button>`).join("")}
      </div>
    </div>
    <div class="results">
      ${list.length ? list.map(({ t, h }) => resCard(t, h, q)).join("") : `<div class="card empty">${ic("search")}<b>該当する作業が見つかりません</b><span>型番は「PT-15」のように一部だけでも検索できます。条件をクリアしてもう一度お試しください。</span></div>`}
    </div>`;
}

function resCard(t, h, q) {
  const c = catOf(t.cat), p = progOf(t);
  const st = p.complete ? `<span class="chip ok">${ic("check")}完了</span>` : p.started ? `<span class="chip warn">作業中 ${p.done}/${p.total}</span>` : "";
  return `<button class="card res" type="button" data-act="openTask" data-id="${t.id}">
    <span class="ico-tile">${ic(c.icon)}</span>
    <span class="res-body">
      <span class="res-top"><span class="mono">${hl(t.id, q)}</span><span>${esc(c.name)}</span><span class="num">約${t.minutes}分・${t.people}名</span></span>
      <span class="res-title">${hl(t.title, q)}</span>
      <span class="res-sum">${esc(t.summary)}</span>
      <span class="res-models">${t.devices.slice(0, 3).map(d => `<span class="model">${hl(d.model, q)}</span>`).join("")}${h.why ? `<span class="res-why">${esc(h.why)}</span>` : ""}</span>
    </span>
    <span class="res-side">
      ${st}
      <span class="chip ok"><span class="dot"></span>最新版 ${esc(t.version)}</span>
      <span class="num">${t.files.length ? fmtBytes(totalSize(t)) : "ファイルなし"}</span>
      ${ic("chev", "res-chev")}
    </span>
  </button>`;
}

/* =========================================================
   現場ビュー：作業詳細（設定画面のプレビューと共用）
   ========================================================= */
function wkDetail(t, preview = false) {
  const c = catOf(t.cat);
  const pr = preview ? { p: {}, prepT: t.precheck.length + t.bring.length, prepD: 0, fileD: 0, stepD: 0, total: 0, done: 0 } : progOf(t);
  const p = pr.p;
  const dis = preview ? "disabled" : "";
  const total = totalSize(t);
  const zips = t.files.filter(x => /\.zip$/i.test(x.name));
  const expandCmd = zips.map(x => `Expand-Archive "$env:USERPROFILE\\Downloads\\${x.name}" -DestinationPath "${t.extractTo}" -Force`).join("\n");
  const hashCmd = t.files.map(x => `Get-FileHash "$env:USERPROFILE\\Downloads\\${x.name}"`).join("\n");
  const pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
  const none = s => `<p class="muted" style="font-size:13px">${s}</p>`;
  const navItems = [["prep", "準備", pr.prepT], ["dev", "機器", t.devices.length], ["files", "ファイル", t.files.length], ["steps", "手順", t.steps.length], ["man", "マニュアル", t.manuals.length]];

  return `<div class="wk-c"><div class="wk">
    ${preview ? "" : `<button class="back" type="button" data-act="goHome">${ic("chev")}作業一覧へ戻る</button>`}
    <header class="wk-head">
      <div class="wk-crumb"><span class="pill-w">${ic(c.icon)}${esc(c.name)}</span><span class="mono">${esc(t.id)}</span><span class="pill-w" style="padding-left:10px">最新版 ${esc(t.version)}</span></div>
      <h1>${t.title.trim() ? esc(t.title) : "（作業名が未入力です）"}</h1>
      <p>${t.summary.trim() ? esc(t.summary) : "（作業内容の概要が未入力です）"}</p>
      <dl class="wk-facts">
        <div><dt>所要時間</dt><dd>約${t.minutes || "—"}分</dd></div>
        <div><dt>作業人数</dt><dd>${t.people || "—"}名</dd></div>
        <div><dt>ダウンロード</dt><dd>${t.files.length ? fmtBytes(total) : "なし"}</dd></div>
        <div><dt>更新日</dt><dd>${fmtDate(t.updated)}</dd></div>
      </dl>
    </header>

    <nav class="wk-nav" aria-label="この作業の目次">
      ${navItems.map(([k, n, cnt]) => `<button type="button" data-act="jump" data-to="${k}">${n}<span class="n">${cnt}</span></button>`).join("")}
      ${t.steps.length ? `<button class="go" type="button" data-act="focusStart" data-id="${esc(t.id)}" ${dis}>${ic("steps")}1手順ずつ表示</button>` : ""}
    </nav>

    <div class="wk-grid">
      <div class="wk-main">
        <section class="card wsec" data-sec="prep">
          <div class="wsec-h"><h2>事前準備と持参品</h2><span class="sub">出発前と作業前にチェック</span></div>
          <div class="two">
            <div>
              <div class="sub-h">${ic("check")} 事前確認</div>
              <div class="cks">${t.precheck.length ? t.precheck.map((x, i) => {
                const on = (p.prep || {})[i];
                return `<label class="ck ${on ? "on" : ""}"><input type="checkbox" data-wck="prep:${i}" ${on ? "checked" : ""} ${dis}><span>${x ? esc(x) : "<span class='muted'>（未入力）</span>"}</span></label>`;
              }).join("") : none("事前確認はありません")}</div>
            </div>
            <div>
              <div class="sub-h">${ic("box")} 現地持参品</div>
              <div class="cks">${t.bring.length ? t.bring.map((x, i) => {
                const on = (p.bring || {})[i];
                return `<label class="ck ${on ? "on" : ""}"><input type="checkbox" data-wck="bring:${i}" ${on ? "checked" : ""} ${dis}><span>${x.name ? esc(x.name) : "<span class='muted'>（未入力）</span>"}${x.required ? `<span class="req">必須</span>` : ""}</span><span class="qty">${esc(x.qty)}</span></label>`;
              }).join("") : none("持参品はありません")}</div>
            </div>
          </div>
        </section>

        <section class="card wsec" data-sec="dev">
          <div class="wsec-h"><h2>対象機器</h2><span class="sub">現地の機器ラベルと型番が一致しているか確認してください</span></div>
          ${t.devices.length ? `<div class="devs">${t.devices.map(d => `<div class="dev">
            <span class="dev-type">${esc(d.type) || "—"}</span>
            <span class="dev-name">${d.name ? esc(d.name) : "<span class='muted'>（機器名未入力）</span>"}</span>
            <span class="dev-model">${esc(d.model) || "—"}</span>
            ${d.note ? `<span class="dev-note">${esc(d.note)}</span>` : ""}
          </div>`).join("")}</div>` : none("対象機器が登録されていません")}
          ${t.os ? `<p class="os-line">OS・ソフトウェア：<b style="color:var(--fg)">${esc(t.os)}</b></p>` : ""}
        </section>

        <section class="card wsec" data-sec="files">
          <div class="wsec-h"><h2>ファイルのダウンロードと展開</h2><span class="sub num">${t.files.length}ファイル・合計 ${fmtBytes(total)}</span></div>
          ${t.files.length ? `
            ${t.files.length > 1 ? `<div class="bundle"><span><b>まとめてダウンロード</b><small class="num">${t.files.length}ファイル（${fmtBytes(total)}）・100Mbps回線で${dlTime(total)}</small></span>
              <button class="btn primary" type="button" data-act="dlAll" ${dis}>${ic("dl")}すべてダウンロード</button></div>` : ""}
            <div class="files">${t.files.map(x => {
              const got = (p.files || {})[x.name];
              return `<div class="file">
                <span class="file-ico">${ic(/\.zip$/i.test(x.name) ? "zip" : "file")}</span>
                <span style="display:grid;gap:3px;min-width:0">
                  <span class="file-name">${esc(x.name)}</span>
                  <span class="file-meta">${x.desc ? `<span>${esc(x.desc)}</span>` : ""}<span class="num">${fmtBytes(x.size)}（${dlTime(x.size)}）</span>
                  <span class="hash">SHA-256 <span class="mono">${esc(String(x.sha).slice(0, 10))}…</span><button class="icon-btn" type="button" data-act="copy" data-v="${esc(x.sha)}" data-l="ハッシュ値" aria-label="ハッシュ値をコピー">${ic("copy")}</button></span></span>
                </span>
                <button class="btn ${got ? "done" : "primary"}" type="button" data-act="dl" data-v="${esc(x.name)}" ${dis}>${got ? ic("check") + "取得済み" : ic("dl") + "ダウンロード"}</button>
              </div>`;
            }).join("")}</div>
            <div class="code-h"><span>ファイル確認（表示される値が上の SHA-256 と一致するか）</span><button class="btn sm" type="button" data-act="copy" data-v="${esc(hashCmd)}" data-l="コマンド">${ic("copy")}コピー</button></div>
            <div class="code"><pre>${esc(hashCmd)}</pre></div>
            ${zips.length ? `<div class="code-h"><span>展開（解凍）先：<span class="mono">${esc(t.extractTo)}</span></span><button class="btn sm" type="button" data-act="copy" data-v="${esc(expandCmd)}" data-l="コマンド">${ic("copy")}コピー</button></div>
            <div class="code"><pre>${esc(expandCmd)}</pre></div>` : ""}
            ${total >= GB ? `<div class="note">${ic("alert")}<span><b>大容量のファイルがあります</b>モバイル回線での取得は避け、事務所または店舗の有線LANで取得してください。途中で切れてもブラウザの「再開」で続きから取得できます。</span></div>` : ""}
          ` : none("この作業で使うファイルはありません")}
        </section>

        <section class="card wsec" data-sec="steps">
          <div class="wsec-h"><h2>作業手順</h2><span class="sub">${t.steps.length}ステップ・番号を押すと完了にできます</span></div>
          <div class="wsteps">${t.steps.length ? t.steps.map((s, i) => {
            const on = (p.steps || {})[i];
            return `<div class="wstep ${on ? "on" : ""}">
              <label class="wnum" title="完了にする"><input type="checkbox" data-wck="steps:${i}" ${on ? "checked" : ""} ${dis} aria-label="手順${i + 1}を完了にする">${on ? ic("check") : i + 1}</label>
              <div><h3>${s.title ? esc(s.title) : "<span class='muted'>（手順名未入力）</span>"}</h3>${s.body ? `<p>${esc(s.body)}</p>` : ""}
              ${s.caution ? `<div class="note">${ic("alert")}<span>${esc(s.caution)}</span></div>` : ""}</div>
            </div>`;
          }).join("") : none("作業手順が登録されていません")}</div>
        </section>

        <section class="card wsec" data-sec="man">
          <div class="wsec-h"><h2>マニュアル</h2><span class="sub">印刷・持ち込みは不要です</span></div>
          <div class="mans">${t.manuals.length ? t.manuals.map((m, i) => `<div class="man">
            <span class="man-ico ${m.kind === "動画" ? "mov" : m.kind === "Web" ? "web" : "pdf"}">${m.kind === "動画" ? ic("play") : m.kind === "Web" ? "WEB" : "PDF"}</span>
            <span style="min-width:0"><b>${m.title ? esc(m.title) : "（タイトル未入力）"}</b><small class="num">${esc(m.meta || "—")}・更新 ${fmtDate(m.updated)}</small></span>
            <button class="btn sm ${i === 0 ? "primary" : ""}" type="button" data-act="manual" data-i="${i}" ${dis}>${m.kind === "動画" ? "再生" : "開く"}</button>
          </div>`).join("") : none("マニュアルは登録されていません")}</div>
        </section>

        ${t.old.length ? `<details class="old"><summary>旧バージョン（${t.old.length}件）— 通常は使用しません</summary><div class="old-body">
          <div class="note">${ic("alert")}<span><b>旧バージョンは使用しないでください</b>サポート窓口から指示があった場合のみ使用します。</span></div>
          ${t.old.map(o => `<div class="old-row"><span class="chip">版 ${esc(o.v)}</span><span class="num">公開 ${fmtDate(o.date)}</span><span>${esc(o.reason)}</span></div>`).join("")}
        </div></details>` : ""}
      </div>

      <aside class="wk-side">
        <section class="card prog">
          <div class="prog-top"><b>この作業の進み具合</b><strong>${pct}%</strong></div>
          <div class="bar"><span style="width:${pct}%"></span></div>
          <div class="prog-rows">
            <div><span>準備・持参品</span><span class="v ${pr.prepT && pr.prepD === pr.prepT ? "ok" : ""}">${pr.prepD}/${pr.prepT}</span></div>
            <div><span>ダウンロード</span><span class="v ${t.files.length && pr.fileD === t.files.length ? "ok" : ""}">${pr.fileD}/${t.files.length}</span></div>
            <div><span>作業手順</span><span class="v ${t.steps.length && pr.stepD === t.steps.length ? "ok" : ""}">${pr.stepD}/${t.steps.length}</span></div>
          </div>
          ${preview ? "" : `<div class="prog-actions">${t.steps.length ? `<button class="btn sm primary" type="button" data-act="focusStart" data-id="${esc(t.id)}">${ic("steps")}1手順ずつ表示</button>` : ""}<button class="btn sm ghost" type="button" data-act="resetProg">リセット</button></div>`}
        </section>
        <section class="card prog support-card">
          <b style="font-size:14px">困ったとき</b>
          <span style="font-size:13px">技術サポート窓口<br><strong style="font-size:18px">内線 4410</strong><br><span class="muted">作業ID <span class="mono">${esc(t.id)}</span> をお伝えください</span></span>
        </section>
      </aside>
    </div>
  </div></div>`;
}

function renderWork() {
  if (S.w.view === "task") {
    const t = taskById(S.w.taskId);
    if (t && t.status === "published") return wkDetail(t);
    S.w.view = "home";
  }
  return workHome();
}

/* 1手順ずつ表示・マニュアル */
function focusHtml() {
  const t = taskById(S.layer.id); const i = S.layer.i; const s = t.steps[i];
  const on = ((PROG[t.id] || {}).steps || {})[i];
  return `<div class="scrim" data-act="closeLayer"></div>
  <div class="focus" role="dialog" aria-modal="true" aria-label="作業手順">
    <div class="focus-top"><span class="t">${esc(t.id)}　${esc(t.title)}</span><button class="btn sm" type="button" data-act="closeLayer">閉じる</button></div>
    <div class="focus-bar"><span style="width:${(i + 1) / t.steps.length * 100}%"></span></div>
    <div class="focus-body">
      <span class="focus-no num">STEP ${i + 1} / ${t.steps.length}</span>
      <h2>${esc(s.title)}</h2>
      ${s.body ? `<p>${esc(s.body)}</p>` : ""}
      ${s.caution ? `<div class="note">${ic("alert")}<span><b>注意</b>${esc(s.caution)}</span></div>` : ""}
      <label class="focus-done ${on ? "on" : ""}"><input type="checkbox" data-wck="steps:${i}" ${on ? "checked" : ""}>この手順を完了した</label>
    </div>
    <div class="focus-foot">
      <button class="btn" type="button" data-act="focusGo" data-d="-1" ${i === 0 ? "disabled" : ""}>← 前へ</button>
      ${i < t.steps.length - 1 ? `<button class="btn primary" type="button" data-act="focusGo" data-d="1">次へ →</button>` : `<button class="btn primary" type="button" data-act="closeLayer">手順を閉じる</button>`}
    </div>
  </div>`;
}
function manualHtml() {
  const t = taskById(S.layer.id); const m = t.manuals[S.layer.i]; const pg = S.layer.page || 1;
  const pages = parseInt(m.meta) || 1;
  const body = m.kind === "動画"
    ? `<div class="video-mock">${ic("play")}<span>${esc(m.title)}<br><small>（サンプルのため再生されません）</small></span></div>`
    : m.kind === "Web"
    ? `<div class="page-mock"><h3>${esc(m.title)}</h3><p class="muted" style="font-size:13px">本番では社内Wikiのページを新しいタブで開きます。</p><div class="ln" style="width:90%"></div><div class="ln" style="width:75%"></div></div>`
    : `<div class="page-mock"><h3>${esc(m.title)}</h3><span class="muted num" style="font-size:12px">${esc(t.id)}　版 ${esc(t.version)}　p.${pg}</span>
        <div class="ln" style="width:92%"></div><div class="ln" style="width:85%"></div><div class="ln" style="width:70%"></div>
        <div class="img">［図 ${pg}-1］${esc((t.steps[(pg - 1) % Math.max(1, t.steps.length)] || {}).title || "画面イメージ")}</div>
        <div class="ln" style="width:88%"></div><div class="ln" style="width:60%"></div></div>`;
  return `<div class="scrim" data-act="closeLayer"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="マニュアル">
    <div class="drawer-h"><span class="chip accent">${esc(m.kind)}</span><h2>${esc(m.title)}</h2><button class="btn sm" type="button" data-act="closeLayer">閉じる</button></div>
    <div class="drawer-b">${body}</div>
    ${m.kind === "PDF" ? `<div class="drawer-f"><button class="btn sm" type="button" data-act="page" data-d="-1" ${pg <= 1 ? "disabled" : ""}>← 前のページ</button><span class="num">${pg} / ${pages}</span><button class="btn sm" type="button" data-act="page" data-d="1" ${pg >= pages ? "disabled" : ""}>次のページ →</button></div>` : "<div></div>"}
  </aside>`;
}

/* =========================================================
   設定画面
   ========================================================= */
function renderAdmin() {
  const sel = S.a.sel;
  const isTask = sel && sel.type === "task";
  return `<div class="adm ${sel ? "has-sel" : ""} ${isTask ? "pv-on" : ""}">
    <aside class="tree" id="tree">${treeHtml()}</aside>
    <main class="ed"><div class="ed-in" id="edIn">${!sel ? dashHtml() : sel.type === "cat" ? catEditor() : taskEditor()}</div></main>
    <aside class="pv" aria-label="スマホでの表示プレビュー">${isTask ? pvInner() : ""}</aside>
  </div>`;
}

function treeHtml() {
  const a = S.a, q = a.treeQ.trim().toLowerCase();
  const match = t => !q || t.title.toLowerCase().includes(q) || t.id.toLowerCase().includes(q) || t.devices.some(d => d.model.toLowerCase().includes(q));
  return `
    <div class="tree-h"><h2>作業マスタ</h2><button class="btn sm" type="button" data-act="addCat">${ic("plus")}大項目</button></div>
    <div class="tree-q"><input id="treeQ" type="search" placeholder="作業名・作業ID・型番で絞り込み" value="${esc(a.treeQ)}" aria-label="作業を絞り込み"></div>
    <button class="tree-home ${!a.sel ? "on" : ""}" type="button" data-act="selHome">${ic("grid")}概要・入力状況</button>
    <div class="tree-label">大項目 ／ 小項目</div>
    <div class="tree-list">
      ${catsSorted().map(c => {
        const ts = tasksOf(c.id).filter(match);
        if (q && !ts.length && !c.name.toLowerCase().includes(q)) return "";
        const open = q ? true : a.open[c.id];
        const on = a.sel && a.sel.type === "cat" && a.sel.id === c.id;
        return `<div>
          <div class="tc-row">
            <button class="tc-tog ${open ? "open" : ""}" type="button" data-act="tog" data-id="${c.id}" aria-label="${esc(c.name)}を${open ? "閉じる" : "開く"}" aria-expanded="${!!open}">${ic("chev")}</button>
            <button class="tc-main ${on ? "on" : ""}" type="button" data-act="selCat" data-id="${c.id}"><span class="ic">${ic(c.icon)}</span><span class="nm">${esc(c.name)}</span><span class="ct">${tasksOf(c.id).length}</span></button>
          </div>
          ${open ? `<div class="tt-list">
            ${ts.map(t => {
              const ton = a.sel && a.sel.type === "task" && a.sel.id === t.id;
              const miss = missing(t).length;
              return `<button class="tt ${ton ? "on" : ""}" type="button" data-act="selTask" data-id="${t.id}"><span class="dot ${t.status === "published" ? "pub" : "draft"}"></span><span class="nm">${esc(t.title)}</span>${miss ? `<span class="warn" title="未入力の項目があります">未入力 ${miss}</span>` : ""}</button>`;
            }).join("")}
            <button class="tt-add" type="button" data-act="addTask" data-id="${c.id}">${ic("plus")}小項目を追加</button>
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
    <div class="tree-legend"><span><span class="dot pub"></span>公開中</span><span><span class="dot draft"></span>下書き（現場に非表示）</span></div>`;
}

function dashHtml() {
  const ts = DATA.tasks;
  const pub = ts.filter(t => t.status === "published").length;
  const need = ts.filter(t => missing(t).length);
  const recent = [...ts].sort((a, b) => b.updated.localeCompare(a.updated)).slice(0, 5);
  return `<div class="dash">
    <div class="dash-h">
      <h1>作業マスタの管理</h1>
      <p>左の一覧から大項目・小項目を選んで編集します。小項目の編集中は、右側に現場のスマホでの見え方がそのまま表示されます。</p>
    </div>
    <div class="stats">
      <div class="card stat"><small>大項目</small><b>${DATA.categories.length}</b></div>
      <div class="card stat ok"><small>公開中の作業</small><b>${pub}</b></div>
      <div class="card stat"><small>下書き</small><b>${ts.length - pub}</b></div>
      <div class="card stat warn"><small>入力が足りない作業</small><b>${need.length}</b></div>
    </div>
    <section class="card">
      <div class="blk-h" style="padding:16px 18px 8px"><h3>入力が足りない作業</h3></div>
      <div class="todo">${need.length ? need.map(t => `<button class="todo-row" type="button" data-act="selTask" data-id="${t.id}">
        <span style="display:grid;gap:4px;min-width:0"><b>${esc(t.title)}</b><span class="miss">${missing(t).map(m => `<span class="chip warn">${m}</span>`).join("")}</span></span>
        <small class="num">${t.id}・${t.status === "published" ? "公開中" : "下書き"}</small>
      </button>`).join("") : `<p class="muted" style="padding:4px 18px 12px;font-size:13px">すべての作業で必要な項目が入力されています。</p>`}</div>
    </section>
    <section class="card">
      <div class="blk-h" style="padding:16px 18px 8px"><h3>最近更新した作業</h3></div>
      <div class="todo">${recent.map(t => `<button class="todo-row" type="button" data-act="selTask" data-id="${t.id}">
        <span style="display:grid;gap:2px;min-width:0"><b>${esc(t.title)}</b><small>${esc(catOf(t.cat).name)}</small></span>
        <small class="num">${fmtDate(t.updated)}</small>
      </button>`).join("")}</div>
    </section>
    <div class="flow">
      <div class="card flow-i"><b><span class="n">1</span>大項目を作る</b>「POSレジ 設置」のような作業のまとまりです。アイコンを選ぶと、現場のカテゴリに表示されます。</div>
      <div class="card flow-i"><b><span class="n">2</span>小項目を登録する</b>機器・型番、準備、持参品、ファイル、手順、マニュアルをタブごとに入力します。</div>
      <div class="card flow-i"><b><span class="n">3</span>公開する</b>「公開設定」で公開にして保存すると、現場の検索結果にすぐ表示されます。</div>
    </div>
    <p style="font-size:12.5px"><button class="link" type="button" data-act="resetData">サンプルデータに戻す</button></p>
  </div>`;
}

function catEditor() {
  const d = S.a.draft, ts = tasksOf(d.id);
  return `
    <div class="ed-head">
      <div class="ed-crumb"><button class="back ed-back" type="button" data-act="selHome">${ic("chev")}一覧</button><span>大項目</span></div>
      <div class="ed-title-row">
        <input class="ed-title" id="f-name" data-bind="name" value="${esc(d.name)}" placeholder="大項目の名前" aria-label="大項目の名前">
        <div class="ed-acts"><button class="btn sm ghost danger" type="button" data-act="delCat">${ic("trash")}削除</button></div>
      </div>
    </div>
    <div class="sect">
      <section class="card blk">
        <div class="blk-h"><h3>表示内容</h3><p>現場ビューのトップに、カテゴリとして表示されます。</p></div>
        <div class="fld"><label for="f-desc">説明（1行）</label><input class="inp" id="f-desc" data-bind="desc" value="${esc(d.desc)}" placeholder="例：POS端末本体と周辺機器の新規設置・初期設定"></div>
        <div class="fld"><span class="lb">アイコン</span>
          <div class="icon-pick" role="group" aria-label="アイコン">${CAT_ICONS.map(n => `<button type="button" data-act="setIcon" data-v="${n}" aria-pressed="${d.icon === n}" aria-label="アイコン ${n}">${ic(n)}</button>`).join("")}</div>
        </div>
      </section>
      <section class="card blk">
        <div class="blk-h"><h3>小項目と並び順</h3><span class="chip right">${ts.length}件</span><p>並び順は現場の一覧にそのまま反映されます。並べ替えはすぐに保存されます。</p></div>
        <div class="order-list">${ts.map((t, i) => `<div class="order-row">
          <span class="dot ${t.status === "published" ? "pub" : "draft"}"></span>
          <button class="nm" type="button" data-act="selTask" data-id="${t.id}">${esc(t.title)}</button>
          <span class="mono muted" style="font-size:11.5px">${t.id}</span>
          <span class="tools"><button class="icon-btn" type="button" data-act="taskMv" data-id="${t.id}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="上へ">${ic("up")}</button><button class="icon-btn" type="button" data-act="taskMv" data-id="${t.id}" data-d="1" ${i === ts.length - 1 ? "disabled" : ""} aria-label="下へ">${ic("down")}</button></span>
        </div>`).join("") || `<div class="empty-row">まだ小項目がありません</div>`}</div>
        <button class="add-row" type="button" data-act="addTask" data-id="${d.id}">${ic("plus")}小項目を追加</button>
      </section>
    </div>`;
}

function tabsHtml() {
  const s = sectionState(S.a.draft);
  return TABS.map(([k, n]) => {
    const v = s[k];
    const badge = v === "ok" ? `<span class="tb ok">${ic("check")}</span>`
      : v === "need" ? `<span class="tb need">未入力</span>`
      : v === "draft" ? `<span class="tb n">下書き</span>`
      : typeof v === "number" ? `<span class="tb n">${v}</span>` : "";
    return `<button class="tab ${S.a.tab === k ? "on" : ""}" type="button" data-act="tab" data-v="${k}" role="tab" aria-selected="${S.a.tab === k}">${n}${badge}</button>`;
  }).join("");
}

function taskEditor() {
  const d = S.a.draft, c = catOf(d.cat);
  return `
    <div class="ed-head">
      <div class="ed-crumb"><button class="back ed-back" type="button" data-act="selHome">${ic("chev")}一覧</button><span>${esc(c.name)}</span><span>/</span><span class="mono">${esc(d.id)}</span></div>
      <div class="ed-title-row">
        <input class="ed-title ${d.title.trim() ? "" : "err"}" id="f-title" data-bind="title" value="${esc(d.title)}" placeholder="作業名を入力" aria-label="作業名">
        <div class="ed-acts">
          <span class="status-pill ${d.status === "published" ? "pub" : "draft"}" id="statusPill"><span class="dot"></span>${d.status === "published" ? "公開中" : "下書き"}</span>
          <button class="btn sm pv-btn" type="button" data-act="pvOpen">${ic("phone")}スマホで確認</button>
          <button class="btn sm ghost" type="button" data-act="dupTask">${ic("dup")}複製</button>
          <button class="btn sm ghost danger" type="button" data-act="delTask" aria-label="この作業を削除">${ic("trash")}</button>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">${tabsHtml()}</nav>
    <div id="secBody">${sectionHtml()}</div>`;
}

/* 入力部品 */
const fid = p => "f-" + p.replace(/\./g, "-");
const inp = (p, v, ph = "", cls = "") => `<input class="inp ${cls}" id="${fid(p)}" data-bind="${p}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const fld = (label, p, inner, opt = {}) => `<div class="fld ${opt.full ? "full" : ""}"><label for="${fid(p)}">${label}${opt.req ? "<em>必須</em>" : ""}</label>${inner}${opt.hint ? `<p class="hint">${opt.hint}</p>` : ""}</div>`;
const toolBtns = (list, i, len) => `
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="上へ移動">${ic("up")}</button>
  <button class="icon-btn" type="button" data-act="mv" data-l="${list}" data-i="${i}" data-d="1" ${i === len - 1 ? "disabled" : ""} aria-label="下へ移動">${ic("down")}</button>
  <button class="icon-btn del" type="button" data-act="rm" data-l="${list}" data-i="${i}" aria-label="削除">${ic("x")}</button>`;
const tools = (list, i, len) => `<span class="tools">${toolBtns(list, i, len)}</span>`;
const addBtn = (list, label) => `<button class="add-row" type="button" data-act="add" data-l="${list}">${ic("plus")}${label}</button>`;

function sectionHtml() {
  const d = S.a.draft;
  switch (S.a.tab) {
    case "basic": return `<div class="sect">
      <p class="sect-intro">現場担当者が検索結果で最初に目にする情報です。</p>
      <section class="card blk"><div class="fgrid">
        ${fld("作業内容の概要", "summary", `<textarea class="ta ${d.summary.trim() ? "" : "err"}" id="f-summary" data-bind="summary" rows="3" placeholder="例：新規導入店舗で POS 端末にイメージを適用し、印字とドロア開閉までを確認します。">${esc(d.summary)}</textarea>`, { full: true, req: true, hint: "2〜3行が目安です。「何を」「どこまで」行う作業かを書きます。" })}
        ${fld("大項目", "cat", `<select class="sel" id="f-cat" data-bind="cat">${catsSorted().map(c => `<option value="${c.id}" ${c.id === d.cat ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`)}
        <div class="fld"><label for="f-id">作業ID</label><input class="inp mono" id="f-id" value="${esc(d.id)}" disabled><p class="hint">自動で採番されます。電話での問い合わせ時に使います。</p></div>
        ${fld("所要時間（目安）", "minutes", `<div class="with-unit"><input class="inp num" type="number" min="0" step="5" id="f-minutes" data-bind="minutes" data-type="num" value="${esc(d.minutes)}"><span>分</span></div>`)}
        ${fld("作業人数", "people", `<div class="with-unit"><input class="inp num" type="number" min="1" id="f-people" data-bind="people" data-type="num" value="${esc(d.people)}"><span>名</span></div>`)}
        <div class="fld full"><span class="lb">対象業種</span><div class="toggles" role="group" aria-label="対象業種">${INDUSTRIES.map(i => `<button type="button" data-act="togInd" data-v="${i}" aria-pressed="${d.industries.includes(i)}">${i}</button>`).join("")}</div><p class="hint">現場ビューの業種フィルタに使われます。</p></div>
        <div class="fld full"><label for="tagIn">検索キーワード</label>
          <div class="tags">${d.tags.map((t, i) => `<span class="tag">${esc(t)}<button type="button" data-act="rmTag" data-i="${i}" aria-label="${esc(t)}を削除">${ic("x")}</button></span>`).join("")}<input id="tagIn" placeholder="入力して Enter で追加" enterkeyhint="enter"></div>
          <p class="hint">作業名や型番以外で探されそうな言葉（例：新規導入、入れ替え、釣銭機）を登録します。</p></div>
      </div></section></div>`;

    case "dev": return `<div class="sect">
      <p class="sect-intro">型番は現場の検索に使われます。機器ラベルに書かれているとおりに入力してください。</p>
      <section class="card blk">
        <div class="blk-h"><h3>対象機器</h3><span class="chip right">${d.devices.length}台</span></div>
        ${d.devices.length ? `<div class="cols-h row-dev"><span>機器種別</span><span>機器名</span><span>型番</span><span>備考</span><span></span></div>` : ""}
        <div class="rows">${d.devices.map((x, i) => `<div class="row row-dev">
          ${inp(`devices.${i}.type`, x.type, "例：POS端末")}
          ${inp(`devices.${i}.name`, x.name, "例：POSターミナル 15型")}
          ${inp(`devices.${i}.model`, x.model, "型番", "mono")}
          ${inp(`devices.${i}.note`, x.note, "備考（任意）")}
          ${tools("devices", i, d.devices.length)}
        </div>`).join("") || `<div class="empty-row">対象機器がまだありません</div>`}</div>
        ${addBtn("devices", "機器を追加")}
      </section>
      <section class="card blk"><div class="fgrid">
        ${fld("OS・ソフトウェアの版", "os", inp("os", d.os, "例：POS OS 5（Windows IoT Enterprise ベース）"), { full: true, hint: "対象となる OS や、前提となるソフトウェアのバージョンを入力します。" })}
      </div></section></div>`;

    case "prep": return `<div class="sect">
      <p class="sect-intro">現場ではチェックリストとして表示されます。1行に1項目ずつ、短く書いてください。</p>
      <section class="card blk">
        <div class="blk-h"><h3>事前確認</h3><span class="chip right">${d.precheck.length}件</span><p>作業を始める前に満たしておく条件（工事の完了、データの準備など）。</p></div>
        <div class="rows">${d.precheck.map((x, i) => `<div class="row row-pre"><span class="row-no">${i + 1}</span>${inp(`precheck.${i}`, x, "例：店舗の LAN 配線と電源工事が完了している")}${tools("precheck", i, d.precheck.length)}</div>`).join("") || `<div class="empty-row">事前確認はまだありません</div>`}</div>
        ${addBtn("precheck", "事前確認を追加")}
      </section>
      <section class="card blk">
        <div class="blk-h"><h3>現地持参品</h3><span class="chip right">${d.bring.length}件</span><p>出発前に確認する持ち物。「必須」にした品は現場で赤く表示されます。</p></div>
        <div class="rows">${d.bring.map((x, i) => `<div class="row row-bring">
          ${inp(`bring.${i}.name`, x.name, "品名（例：LANケーブル 3m）")}
          ${inp(`bring.${i}.qty`, x.qty, "数量")}
          <button class="req-tg ${x.required ? "on" : ""}" type="button" data-act="togReq" data-i="${i}" aria-pressed="${!!x.required}">${x.required ? "必須" : "任意"}</button>
          ${tools("bring", i, d.bring.length)}
        </div>`).join("") || `<div class="empty-row">持参品はまだありません</div>`}</div>
        ${addBtn("bring", "持参品を追加")}
      </section></div>`;

    case "files": return `<div class="sect">
      <p class="sect-intro">現場でダウンロードするファイルです。追加すると、破損確認用のハッシュ値（SHA-256）が自動で計算されます。</p>
      <section class="card blk">
        <label class="drop" for="fileIn" id="drop">${ic("upload")}<b>ここにファイルをドラッグ＆ドロップ</b><span>またはクリックしてファイルを選択（zip・exe・msi・bin など）</span></label>
        <div class="rows">${d.files.map((x, i) => `<div class="row row-file">
          <span class="file-ico">${ic(/\.zip$/i.test(x.name) ? "zip" : "file")}</span>
          <span style="display:grid;gap:2px;min-width:0"><span class="fn">${esc(x.name)}</span><span class="fm"><span class="num">${fmtBytes(x.size)}</span><span>SHA-256 <span class="mono">${esc(String(x.sha).slice(0, 12))}${String(x.sha).length > 12 ? "…" : ""}</span></span></span></span>
          ${inp(`files.${i}.desc`, x.desc, "説明（例：POS アプリ本体）")}
          ${tools("files", i, d.files.length)}
        </div>`).join("") || `<div class="empty-row">ファイルはまだありません。ファイルを使わない作業はこのままで構いません。</div>`}</div>
      </section>
      <section class="card blk"><div class="fgrid">
        ${fld("展開先フォルダ", "extractTo", inp("extractTo", d.extractTo, "C:\\Setup\\WK-xxxx", "mono"), { full: true, hint: "現場には、このフォルダへ展開する PowerShell コマンドが自動で表示されます。" })}
      </div></section></div>`;

    case "steps": return `<div class="sect">
      <p class="sect-intro">現場では番号付きの手順として表示され、スマホでは「1手順ずつ表示」で大きく読めます。手順名を押すと説明を編集できます。</p>
      <div class="rows">${d.steps.map((s, i) => {
        const open = S.a.stepOpen.has(i);
        return `<div class="step-ed ${open ? "open" : ""}">
          <div class="step-ed-h">
            <span class="row-no">${i + 1}</span>
            <input class="inp" id="${fid(`steps.${i}.title`)}" data-bind="steps.${i}.title" value="${esc(s.title)}" placeholder="手順名（例：機器の設置と配線）" data-focus-open="${i}">
            <span class="tools">
              ${open ? "" : `<span class="step-flags">${s.body ? "" : `<span class="chip warn">説明なし</span>`}${s.caution ? `<span class="chip warn">${ic("alert")}注意あり</span>` : ""}</span>`}
              <button class="icon-btn" type="button" data-act="stepTog" data-i="${i}" aria-label="${open ? "説明を閉じる" : "説明を開く"}" aria-expanded="${open}">${ic(open ? "up" : "down")}</button>
              <span style="width:1px;height:18px;background:var(--line);margin:0 4px"></span>
              ${toolBtns("steps", i, d.steps.length)}
            </span>
          </div>
          ${open ? `<div class="step-ed-b">
            ${fld("説明", `steps.${i}.body`, `<textarea class="ta" id="${fid(`steps.${i}.body`)}" data-bind="steps.${i}.body" rows="3" placeholder="現場で読んで分かるように、操作の順番どおりに書きます。改行も反映されます。">${esc(s.body)}</textarea>`)}
            ${fld("注意点（任意）", `steps.${i}.caution`, inp(`steps.${i}.caution`, s.caution, "例：途中で電源を切るとやり直しになります。"), { hint: "入力すると、現場では黄色の注意枠で表示されます。" })}
          </div>` : ""}
        </div>`;
      }).join("") || `<div class="empty-row">手順がまだありません</div>`}</div>
      ${addBtn("steps", "手順を追加")}</div>`;

    case "man": return `<div class="sect">
      <p class="sect-intro">PDF の手順書、作業動画、社内Wikiのページなどを登録できます。現場ではポータル上でそのまま開けます。</p>
      <section class="card blk">
        ${d.manuals.length ? `<div class="cols-h row-man"><span>種類</span><span>タイトル</span><span>ページ数・時間</span><span>更新日</span><span></span></div>` : ""}
        <div class="rows">${d.manuals.map((m, i) => `<div class="row row-man">
          <select class="sel" id="${fid(`manuals.${i}.kind`)}" data-bind="manuals.${i}.kind" aria-label="種類">${["PDF", "動画", "Web"].map(k => `<option ${k === m.kind ? "selected" : ""}>${k}</option>`).join("")}</select>
          ${inp(`manuals.${i}.title`, m.title, "タイトル")}
          ${inp(`manuals.${i}.meta`, m.meta, m.kind === "動画" ? "例：8分" : "例：32ページ")}
          <input class="inp num" type="date" id="${fid(`manuals.${i}.updated`)}" data-bind="manuals.${i}.updated" value="${esc(m.updated)}" aria-label="更新日">
          ${tools("manuals", i, d.manuals.length)}
        </div>`).join("") || `<div class="empty-row">マニュアルはまだありません</div>`}</div>
        ${addBtn("manuals", "マニュアルを追加")}
      </section></div>`;

    case "pub": {
      const miss = missing(d);
      return `<div class="sect">
      <section class="card blk">
        <div class="blk-h"><h3>公開状態</h3></div>
        <div class="radio-cards">
          <button class="rc" type="button" data-act="setStatus" data-v="draft" aria-pressed="${d.status === "draft"}"><b><span class="dot draft"></span>下書き</b><span>現場には表示されません。準備中の作業はこちらにします。</span></button>
          <button class="rc pub" type="button" data-act="setStatus" data-v="published" aria-pressed="${d.status === "published"}"><b><span class="dot pub"></span>公開</b><span>保存すると、現場の検索結果にすぐ表示されます。</span></button>
        </div>
        ${miss.length ? `<div class="note">${ic("alert")}<span><b>公開する前に入力が必要です</b>${miss.join("、")} が未入力です。</span></div>` : `<div class="note info">${ic("check")}<span>公開に必要な項目はすべて入力されています。</span></div>`}
      </section>
      <section class="card blk"><div class="fgrid">
        ${fld("版（バージョン）", "version", inp("version", d.version, "例：5.3", "mono"), { hint: "公開中の作業で版を変えて保存すると、前の版は「旧バージョン」として現場で折りたたみ表示されます。" })}
        <div class="fld"><label for="f-updated">最終更新日</label><input class="inp num" id="f-updated" value="${fmtDate(d.updated)}" disabled></div>
        ${fld("変更内容のメモ", "changelog", `<textarea class="ta" id="f-changelog" data-bind="changelog" rows="2" placeholder="例：POS アプリ 5.3.1 に更新。イメージ適用手順を簡略化。">${esc(d.changelog)}</textarea>`, { full: true })}
      </div>
      ${d.old.length ? `<div class="fld"><span class="lb">旧バージョン</span><div class="rows">${d.old.map(o => `<div class="row" style="grid-template-columns:auto auto minmax(0,1fr);font-size:13px"><span class="chip">版 ${esc(o.v)}</span><span class="num muted">${fmtDate(o.date)}</span><span class="muted">${esc(o.reason)}</span></div>`).join("")}</div></div>` : ""}
      </section></div>`;
    }
  }

}

function renderSavebar() {
